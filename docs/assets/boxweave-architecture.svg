<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="600" viewBox="0 0 1120 600" role="img" aria-labelledby="title desc">
  <title id="title">BoxWeave architecture</title>
  <desc id="desc">An operator authorizes an AI agent, which uses authenticated MCP to reach BoxWeave on a Linux host. BoxWeave manages owned containers in a restricted Incus Project. Example Web and API Boxes have explicit directional access to the API and Database Boxes respectively; the Test Box has no peer grant.</desc>
  <defs>
    <marker id="control-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0L9 4.5L0 9Z" fill="#52647c"/>
    </marker>
    <marker id="peer-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0L10 5L0 10Z" fill="#087f73"/>
    </marker>
  </defs>
  <rect width="1120" height="600" rx="16" fill="#f8fafc"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#17283e">
    <rect x="48" y="30" width="245" height="82" rx="12" fill="#ffffff" stroke="#c6d2df" stroke-width="1.5"/>
    <circle cx="79" cy="57" r="9" fill="#52647c"/>
    <path d="M65 80c0-16 28-16 28 0" fill="none" stroke="#52647c" stroke-width="3" stroke-linecap="round"/>
    <text x="110" y="64" font-size="22" font-weight="700">Operator</text>
    <text x="110" y="88" font-size="15" fill="#52647c">Approves access</text>

    <path d="M293 71H385" fill="none" stroke="#52647c" stroke-width="2" marker-end="url(#control-arrow)"/>
    <text x="339" y="58" font-size="13" text-anchor="middle" fill="#52647c">Authorizes</text>

    <rect x="385" y="30" width="350" height="82" rx="12" fill="#eaf1ff" stroke="#9bb8ec" stroke-width="1.5"/>
    <text x="560" y="65" font-size="23" font-weight="700" text-anchor="middle">AI agent / MCP client</text>
    <text x="560" y="89" font-size="15" fill="#435b7e" text-anchor="middle">Plans, builds and tests</text>

    <rect x="26" y="171" width="1068" height="404" rx="16" fill="#ffffff" stroke="#9baec3" stroke-width="1.5"/>
    <text x="48" y="203" font-size="17" font-weight="700" fill="#52647c">SELF-HOSTED LINUX HOST</text>
    <text x="1070" y="203" font-size="14" text-anchor="end" fill="#52647c">No general-purpose host shell for the agent</text>

    <path d="M560 112V225" fill="none" stroke="#52647c" stroke-width="2.5" marker-end="url(#control-arrow)"/>
    <rect x="576" y="127" width="187" height="28" rx="6" fill="#f8fafc"/>
    <text x="585" y="146" font-size="15" font-weight="700" fill="#435b7e">Authenticated MCP</text>

    <rect x="385" y="225" width="350" height="76" rx="12" fill="#17365a"/>
    <text x="560" y="255" font-size="24" font-weight="700" text-anchor="middle" fill="#ffffff">BoxWeave</text>
    <text x="560" y="280" font-size="15" text-anchor="middle" fill="#d9e8f8">Ownership · Operations · Recovery</text>

    <rect x="48" y="341" width="1024" height="176" rx="13" fill="#f0f8f7" stroke="#68a89f" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="70" y="367" font-size="16" font-weight="700" fill="#17675e">RESTRICTED INCUS PROJECT</text>
    <path d="M560 301V385 M171.5 385H948.5" fill="none" stroke="#52647c" stroke-width="2"/>
    <rect x="575" y="307" width="310" height="25" rx="5" fill="#ffffff"/>
    <text x="585" y="325" font-size="15" fill="#52647c">Native operations on owned Boxes</text>

    <g stroke="#52647c" stroke-width="2" fill="none" marker-end="url(#control-arrow)">
      <path d="M171.5 385V405"/>
      <path d="M430.5 385V405"/>
      <path d="M689.5 385V405"/>
      <path d="M948.5 385V405"/>
    </g>
    <g fill="#ffffff" stroke="#68a89f" stroke-width="1.5">
      <rect x="78" y="405" width="187" height="86" rx="10"/>
      <rect x="337" y="405" width="187" height="86" rx="10"/>
      <rect x="596" y="405" width="187" height="86" rx="10"/>
      <rect x="855" y="405" width="187" height="86" rx="10"/>
    </g>
    <g font-size="20" font-weight="700" text-anchor="middle">
      <text x="171.5" y="438">Web Box</text>
      <text x="430.5" y="438">API Box</text>
      <text x="689.5" y="438">Database Box</text>
      <text x="948.5" y="438">Test Box</text>
    </g>
    <g font-size="14" fill="#52647c" text-anchor="middle">
      <text x="171.5" y="464">Linux container</text>
      <text x="430.5" y="464">Linux container</text>
      <text x="689.5" y="464">Linux container</text>
      <text x="948.5" y="464">Linux container</text>
    </g>
    <g stroke="#087f73" stroke-width="2.5" stroke-dasharray="6 4" fill="none" marker-end="url(#peer-arrow)">
      <path d="M267 448H334"/>
      <path d="M526 448H593"/>
    </g>
    <g font-size="14" fill="#52647c">
      <path d="M70 544H108" fill="none" stroke="#52647c" stroke-width="2" marker-end="url(#control-arrow)"/>
      <text x="120" y="549">Management</text>
      <path d="M251 544H289" fill="none" stroke="#087f73" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#peer-arrow)"/>
      <text x="301" y="549" fill="#17675e">Explicit directional Peer grant</text>
      <text x="1050" y="549" text-anchor="end">Private peer access denied by default</text>
    </g>
  </g>
</svg>
