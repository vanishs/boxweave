name: v1 stable release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the verified stable release (unchecked: build only)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: v1-stable-release
  cancel-in-progress: false

jobs:
  source:
    name: stable-candidate-source
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require current protected v1 source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          test "$GITHUB_REF" = refs/heads/v1
          test "$GITHUB_REF_PROTECTED" = true
          test "$GITHUB_REPOSITORY" = vanishs/boxweave
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/v1" --jq .object.sha)" = "$GITHUB_SHA"
          grep -Exq '1\.[0-9]+\.[0-9]+' VERSION
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: |
          make verify
          sh -n install.sh
          sh -n uninstall.sh
          python3 -m unittest -v scripts/test_v1_release_manifest.py
          python3 scripts/test_ci_candidate_build.py

  build:
    needs: source
    name: stable-candidate-build-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build and smoke actual stable-version bytes on native architecture
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(go env GOARCH)" = "$ARCH"
          test "$(go env CGO_ENABLED)" = 1
          version="$(cat VERSION)"
          mkdir release-assets
          binary="release-assets/boxweave-v$version-linux-$ARCH"
          python3 scripts/ci_candidate_build.py "$version" "$GITHUB_SHA" "$ARCH" "$binary"
          go test -count=1 ./...
          sha256sum "$binary"
      - uses: actions/upload-artifact@v4
        with:
          name: v1-stable-bin-${{ matrix.arch }}
          path: release-assets/
          if-no-files-found: error
          overwrite: true
          retention-days: 30

  package:
    name: stable-candidate-package
    needs: [source, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: v1-stable-bin-*
          merge-multiple: true
          path: release-assets
      - name: Package immutable candidate; no stable release or pointer change
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/v1" --jq .object.sha)" = "$GITHUB_SHA"
          python3 scripts/v1_release_manifest.py --directory release-assets \
            --tag "v$(cat VERSION)" --source "$GITHUB_SHA" --installer install.sh
          python3 - <<'PY'
          import sys, os
          from pathlib import Path
          sys.path.insert(0, "scripts")
          from v1_stable_gate import verify_assets
          print(verify_assets(Path("release-assets"), "v"+Path("VERSION").read_text().strip(),
                              os.environ["GITHUB_SHA"], Path(".")))
          PY
          (cd release-assets && sha256sum -c SHA256SUMS)
          echo STABLE_CANDIDATE_PACKAGED_NOT_PUBLISHED
      - uses: actions/upload-artifact@v4
        with:
          name: v1-stable-assets
          path: release-assets/
          if-no-files-found: error
          overwrite: true
          retention-days: 30

  publish:
    name: stable-release-publish
    needs: package
    if: inputs.publish == true
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: v1-stable-assets
          path: release-assets
      - name: Resume or publish exact verified assets through a draft
        env:
          GH_TOKEN: ${{ github.token }}
          STABLE_PUBLISH_AUTHORIZED: 'true'
        run: python3 scripts/v1_stable_release_ci.py --assets release-assets
