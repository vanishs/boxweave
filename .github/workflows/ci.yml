name: Static and fixture-safe validation
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: 'Successful main-push CI run containing the exact verified candidate artifact'
        required: false
        type: string
      verifier_run_id:
        description: 'Existing separate trusted Verifier workflow run with signed installed evidence'
        required: false
        type: string
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Documentation, release metadata, and traceability
        run: python scripts/check_knowledge.py
      - name: Code-first source and acceptance inventory drift guard
        run: |
          python - <<'PY_CODE_FIRST'
          from pathlib import Path
          import ast
          import re

          doc = Path("docs/verification/CODE_FIRST_ACCEPTANCE_2026-11-01.md").read_text()
          source = lambda name: Path(name).read_text()
          names = lambda pattern: {p.as_posix() for p in Path(".").glob(pattern) if p.is_file()}
          matches = lambda pattern, value: set(re.findall(pattern, value))

          def recorded(key):
              match = re.search(
                  r"<!-- inventory:" + re.escape(key) + r":start -->\s*(.*?)\s*<!-- inventory:" +
                  re.escape(key) + r":end -->", doc, re.S
              )
              if match is None:
                  raise AssertionError("Inventory section missing: " + key)
              return matches(r"`([^`]+)`", match.group(1))

          def cli_choices():
              for node in ast.walk(ast.parse(source("bwmini/__main__.py"))):
                  if isinstance(node, ast.Call) and isinstance(node.func, ast.Attribute) and node.func.attr == "add_argument":
                      if node.args and isinstance(node.args[0], ast.Constant) and node.args[0].value == "action":
                          return set(ast.literal_eval(next(k.value for k in node.keywords if k.arg == "choices")))
              raise AssertionError("Application action selector absent")

          def host_actions():
              return {
                  node.args[0].value for node in ast.walk(ast.parse(source("bwmini/host_cli.py")))
                  if isinstance(node, ast.Call) and isinstance(node.func, ast.Attribute)
                  and node.func.attr == "add_parser" and node.args
                  and isinstance(node.args[0], ast.Constant) and isinstance(node.args[0].value, str)
              }

          def routes(path):
              result = set()
              for method, path_, methods in re.findall(
                  r'@app\.(get|post|put|delete|route)\("([^"]+)"(?:,\s*methods=\[([^\]]+)\])?\)', source(path)
              ):
                  kind = ",".join(re.findall(r'"([^"]+)"', methods)) if method == "route" else method.upper()
                  result.add(kind + " " + path_)
              return result

          app_source = source("bwmini/client_profiles.py")
          catalog = re.search(r"APPS\s*=\s*\(([^)]+)\)", app_source)
          assert catalog, "Client catalog missing"
          owned_tools = source("bwmini/mcp_gate.py") + source("bwmini/gate_diagnostics.py") + source("bwmini/box_reads.py") + source("bwmini/gateway_tasks.py") + source("bwmini/gateway_protection.py")
          expected = {
              "python-modules": names("bwmini/*.py"),
              "unit-tests": names("tests/test_*.py"),
              "client-scripts": names("clients/**/*.py") | names("clients/**/*.ps1"),
              "support-scripts": names("scripts/*.py"),
              "web-sources": names("web/src/*"),
              "app-cli": cli_choices(),
              "host-cli": host_actions(),
              "web-api": routes("bwmini/web.py"),
              "remote-api": routes("bwmini/remote_mcp.py"),
              "gateway-tools": matches(r'"name":\s*"(boxweave_[a-z_]+)"', owned_tools),
              "client-apps": matches(r'"([^"]+)"', catalog.group(1)),
              "web-views": matches(r"view==='([^']+)'", source("web/src/main.tsx")),
          }
          for section, discovered in expected.items():
              listed = recorded(section)
              if discovered != listed:
                  raise AssertionError(
                      section + ": undocumented=" + repr(sorted(discovered - listed)) +
                      "; stale=" + repr(sorted(listed - discovered))
                  )
              print(section, len(listed), "recorded")
          PY_CODE_FIRST
      - name: Safe shell syntax
        run: |
          bash -n install.sh
          bash -n boxweave.sh
      - name: Install locked Python test dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Reacceptance proof-oracle self-test and CLI surface drift gate
        run: |
          python -m tools.reacceptance.cli self-test
          mkdir -p -m 700 .runtime/reacceptance-ci
          echo '["python","-m","bwmini.host_cli"]' > .runtime/reacceptance-ci/host-argv.json
          python -m tools.reacceptance.cli inventory --root . --host-argv-json .runtime/reacceptance-ci/host-argv.json --out .runtime/reacceptance-ci/inventory.json
          python - <<'PY_RACC_SURFACE'
          import json
          from pathlib import Path
          inv = json.loads(Path('.runtime/reacceptance-ci/inventory.json').read_text())
          source = set(inv['source']['host_cli'])
          advertised = set(inv['runtime']['host_advertised'])
          hidden = source - advertised
          assert not hidden, f'Hidden callable top-level host command(s): {sorted(hidden)}'
          assert len(inv['feature_catalogue']) == 49
          assert not any(a['status'] == 'PASS' for a in inv['actions']), "Discovery is not acceptance"
          print(f'Reacceptance discovery reviewed: {len(inv["actions"])} source actions; no catalog-only PASS')
          PY_RACC_SURFACE
          python -m tools.reacceptance.cli bootstrap-readonly --root . --out .runtime/reacceptance-ci/read-only-run
          python -m tools.reacceptance.cli seal --run .runtime/reacceptance-ci/read-only-run
          python -m tools.reacceptance.cli verify --run .runtime/reacceptance-ci/read-only-run

      - name: External reacceptance automation fail-closed regressions
        run: python -m unittest tests.test_reacceptance_system -v
      - name: Python unit and contract tests (fixtures only)
        run: python -m unittest discover -s tests -v
      - name: Unified Python client generator grammar and first-line shebang
        run: |
          python - <<'PY_CLIENT'
          import base64, struct
          from pathlib import Path
          from bwmini.client_setup import render
          key = base64.b64encode(struct.pack(">I",11)+b"ssh-ed25519"+struct.pack(">I",32)+b"x"*32).decode()
          state = {"host":"192.168.2.233","port":22,"server_key":"ssh-ed25519 "+key}
          for app in ("codex", "zcode"):
              for transport in ("native", "wsl"):
                  output = render(state, "example-admin", app=app, system="windows", transport=transport)
                  assert output.startswith("#!/usr/bin/env python3\n# ===")
                  compile(output, "boxweave-fixture-client.py", "exec")
                  assert "ServerAliveInterval=15" in output
                  assert "ServerAliveCountMax=4" in output
          PY_CLIENT
      - name: Frontend typecheck and build
        run: |
          npm --prefix web ci --ignore-scripts --no-audit --no-fund
          npm --prefix web run build
      - name: Install fixture browser
        run: python -m playwright install --with-deps chromium
      - name: Seven fixture browser workflows
        run: python scripts/validate.py --browser-only
      - name: Retain fixture validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fixture-browser-evidence
          path: |
            .runtime/validation/
            .runtime/**/result.json
            .runtime/**/*.png
          if-no-files-found: ignore
      - name: Build reviewed application candidate
        run: |
          mkdir -p .runtime/release
          for minor in 12 13 14 15; do
            python -m pip download --require-hashes --only-binary=:all: --no-deps \
              --python-version "3.$minor" --implementation cp --abi "cp3$minor" \
              --platform manylinux2014_x86_64 -r requirements.lock \
              --dest .runtime/release-wheels
          done
          python bwmini/distribution.py build --root . --wheels .runtime/release-wheels --output .runtime/release/boxweave.zip --source-commit "$GITHUB_SHA" --source-state clean
          python scripts/build_release_manifest.py --root . --output .runtime/release --source "$GITHUB_SHA"
      - name: Verify release ZIP includes every Python module and digest
        run: |
          python - <<'PY_PACKAGED_MODULES'
          import hashlib, json, zipfile
          from pathlib import Path
          from bwmini.distribution import production_modules
          modules = {p.as_posix() for p in production_modules('.')}
          with zipfile.ZipFile('.runtime/release/boxweave.zip') as archive:
              members = set(archive.namelist())
              missing = modules - members
              assert not missing, f'Missing Python modules from release ZIP: {sorted(missing)}'
              manifest = json.loads(archive.read('manifest.json'))
              assert modules <= set(manifest['files']), 'Missing Python modules from ZIP manifest'
              for name in sorted(modules):
                  assert hashlib.sha256(archive.read(name)).hexdigest() == manifest['files'][name], f'Digest mismatch: {name}'
              assert {'bwmini/remote_auth.py', 'bwmini/remote_mcp.py'} <= members
              assert not any(name.startswith(('bwmini/reacceptance', 'tools/reacceptance'))
                             for name in members), 'Developer test runner/data leaked into customer ZIP'
              assert not any(name.startswith(('bwmini/reacceptance', 'tools/reacceptance'))
                             for name in manifest['files']), 'Developer module in release manifest'

          print(f'Product ZIP contains {len(modules)} verified production Python modules; test suite excluded')
          PY_PACKAGED_MODULES
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Python 3.14 tests and verified offline wheel smoke
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m unittest tests.test_online tests.test_online_adoption tests.test_distribution tests.test_host_bootstrap tests.test_platform_minimums -v
          python - <<'PY_SMOKE'
          import pathlib, subprocess, sys, tempfile, zipfile
          with tempfile.TemporaryDirectory() as location:
              root = pathlib.Path(location)
              wheels = root / "wheels"
              wheels.mkdir()
              with zipfile.ZipFile(".runtime/release/boxweave.zip") as package:
                  for name in package.namelist():
                      if name.startswith("wheels/") and name.endswith(".whl"):
                          (wheels / pathlib.PurePosixPath(name).name).write_bytes(package.read(name))
                      elif name == "requirements.lock":
                          (root / "requirements.lock").write_bytes(package.read(name))
              venv = root / "python314"
              subprocess.run([sys.executable, "-m", "venv", str(venv)], check=True)
              python = str(venv / "bin/python")
              subprocess.run([python, "-m", "pip", "install", "--no-index", "--no-deps",
                              "--require-hashes", "--only-binary=:all:", "--find-links", str(wheels),
                              "-r", str(root / "requirements.lock")], check=True)
              subprocess.run([python, "-c", "import flask, markupsafe, waitress; print('offline Python 3.14 import passed')"], check=True)
          PY_SMOKE
      - name: Retain application candidate for review
        uses: actions/upload-artifact@v4
        with:
          name: application-candidate
          path: .runtime/release/

  # The regular main push is VERIFY/CANDIDATE ONLY. It can never auto-publish.
  # A separate trusted Verifier must have installed these exact candidate bytes
  # in a clean isolated Box, signed its original attempt and oracle evidence,
  # and uploaded that evidence to its own workflow run.
  candidate_gate:
    needs: verify
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.candidate_run_id != '' && inputs.verifier_run_id != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    environment: boxweave-reacceptance-release
    steps:
      - uses: actions/checkout@v4
      - name: Verify original candidate run is a successful main push at this exact SHA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_RUN_ID" =~ ^[0-9]+$ ]] || exit 1
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID" > pinned-candidate-run.json
          python3 - <<'PY_CANDIDATE'
          import json,os
          r=json.load(open('pinned-candidate-run.json'))
          assert r['head_sha'] == os.environ['GITHUB_SHA'], 'Candidate commit mismatch'
          assert r['head_branch'] == 'main' and r['event'] == 'push', 'Untrusted candidate provenance'
          assert r['status'] == 'completed' and r['conclusion'] == 'success', 'Original candidate CI not successful'
          assert r['path'].split('@')[0] == '.github/workflows/ci.yml', 'Candidate from unexpected workflow'
          PY_CANDIDATE
      - uses: actions/download-artifact@v4
        with:
          name: application-candidate
          path: release
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          name: reacceptance-installed-verifier
          path: verifier-evidence
          run-id: ${{ inputs.verifier_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify independent installed candidate and signature
        env:
          TRUSTED_VERIFIER_PUBLIC_KEY: ${{ vars.REACCEPTANCE_VERIFIER_PUBLIC_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "$TRUSTED_VERIFIER_PUBLIC_KEY" ]] || { echo 'Protected verifier key not configured; refuse release' >&2; exit 1; }
          printf '%s\n' "$TRUSTED_VERIFIER_PUBLIC_KEY" > trusted-verifier.pub
          python -m tools.reacceptance.workflow_gate \
            --source "$GITHUB_SHA" \
            --candidate-run-id "${{ inputs.candidate_run_id }}" \
            --verifier-run-id "${{ inputs.verifier_run_id }}" \
            --assets release --attestation verifier-evidence/release-gate.json \
            --context-out trusted-context.json
          python -m tools.reacceptance.release_gate \
            --candidate release/boxweave.zip \
            --release-manifest release/release.json \
            --attestation verifier-evidence/release-gate.json \
            --signature verifier-evidence/release-gate.sig \
            --public-key trusted-verifier.pub \
            --source "$GITHUB_SHA" --expected-context trusted-context.json

  publish:
    needs: [verify, candidate_gate]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.candidate_run_id != '' && inputs.verifier_run_id != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: boxweave-reacceptance-release
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: application-candidate
          path: release
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          name: reacceptance-installed-verifier
          path: verifier-evidence
          run-id: ${{ inputs.verifier_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Revalidate exact downloaded publication bytes and independent signature
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRUSTED_VERIFIER_PUBLIC_KEY: ${{ vars.REACCEPTANCE_VERIFIER_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          [[ -n "$TRUSTED_VERIFIER_PUBLIC_KEY" ]] || exit 1
          printf '%s\n' "$TRUSTED_VERIFIER_PUBLIC_KEY" > trusted-verifier.pub
          python -m tools.reacceptance.workflow_gate \
            --source "$GITHUB_SHA" \
            --candidate-run-id "${{ inputs.candidate_run_id }}" \
            --verifier-run-id "${{ inputs.verifier_run_id }}" \
            --assets release --attestation verifier-evidence/release-gate.json \
            --context-out trusted-context.json
          python -m tools.reacceptance.release_gate \
            --candidate release/boxweave.zip --release-manifest release/release.json \
            --attestation verifier-evidence/release-gate.json \
            --signature verifier-evidence/release-gate.sig --public-key trusted-verifier.pub \
            --source "$GITHUB_SHA" --expected-context trusted-context.json
      - name: Publish immutable assets only after draft byte parity
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(python3 -c 'import json; print(json.load(open("release/release.json"))["version"])')
          tag="v$version"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" > tag-state.json 2>/dev/null; then
            actual=$(python3 -c 'import json; print(json.load(open("tag-state.json"))["object"]["sha"])')
            [[ "$actual" == "$GITHUB_SHA" ]] || { echo 'Immutable tag source mismatch' >&2; exit 1; }
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA" > /dev/null
          fi
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$tag" --draft --verify-tag --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "BoxWeave $version" \
              --notes "Exact source-bound CI candidate with independent signed installed acceptance. Stable installation selection is unchanged."
          fi
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets,isDraft > release-state.json
          python3 - <<'PY_ASSET_NAMES'
          import json
          from tools.reacceptance.workflow_gate import ASSETS
          state=json.load(open('release-state.json'))
          assert {a['name'] for a in state['assets']} <= ASSETS, 'Unexpected existing release assets'
          PY_ASSET_NAMES
          if [[ "$(python3 -c 'import json; print(str(json.load(open("release-state.json"))["isDraft"]).lower())')" == "false" ]]; then
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir existing-public-readback
            python3 - <<'PY_EXISTING_PARITY'
          from tools.reacceptance.workflow_gate import asset_index
          assert asset_index('existing-public-readback') == asset_index('release'), 'Immutable published assets differ'
          PY_EXISTING_PARITY
            exit 0
          fi
          for file in release/*; do
            name=$(basename "$file")
            if ! python3 -c 'import json,sys;sys.exit(0 if any(a["name"]==sys.argv[1] for a in json.load(open("release-state.json"))["assets"]) else 1)' "$name"; then
              gh release upload "$tag" "$file" --repo "$GITHUB_REPOSITORY"
            fi
          done
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir draft-readback
          python3 - <<'PY_DRAFT_PARITY'
          from tools.reacceptance.workflow_gate import asset_index
          assert asset_index('draft-readback') == asset_index('release'), 'Draft asset bytes differ; refuse publication'
          PY_DRAFT_PARITY
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir public-readback
          python3 - <<'PY_PUBLIC_PARITY'
          from tools.reacceptance.workflow_gate import asset_index
          assert asset_index('public-readback') == asset_index('release'), 'Published asset bytes differ'
          PY_PUBLIC_PARITY
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.sha')" == "$GITHUB_SHA" ]]
          [[ "$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" == "false" ]]
