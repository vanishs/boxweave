name: Static and fixture-safe validation
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Documentation, release metadata, and traceability
        run: python scripts/check_knowledge.py
      - name: Safe shell syntax
        run: |
          bash -n install.sh
          bash -n boxweave.sh
      - name: Install locked Python test dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Python unit and contract tests (fixtures only)
        run: python -m unittest discover -s tests -v
      - name: Generated Windows Codex WSL PowerShell grammar
        run: |
          python - <<'PY_CLIENT'
          import base64, struct
          from pathlib import Path
          from bwmini.client_setup import render
          key = base64.b64encode(struct.pack(">I",11)+b"ssh-ed25519"+struct.pack(">I",32)+b"x"*32).decode()
          Path("boxweave-fixture-client.ps1").write_text(render({"host":"192.168.2.233","port":22,"server_key":"ssh-ed25519 "+key,"managed_public_key":"ssh-ed25519 "+key},"example-admin"))
          PY_CLIENT
          pwsh -NoProfile -Command '$tokens=$null; $errors=$null; [System.Management.Automation.Language.Parser]::ParseFile("boxweave-fixture-client.ps1", [ref]$tokens, [ref]$errors) | Out-Null; if ($errors.Count -ne 0) { $errors | Format-List | Out-String | Write-Error; exit 1 }'
          rm -f boxweave-fixture-client.ps1
      - name: Frontend typecheck and build
        run: |
          npm --prefix web ci --ignore-scripts --no-audit --no-fund
          npm --prefix web run build
      - name: Install fixture browser
        run: python -m playwright install --with-deps chromium
      - name: Seven fixture browser workflows
        run: python scripts/validate.py --browser-only
      - name: Retain fixture validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fixture-browser-evidence
          path: |
            .runtime/validation/
            .runtime/**/result.json
            .runtime/**/*.png
          if-no-files-found: ignore
      - name: Build reviewed application candidate
        run: |
          mkdir -p .runtime/release
          for minor in 12 13 14 15; do
            python -m pip download --require-hashes --only-binary=:all: --no-deps \
              --python-version "3.$minor" --implementation cp --abi "cp3$minor" \
              --platform manylinux2014_x86_64 -r requirements.lock \
              --dest .runtime/release-wheels
          done
          python bwmini/distribution.py build --root . --wheels .runtime/release-wheels --output .runtime/release/boxweave.zip --source-commit "$GITHUB_SHA" --source-state clean
          python scripts/build_release_manifest.py --root . --output .runtime/release --source "$GITHUB_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Python 3.14 tests and verified offline wheel smoke
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m unittest tests.test_online tests.test_online_adoption tests.test_distribution tests.test_host_bootstrap tests.test_platform_minimums -v
          python - <<'PY_SMOKE'
          import pathlib, subprocess, sys, tempfile, zipfile
          with tempfile.TemporaryDirectory() as location:
              root = pathlib.Path(location)
              wheels = root / "wheels"
              wheels.mkdir()
              with zipfile.ZipFile(".runtime/release/boxweave.zip") as package:
                  for name in package.namelist():
                      if name.startswith("wheels/") and name.endswith(".whl"):
                          (wheels / pathlib.PurePosixPath(name).name).write_bytes(package.read(name))
                      elif name == "requirements.lock":
                          (root / "requirements.lock").write_bytes(package.read(name))
              venv = root / "python314"
              subprocess.run([sys.executable, "-m", "venv", str(venv)], check=True)
              python = str(venv / "bin/python")
              subprocess.run([python, "-m", "pip", "install", "--no-index", "--no-deps",
                              "--require-hashes", "--only-binary=:all:", "--find-links", str(wheels),
                              "-r", str(root / "requirements.lock")], check=True)
              subprocess.run([python, "-c", "import flask, markupsafe, waitress; print('offline Python 3.14 import passed')"], check=True)
          PY_SMOKE
      - name: Retain application candidate for review
        uses: actions/upload-artifact@v4
        with:
          name: application-candidate
          path: .runtime/release/

  publish:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: application-candidate
          path: release
      - name: Publish immutable source-bound installer assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(python3 -c 'import json; print(json.load(open("release/release.json"))["version"])')
          source=$(python3 -c 'import json; print(json.load(open("release/release.json"))["source"])')
          test "$source" = "$GITHUB_SHA"
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            existing=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$version" --jq '.object.sha')
            if [[ "$existing" != "$GITHUB_SHA" ]]; then
              # A published version is immutable. Documentation-only and this
              # CI-publishing fix need validation, but no replacement release.
              # Any runnable-source or packaging change must bump VERSION.
              git merge-base --is-ancestor "$existing" "$GITHUB_SHA"
              files=$(git diff --name-only "$existing" "$GITHUB_SHA")
              [[ -n "$files" ]] || { echo 'Changed source without release change'; exit 1; }
              while IFS= read -r file; do
                case "$file" in
                  docs/*.md|README.md|AGENTS.md|clients/README.md|.github/workflows/ci.yml) ;;
                  *) echo "Version bump required for source change: $file" >&2; exit 1 ;;
                esac
              done <<< "$files"
              echo "Documentation/CI-only update validated; preserving immutable release v$version."
              exit 0
            fi
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$version" > release-state.json
            for file in release/*; do
              name=$(basename "$file")
              if ! python3 -c 'import json,sys;sys.exit(0 if any(a["name"]==sys.argv[1] for a in json.load(open("release-state.json"))["assets"]) else 1)' "$name"; then
                gh release upload "v$version" "$file" --repo "$GITHUB_REPOSITORY"
              fi
            done
          else
            gh release create "v$version" release/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "BoxWeave $version" --notes "Source-bound installer assets built after static, unit, frontend and fixture-browser validation. Live acceptance is recorded separately in repository documentation."
          fi

  e2e-ssh-mcp:
    name: Disposable Ubuntu host + real SSH MCP read
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - name: Record environment
        shell: bash
        run: |
          mkdir -p ci-evidence
          { date -u; uname -a; cat /etc/os-release; df -h /; free -h; } > ci-evidence/runner.txt
      - name: Install official Containarium with Incus
        shell: bash
        run: |
          set -uo pipefail
          set +e
          timeout --signal=TERM --kill-after=30s 14m bash -o pipefail -c \
            'curl -fsSL https://containarium.dev/install.sh | sudo bash' \
            2>&1 | tee ci-evidence/containarium-install.log
          code=${PIPESTATUS[0]}
          set -e
          echo "$code" > ci-evidence/containarium-exit.txt
          echo "Containarium install: $code" >> "$GITHUB_STEP_SUMMARY"
          exit "$code"
      - name: Prepare local SSH daemon and pinned host key
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq openssh-server
          sudo ssh-keygen -A
          sudo install -d -m 755 /etc/ssh/sshd_config.d
          printf 'PasswordAuthentication no\nKbdInteractiveAuthentication no\nPermitRootLogin no\nAllowUsers boxweave\n' \
            | sudo tee /etc/ssh/sshd_config.d/90-boxweave-ci.conf >/dev/null
          sudo install -d -m 755 /run/sshd
          sudo /usr/sbin/sshd -t
          sudo systemctl enable --now ssh
          sudo systemctl is-active --quiet ssh
          echo "sshd active with key-only BoxWeave login" | tee ci-evidence/sshd.txt
      - name: Record existing Provider unauthenticated API status (no credentials)
        shell: bash
        run: |
          curl --max-time 10 -sS -o /dev/null -w 'GET /v1/containers HTTP %{http_code}\n' \
            http://127.0.0.1:8080/v1/containers | tee ci-evidence/provider-http.txt
      - name: Install published BoxWeave into existing Containarium
        shell: bash
        run: |
          set -uo pipefail
          set +e
          timeout --signal=TERM --kill-after=30s 16m bash -o pipefail -c \
            'curl -fsSL https://raw.githubusercontent.com/vanishs/boxweave/main/install.sh | sudo bash' \
            2>&1 | tee ci-evidence/boxweave-install.log
          code=${PIPESTATUS[0]}
          set -e
          echo "$code" > ci-evidence/boxweave-exit.txt
          echo "BoxWeave install: $code" >> "$GITHUB_STEP_SUMMARY"
          exit "$code"
      - name: Verify generated client and actual SSH MCP read
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_MCP'
          import json, pathlib, subprocess, tempfile, sys
          out=pathlib.Path('ci-evidence/mcp-result.json')
          report={'state':'running','client_generator':'not_run','ssh':'not_run',
                  'initialize':'not_run','tools_list':'not_run','list_containers':'not_run'}
          online='/usr/local/lib/boxweave/default/online.py'
          def save(): out.write_text(json.dumps(report,indent=2)+'\n')
          def cmd(*args, **kwargs): return subprocess.run(args,check=True,timeout=90,**kwargs)
          save()
          try:
              with tempfile.TemporaryDirectory(prefix='boxweave-mcp-ci-') as folder:
                  directory=pathlib.Path(folder)
                  script=directory/'client-setup.ps1'
                  with script.open('w') as handle:
                      cmd('boxweave','client','--agent','codex','--transport','wsl',
                          '--admin-user','runner','--no-replace',stdout=handle,stderr=subprocess.PIPE,text=True)
                  assert 'McpServer' in script.read_text(), 'Windows client generator produced unexpected output'
                  report['client_generator']='passed'
                  save()
                  key=directory/'id_ed25519'
                  cmd('ssh-keygen','-q','-t','ed25519','-N','','-f',str(key),
                      stdout=subprocess.DEVNULL,stderr=subprocess.PIPE,text=True)
                  public=(directory/'id_ed25519.pub').read_text().strip()
                  cmd('sudo','python3',online,'enroll','--public-key',public,
                      stdout=subprocess.DEVNULL,stderr=subprocess.PIPE,text=True)
                  result=cmd('python3',online,'client-config','--identity',str(key),
                             '--known-hosts',str(directory/'known_hosts'),
                             stdout=subprocess.PIPE,stderr=subprocess.PIPE,text=True)
                  config=json.loads(result.stdout)
                  (directory/'known_hosts').write_text(config['known_hosts_line']+'\n')
                  dest=config['mcpServers']['boxweave']
                  requests=[
                    {'jsonrpc':'2.0','id':1,'method':'initialize','params':{
                       'protocolVersion':'2024-11-05','capabilities':{},
                       'clientInfo':{'name':'ga-e2e-test','version':'1.0'}}},
                    {'jsonrpc':'2.0','method':'notifications/initialized'},
                    {'jsonrpc':'2.0','id':2,'method':'tools/list','params':{}},
                    {'jsonrpc':'2.0','id':3,'method':'tools/call',
                     'params':{'name':'list_containers','arguments':{}}}
                  ]
                  payload=''.join(json.dumps(x)+'\n' for x in requests)
                  probe=subprocess.run([dest['command'],*dest['args']],input=payload,
                                       capture_output=True,text=True,timeout=100)
                  report['ssh_exit_code']=probe.returncode
                  if probe.returncode:
                      report['ssh_error_tail']=probe.stderr[-1200:]
                      raise RuntimeError('SSH/MCP process failed')
                  report['ssh']='passed'
                  messages=[json.loads(x) for x in probe.stdout.splitlines() if x.strip()]
                  replies={x.get('id'):x for x in messages if isinstance(x,dict) and 'id' in x}
                  assert replies.get(1,{}).get('result',{}).get('protocolVersion')=='2024-11-05', 'MCP initialize error'
                  report['initialize']='passed'
                  save()
                  tools=replies.get(2,{}).get('result',{}).get('tools',[])
                  assert any(t.get('name')=='list_containers' for t in tools), 'MCP list_containers missing'
                  report['tools_list']='passed'; report['tools_count']=len(tools)
                  save()
                  read=replies.get(3,{}).get('result',{})
                  assert read.get('content') and not read.get('isError'), 'MCP list_containers call returned error'
                  report['list_containers']='passed'
                  report['state']='passed'
                  save()
          except Exception as error:
              report['state']='failed'; report['error']=str(error)[:350]
              save()
              print(json.dumps(report))
              raise
          print(json.dumps(report))
          PY_MCP
      - name: Summarize service health and evidence
        if: always()
        shell: bash
        run: |
          {
            for unit in ssh.service incus.service containarium.service; do
              printf '%s: %s\n' "$unit" "$(systemctl is-active "$unit" 2>/dev/null || true)"
            done
            if command -v boxweave >/dev/null; then echo 'BoxWeave CLI: present'; else echo 'BoxWeave CLI: missing'; fi
            if test -f ci-evidence/mcp-result.json; then cat ci-evidence/mcp-result.json; fi
          } | tee ci-evidence/service-summary.txt
          echo "Read detailed step statuses and retained evidence; install alone is not MCP proof." >> "$GITHUB_STEP_SUMMARY"
      - name: Retain diagnostic outputs, no private client keys
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssh-mcp-e2e-evidence
          path: ci-evidence/
          if-no-files-found: warn
          retention-days: 3


