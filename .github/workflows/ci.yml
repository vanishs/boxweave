name: Static and fixture-safe validation
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Documentation, release metadata, and traceability
        run: python scripts/check_knowledge.py
      - name: Code-first source and acceptance inventory drift guard
        run: |
          python - <<'PY_CODE_FIRST'
          from pathlib import Path
          import ast
          import re

          doc = Path("docs/verification/CODE_FIRST_ACCEPTANCE_2026-11-01.md").read_text()
          source = lambda name: Path(name).read_text()
          names = lambda pattern: {p.as_posix() for p in Path(".").glob(pattern) if p.is_file()}
          matches = lambda pattern, value: set(re.findall(pattern, value))

          def recorded(key):
              match = re.search(
                  r"<!-- inventory:" + re.escape(key) + r":start -->\s*(.*?)\s*<!-- inventory:" +
                  re.escape(key) + r":end -->", doc, re.S
              )
              if match is None:
                  raise AssertionError("Inventory section missing: " + key)
              return matches(r"`([^`]+)`", match.group(1))

          def cli_choices():
              for node in ast.walk(ast.parse(source("bwmini/__main__.py"))):
                  if isinstance(node, ast.Call) and isinstance(node.func, ast.Attribute) and node.func.attr == "add_argument":
                      if node.args and isinstance(node.args[0], ast.Constant) and node.args[0].value == "action":
                          return set(ast.literal_eval(next(k.value for k in node.keywords if k.arg == "choices")))
              raise AssertionError("Application action selector absent")

          def host_actions():
              return {
                  node.args[0].value for node in ast.walk(ast.parse(source("bwmini/host_cli.py")))
                  if isinstance(node, ast.Call) and isinstance(node.func, ast.Attribute)
                  and node.func.attr == "add_parser" and node.args
                  and isinstance(node.args[0], ast.Constant) and isinstance(node.args[0].value, str)
              }

          def routes(path):
              result = set()
              for method, path_, methods in re.findall(
                  r'@app\.(get|post|put|delete|route)\("([^"]+)"(?:,\s*methods=\[([^\]]+)\])?\)', source(path)
              ):
                  kind = ",".join(re.findall(r'"([^"]+)"', methods)) if method == "route" else method.upper()
                  result.add(kind + " " + path_)
              return result

          app_source = source("bwmini/client_profiles.py")
          catalog = re.search(r"APPS\s*=\s*\(([^)]+)\)", app_source)
          assert catalog, "Client catalog missing"
          owned_tools = source("bwmini/mcp_gate.py") + source("bwmini/gate_diagnostics.py") + source("bwmini/box_reads.py") + source("bwmini/gateway_tasks.py") + source("bwmini/gateway_protection.py")
          expected = {
              "python-modules": names("bwmini/*.py"),
              "unit-tests": names("tests/test_*.py"),
              "client-scripts": names("clients/**/*.py") | names("clients/**/*.ps1"),
              "support-scripts": names("scripts/*.py"),
              "web-sources": names("web/src/*"),
              "app-cli": cli_choices(),
              "host-cli": host_actions(),
              "web-api": routes("bwmini/web.py"),
              "remote-api": routes("bwmini/remote_mcp.py"),
              "gateway-tools": matches(r'"name":\s*"(boxweave_[a-z_]+)"', owned_tools),
              "client-apps": matches(r'"([^"]+)"', catalog.group(1)),
              "web-views": matches(r"view==='([^']+)'", source("web/src/main.tsx")),
          }
          for section, discovered in expected.items():
              listed = recorded(section)
              if discovered != listed:
                  raise AssertionError(
                      section + ": undocumented=" + repr(sorted(discovered - listed)) +
                      "; stale=" + repr(sorted(listed - discovered))
                  )
              print(section, len(listed), "recorded")
          PY_CODE_FIRST
      - name: Safe shell syntax
        run: |
          bash -n install.sh
          bash -n boxweave.sh
      - name: Install locked Python test dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Python unit and contract tests (fixtures only)
        run: python -m unittest discover -s tests -v
      - name: Unified Python client generator grammar and first-line shebang
        run: |
          python - <<'PY_CLIENT'
          import base64, struct
          from pathlib import Path
          from bwmini.client_setup import render
          key = base64.b64encode(struct.pack(">I",11)+b"ssh-ed25519"+struct.pack(">I",32)+b"x"*32).decode()
          state = {"host":"192.168.2.233","port":22,"server_key":"ssh-ed25519 "+key}
          for app in ("codex", "zcode"):
              for transport in ("native", "wsl"):
                  output = render(state, "example-admin", app=app, system="windows", transport=transport)
                  assert output.startswith("#!/usr/bin/env python3\n# ===")
                  compile(output, "boxweave-fixture-client.py", "exec")
                  assert "ServerAliveInterval=15" in output
                  assert "ServerAliveCountMax=4" in output
          PY_CLIENT
      - name: Frontend typecheck and build
        run: |
          npm --prefix web ci --ignore-scripts --no-audit --no-fund
          npm --prefix web run build
      - name: Install fixture browser
        run: python -m playwright install --with-deps chromium
      - name: Seven fixture browser workflows
        run: python scripts/validate.py --browser-only
      - name: Retain fixture validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fixture-browser-evidence
          path: |
            .runtime/validation/
            .runtime/**/result.json
            .runtime/**/*.png
          if-no-files-found: ignore
      - name: Build reviewed application candidate
        run: |
          mkdir -p .runtime/release
          for minor in 12 13 14 15; do
            python -m pip download --require-hashes --only-binary=:all: --no-deps \
              --python-version "3.$minor" --implementation cp --abi "cp3$minor" \
              --platform manylinux2014_x86_64 -r requirements.lock \
              --dest .runtime/release-wheels
          done
          python bwmini/distribution.py build --root . --wheels .runtime/release-wheels --output .runtime/release/boxweave.zip --source-commit "$GITHUB_SHA" --source-state clean
          python scripts/build_release_manifest.py --root . --output .runtime/release --source "$GITHUB_SHA"
      - name: Verify release ZIP includes every Python module and digest
        run: |
          python - <<'PY_PACKAGED_MODULES'
          import hashlib, json, zipfile
          from pathlib import Path
          modules = {p.as_posix() for p in Path('bwmini').glob('*.py')}
          with zipfile.ZipFile('.runtime/release/boxweave.zip') as archive:
              members = set(archive.namelist())
              missing = modules - members
              assert not missing, f'Missing Python modules from release ZIP: {sorted(missing)}'
              manifest = json.loads(archive.read('manifest.json'))
              assert modules <= set(manifest['files']), 'Missing Python modules from ZIP manifest'
              for name in sorted(modules):
                  assert hashlib.sha256(archive.read(name)).hexdigest() == manifest['files'][name], f'Digest mismatch: {name}'
              assert {'bwmini/remote_auth.py', 'bwmini/remote_mcp.py'} <= members
          print(f'Package contains {len(modules)} verified Python modules')
          PY_PACKAGED_MODULES
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Python 3.14 tests and verified offline wheel smoke
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m unittest tests.test_online tests.test_online_adoption tests.test_distribution tests.test_host_bootstrap tests.test_platform_minimums -v
          python - <<'PY_SMOKE'
          import pathlib, subprocess, sys, tempfile, zipfile
          with tempfile.TemporaryDirectory() as location:
              root = pathlib.Path(location)
              wheels = root / "wheels"
              wheels.mkdir()
              with zipfile.ZipFile(".runtime/release/boxweave.zip") as package:
                  for name in package.namelist():
                      if name.startswith("wheels/") and name.endswith(".whl"):
                          (wheels / pathlib.PurePosixPath(name).name).write_bytes(package.read(name))
                      elif name == "requirements.lock":
                          (root / "requirements.lock").write_bytes(package.read(name))
              venv = root / "python314"
              subprocess.run([sys.executable, "-m", "venv", str(venv)], check=True)
              python = str(venv / "bin/python")
              subprocess.run([python, "-m", "pip", "install", "--no-index", "--no-deps",
                              "--require-hashes", "--only-binary=:all:", "--find-links", str(wheels),
                              "-r", str(root / "requirements.lock")], check=True)
              subprocess.run([python, "-c", "import flask, markupsafe, waitress; print('offline Python 3.14 import passed')"], check=True)
          PY_SMOKE
      - name: Retain application candidate for review
        uses: actions/upload-artifact@v4
        with:
          name: application-candidate
          path: .runtime/release/

  publish:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: application-candidate
          path: release
      - name: Publish immutable source-bound installer assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(python3 -c 'import json; print(json.load(open("release/release.json"))["version"])')
          source=$(python3 -c 'import json; print(json.load(open("release/release.json"))["source"])')
          test "$source" = "$GITHUB_SHA"
          tag="v$version"
          upload_verified() {
            local file="$1" name attempt
            name=$(basename "$file")
            for attempt in 1 2 3 4; do
              if gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fxq "$name"; then
                return 0
              fi
              if gh release upload "$tag" "$file" --repo "$GITHUB_REPOSITORY"; then
                return 0
              fi
              sleep $((attempt * 5))
            done
            gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fxq "$name"
          }
          create_verified_tag() {
            # API ref creation requires contents:write, not a workflow-file git push.
            # Never move an existing version tag, even after a partial release.
            local actual
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.sha' >/dev/null 2>&1; then
              actual=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.sha')
              [[ "$actual" == "$GITHUB_SHA" ]] || {
                echo "Immutable tag already targets $actual; expected $GITHUB_SHA" >&2; return 1;
              }
            else
              gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA" >/dev/null
            fi
            actual=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.sha')
            [[ "$actual" == "$GITHUB_SHA" ]]
          }
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # gh release create can leave an authenticated-only draft and no
            # git tag when asset publication fails (HTTP 502). Recover only a
            # draft with the same source lineage; never retarget published data.
            if ! git show-ref --verify --quiet "refs/tags/v$version"; then
              draft=$(gh release view "v$version" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)
              [[ "$draft" == "true" ]] || { echo 'Published release has no verified tag; refuse' >&2; exit 1; }
              original=$(gh release view "v$version" --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq .targetCommitish)
              if [[ "$original" != "$GITHUB_SHA" ]]; then
                git merge-base --is-ancestor "$original" "$GITHUB_SHA"
                changes=$(git diff --name-only "$original" "$GITHUB_SHA")
                [[ -n "$changes" ]] || exit 1
                while IFS= read -r changed; do
                  case "$changed" in .github/workflows/ci.yml) ;; *)
                    echo "Draft retarget has runnable-source change: $changed" >&2
                    exit 1
                  ;; esac
                done <<< "$changes"
                existing_assets=$(gh release view "v$version" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets|length')
                [[ "$existing_assets" == "0" ]] || { echo 'Retained draft assets require manual inspection' >&2; exit 1; }
                gh release edit "v$version" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA"
              fi
              create_verified_tag
            fi
            existing=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$version" --jq '.object.sha')
            if [[ "$existing" != "$GITHUB_SHA" ]]; then
              # A published version is immutable. Documentation-only and this
              # CI-publishing fix need validation, but no replacement release.
              # Any runnable-source or packaging change must bump VERSION.
              git merge-base --is-ancestor "$existing" "$GITHUB_SHA"
              files=$(git diff --name-only "$existing" "$GITHUB_SHA")
              [[ -n "$files" ]] || { echo 'Changed source without release change'; exit 1; }
              while IFS= read -r file; do
                case "$file" in
                  docs/*.md|README.md|AGENTS.md|clients/README.md|.github/workflows/ci.yml) ;;
                  PUBLISHED_RELEASE)
                    [[ "$(cat PUBLISHED_RELEASE)" == "$version" ]] || { echo 'Stable pin must match the already published source version' >&2; exit 1; } ;;
                  install.sh)
                    # Only a change to the embedded default release pin is permitted.
                    # All executable installer logic must stay byte-identical to the published tag.
                    OLD_RELEASE_REF="$existing" RELEASE_VERSION="$version" python3 - <<'PY_RELEASE_PIN'
          import os, re, subprocess
          from pathlib import Path
          baseline = subprocess.check_output(['git', 'show', os.environ['OLD_RELEASE_REF'] + ':install.sh'], text=True)
          pattern = r'python3 - "(0\.[0-9]+\.[0-9]+)" "\$\{streamed_options\[@\]\}" <<\x27PY_DEFAULT_RELEASE\x27'
          match = re.search(pattern, baseline)
          if match is None:
              raise SystemExit('Published installer release pin not found')
          expected = baseline[:match.start(1)] + os.environ['RELEASE_VERSION'] + baseline[match.end(1):]
          if Path('install.sh').read_text() != expected:
              raise SystemExit('Installer changed beyond the published stable version pin')
          PY_RELEASE_PIN
                    ;;
                  *) echo "Version bump required for source change: $file" >&2; exit 1 ;;
                esac
              done <<< "$files"
              echo "Documentation/CI-only update validated; preserving immutable release v$version."
              exit 0
            fi
            gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets' > release-state.json
            for file in release/*; do
              name=$(basename "$file")
              if ! python3 -c 'import json,sys;sys.exit(0 if any(a["name"]==sys.argv[1] for a in json.load(open("release-state.json"))) else 1)' "$name"; then
                upload_verified "$file"
              fi
            done
          else
            # GitHub can reject a release creation for a previously missing tag.
            # Publish the immutable tag first, always bound to the verified CI SHA.
            tag="v$version"
            create_verified_tag
            # Some release API failures happen after the server has accepted
            # the request. Recheck the original tag before retrying, and keep
            # uploads idempotent on an interrupted publish.
            for attempt in 1 2 3 4; do
              if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
                break
              fi
              if gh release create "$tag" --draft --verify-tag --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "BoxWeave $version" --notes "Source-bound installer assets built after static, unit, frontend and fixture-browser validation. Live acceptance is recorded separately in repository documentation."; then
                break
              fi
              if [[ "$attempt" == 4 ]]; then
                echo 'Release creation incomplete; retain the tag and inspect original state' >&2
                exit 1
              fi
              sleep $((attempt * 8))
            done
            gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets' > release-state.json
            for file in release/*; do
              name=$(basename "$file")
              if ! python3 -c 'import json,sys;sys.exit(0 if any(a["name"]==sys.argv[1] for a in json.load(open("release-state.json"))) else 1)' "$name"; then
                upload_verified "$file"
              fi
            done
          fi
          # Draft releases return HTTP 404 from the releases/tags lookup.
          # Confirm complete assets and verified tag identity before publishing.
          expected=$(find release -maxdepth 1 -type f | wc -l | tr -d ' ')
          actual=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets|length')
          [[ "$expected" -gt 0 && "$actual" -eq "$expected" ]] || {
            echo "Draft asset mismatch: expected $expected, observed $actual" >&2; exit 1;
          }
          if [[ "$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" == "true" ]]; then
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false
          fi
          [[ "$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" == "false" ]] || {
            echo 'Release remains draft after publication request' >&2; exit 1;
          }
