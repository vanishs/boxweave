name: Static and fixture-safe validation
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Documentation, release metadata, and traceability
        run: python scripts/check_knowledge.py
      - name: Safe shell syntax
        run: |
          bash -n install.sh
          bash -n boxweave.sh
      - name: Install locked Python test dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Python unit and contract tests (fixtures only)
        run: python -m unittest discover -s tests -v
      - name: Frontend typecheck and build
        run: |
          npm --prefix web ci --ignore-scripts --no-audit --no-fund
          npm --prefix web run build
      - name: Install fixture browser
        run: python -m playwright install --with-deps chromium
      - name: Seven fixture browser workflows
        run: python scripts/validate.py --browser-only
      - name: Retain fixture validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fixture-browser-evidence
          path: |
            .runtime/validation/
            .runtime/**/result.json
            .runtime/**/*.png
          if-no-files-found: ignore
      - name: Build reviewed application candidate
        run: |
          mkdir -p .runtime/release
          python -m pip download --require-hashes --only-binary=:all: --no-deps -r requirements.lock --dest .runtime/release-wheels
          python bwmini/distribution.py build --root . --wheels .runtime/release-wheels --output .runtime/release/boxweave.zip --source-commit "$GITHUB_SHA" --source-state clean
          python scripts/build_release_manifest.py --root . --output .runtime/release --source "$GITHUB_SHA"
      - name: Retain application candidate for review
        uses: actions/upload-artifact@v4
        with:
          name: application-candidate
          path: .runtime/release/

  publish:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: application-candidate
          path: release
      - name: Publish immutable source-bound installer assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(python3 -c 'import json; print(json.load(open("release/release.json"))["version"])')
          source=$(python3 -c 'import json; print(json.load(open("release/release.json"))["source"])')
          test "$source" = "$GITHUB_SHA"
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            existing=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$version" --jq '.object.sha')
            test "$existing" = "$GITHUB_SHA"
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$version" > release-state.json
            for file in release/*; do
              name=$(basename "$file")
              if ! python3 -c 'import json,sys;sys.exit(0 if any(a["name"]==sys.argv[1] for a in json.load(open("release-state.json"))["assets"]) else 1)' "$name"; then
                gh release upload "v$version" "$file" --repo "$GITHUB_REPOSITORY"
              fi
            done
          else
            gh release create "v$version" release/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "BoxWeave $version" --notes "Source-bound installer assets built after static, unit, frontend and fixture-browser validation. Live acceptance is recorded separately in repository documentation."
          fi
