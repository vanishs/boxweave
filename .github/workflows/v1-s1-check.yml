name: v1 S1 source checks (non-release)
on:
  push:
    branches: [feat/v1-s1-foundation-20261108]
  pull_request:
    branches: [v1]
    # Source checks are not relevant for Markdown-only PRs.
    paths-ignore:
      - "**/*.md"
      - "**/*.mdx"
      - "**/*.rst"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.9'
          cache: false
      - name: Resolve tagged official SDKs and build
        run: |
          go mod verify
          go build ./...
      - name: Reject CGO-disabled SQLite stub builds
        run: |
          set -eu
          test "$(go env CGO_ENABLED)" = 1
          if CGO_ENABLED=0 go build ./cmd/boxweave > /tmp/nocgo-build.log 2>&1; then
            echo "FAIL: nonfunctional CGO-disabled SQLite binary unexpectedly built"
            exit 1
          fi
          grep -q ERROR_BOXWEAVE_SQLITE_REQUIRES_CGO_ENABLED /tmp/nocgo-build.log
      - name: Race and negative unit tests (not native acceptance)
        run: go test -race -count=1 ./...
      - name: Format check
        run: |
          test -z "$(gofmt -l cmd internal)"
      - name: Standalone CLI smoke and refusal of uninstalled controller
        run: |
          set -eu
          test "$(id -u)" -ne 0
          tmp="$(mktemp -d)"
          chmod 0700 "$tmp"
          trap 'rm -rf "$tmp"' EXIT
          go build -o "$tmp/boxweave" ./cmd/boxweave
          "$tmp/boxweave" status -db "$tmp/ledger.sqlite" -project no-project -incus-socket /nonexistent | grep -q '"ready": false'
          credentials="$("$tmp/boxweave" token-create -db "$tmp/ledger.sqlite" -ttl 1h)"
          token="$(printf '%s\n' "$credentials" | sed -n 's/^token=//p')"
          token_id="$(printf '%s\n' "$credentials" | sed -n 's/^id=\([^ ]*\).*/\1/p')"
          test -n "$token" && test -n "$token_id"
          "$tmp/boxweave" token-revoke -db "$tmp/ledger.sqlite" -id "$token_id"
          if timeout 10s "$tmp/boxweave" serve -db "$tmp/ledger.sqlite" -project no-project -incus-socket /nonexistent -listen 127.0.0.1:18650 > "$tmp/serve.log" 2>&1; then
            echo "FAIL: uninstalled controller unexpectedly started"
            exit 1
          fi
          grep -Fq 'scoped installation journal missing' "$tmp/serve.log"
          echo S1_STANDALONE_SCOPED_STARTUP_REFUSAL=PASS
      - name: Loopback HTTP authorization and exact official MCP catalog (source fixture)
        run: |
          go test -count=1 -v ./internal/control -run '^(TestHTTPAuthorizationHostOriginAndRevocation|TestOfficialMCPHandshakeAndS2ReadTools|TestBH019DottedMCPFieldsAndAgentHelp)$'
