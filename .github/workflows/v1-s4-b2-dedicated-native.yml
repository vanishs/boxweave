name: S4-B2 dedicated bridge native exact dual-stack peer and lease regression
on:
  push:
    branches: [feat/v1-s4-runtime-integration-20261116]
    paths:
      - .github/workflows/v1-s4-b2-dedicated-native.yml
      - internal/install/native_s4_b2_dedicated_test.go
      - internal/install/native_s4_b2_fault_lab_test.go
      - internal/install/network_peer_policy.go
      - internal/install/network_peer_bridge_guard.go
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    if: github.repository == 'vanishs/boxweave' && github.ref == 'refs/heads/feat/v1-s4-runtime-integration-20261116'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Fresh signed Incus 7.6, exact owned bridge and SDK fixture
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true && test ! -e /var/lib/incus
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates curl gpg dnsmasq-base >/dev/null
          curl -fsSL --max-time 30 https://pkgs.zabbly.com/key.asc -o "$RUNNER_TEMP/key.asc"
          fpr="$(gpg --show-keys --with-colons "$RUNNER_TEMP/key.asc" | awk -F: '$1=="fpr" {print $10; exit}')"
          test "$fpr" = 4EFC590696CB15B87C73A3AD82CC8797C838DCFD
          sudo install -m 0644 "$RUNNER_TEMP/key.asc" /etc/apt/keyrings/s4b2-dedicated-zabbly.asc
          echo 'deb [arch=amd64 signed-by=/etc/apt/keyrings/s4b2-dedicated-zabbly.asc] https://pkgs.zabbly.com/incus/stable noble main' | sudo tee /etc/apt/sources.list.d/s4b2-dedicated-incus.list >/dev/null
          sudo apt-get update -qq
          pkg="$(apt-cache madison incus | awk '/pkgs.zabbly.com/ && $3 ~ /:7[.]6[-.]/ {print $3; exit}')"
          test -n "$pkg"
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends "incus=$pkg" "incus-client=$pkg" "incus-base=$pkg" >/dev/null
          sudo systemctl start incus.service
          sudo incus admin init --auto --storage-backend=dir
          sudo incus version
          test -z "$(sudo incus list --all-projects --format csv -c n)"
          test "$(sudo incus config get authorization.client.tls-restricted)" != scriptlet
          sudo incus network create bwbr0 ipv4.address=10.248.83.1/24 ipv4.nat=true ipv6.address=fd83:248::1/64 ipv6.nat=true ipv6.dhcp.stateful=true
          test -z "$(gofmt -l internal/install/native_s4_b2_dedicated_test.go internal/install/network_peer_policy.go internal/install/network_peer_bridge_guard.go)"
          go test -c -o "$RUNNER_TEMP/s4b2-dedicated-test" ./internal/install
          sudo env BOXWEAVE_DISPOSABLE_NATIVE_PROBE=s4b1-ci-20261116 "$RUNNER_TEMP/s4b2-dedicated-test" -test.v -test.run '^TestS4B2NativeDedicatedBridgeACLSetup$'
          sudo incus project create bwowned \
            -c restricted=true -c features.images=false -c features.profiles=true -c features.networks=false \
            -c restricted.devices.nic=managed -c restricted.networks.access=bwbr0
          sudo incus --project bwowned profile device add default root disk path=/ pool=default
          sudo incus --project bwowned profile device add default eth0 nic name=eth0 \
            network=bwbr0 security.acls=bw-s4b2-native \
            security.acls.default.ingress.action=reject security.acls.default.egress.action=reject \
            security.ipv4_filtering=true security.ipv6_filtering=true security.mac_filtering=true
          echo "S4_B2_DEDICATED_SOURCE=$GITHUB_SHA"
          echo "S4_B2_NATIVE_DEDICATED_RESTRICTED_BRIDGE_AND_S1_FIXTURE=PASS"
      - name: Prove owned dual-stack pair, foreign refusal, revoke and new UUID reuse
        shell: bash
        run: |
          set -euo pipefail
          a4=10.248.83.11; b4=10.248.83.12; c4=10.248.83.13
          a6=fd83:248::11; b6=fd83:248::12; c6=fd83:248::13
          probe() {
            sudo env BOXWEAVE_DISPOSABLE_NATIVE_PROBE=s4b1-ci-20261116 \
              S4B2_A4="$a4" S4B2_B4="$b4" S4B2_A6="$a6" S4B2_B6="$b6" \
              "$RUNNER_TEMP/s4b2-dedicated-test" -test.v -test.run "^$1$"
          }
          guest4() { sudo incus --project bwowned exec "$1" -- sh -c "ip -4 -o addr show eth0 | awk '{print \$4}' | cut -d/ -f1" 2>/dev/null || :; }
          guest6() { sudo incus --project bwowned exec "$1" -- sh -c "ip -6 -o addr show eth0 scope global | awk '{print \$4}' | cut -d/ -f1" 2>/dev/null || :; }
          init_owned() {
            sudo incus --project bwowned init images:ubuntu/24.04 "$1" -c limits.cpu=1 -c limits.memory=512MiB
            sudo incus --project bwowned config device override "$1" eth0 "ipv4.address=$2" "ipv6.address=$3"
            sudo incus --project bwowned start "$1"
          }
          init_owned s4b2a "$a4" "$a6"
          init_owned s4b2b "$b4" "$b6"
          init_owned s4b2c "$c4" "$c6"
          for i in $(seq 1 50); do
            if [[ "$(guest4 s4b2a)" = "$a4" && "$(guest6 s4b2a)" = "$a6" &&
                  "$(guest4 s4b2b)" = "$b4" && "$(guest6 s4b2b)" = "$b6" &&
                  "$(guest4 s4b2c)" = "$c4" && "$(guest6 s4b2c)" = "$c6" ]]; then break; fi
            sleep 2
          done
          test "$(guest4 s4b2a)" = "$a4" && test "$(guest6 s4b2a)" = "$a6"
          test "$(guest4 s4b2b)" = "$b4" && test "$(guest6 s4b2b)" = "$b6"
          test "$(guest4 s4b2c)" = "$c4" && test "$(guest6 s4b2c)" = "$c6"
          b_uuid="$(sudo incus --project bwowned config get s4b2b volatile.uuid)"
          test -n "$b_uuid"
          echo "S4_B2_NATIVE_DEDICATED_THREE_STATIC_DUAL_STACK_GUESTS=PASS"
          for box in s4b2a s4b2b s4b2c; do
            echo "S4_B2_NATIVE_DEDICATED_IDENTITY box=$box uuid=$(sudo incus --project bwowned config get "$box" volatile.uuid) mac=$(sudo incus --project bwowned exec "$box" -- cat /sys/class/net/eth0/address)"
          done
          echo "S4_B2_NATIVE_DEDICATED_EXCLUSIVE_ROOT_NETWORK_USED_BY"
          sudo incus network show bwbr0
          probe TestS4B2NativeDedicatedBridgeExactPeer
          probe TestS4B2NativeFaultLabStaleETag
          sudo incus --project bwowned exec s4b2a -- ping -n -c 1 -W 4 "$b4"
          v6_ok=0
          for i in 1 2 3 4 5; do
            if sudo incus --project bwowned exec s4b2a -- ping -n -6 -c 1 -W 4 "$b6"; then v6_ok=1; break; fi
            sleep 2
          done
          test "$v6_ok" = 1
          echo "S4_B2_NATIVE_DEDICATED_INTERNET_FALSE_EXACT_PEER_IPV4_IPV6=PASS"
          if sudo incus --project bwowned exec s4b2a -- ping -n -c 1 -W 2 10.248.83.1 >/dev/null 2>&1; then
            echo "S4_B2_NATIVE_DEDICATED_INTERNET_FALSE_GATEWAY=UNEXPECTEDLY_REACHABLE"
            exit 67
          fi
          echo "S4_B2_NATIVE_DEDICATED_INTERNET_FALSE_GATEWAY_EGRESS_DENY=PASS"
          for spec in "s4b2b $a4 $a6" "s4b2c $b4 $b6" "s4b2a $c4 $c6"; do
            read -r src dest4 dest6 <<<"$spec"
            if sudo incus --project bwowned exec "$src" -- ping -n -c 1 -W 2 "$dest4" >/dev/null 2>&1; then exit 61; fi
            if sudo incus --project bwowned exec "$src" -- ping -n -6 -c 1 -W 2 "$dest6" >/dev/null 2>&1; then exit 62; fi
          done
          echo "S4_B2_NATIVE_DEDICATED_REVERSE_AND_C_DENY=PASS"
          sudo incus project create bwforeign \
            -c restricted=true -c features.images=false -c features.profiles=true -c features.networks=false \
            -c restricted.devices.nic=managed -c restricted.networks.access=incusbr0
          sudo incus --project bwforeign profile device add default root disk path=/ pool=default
          sudo incus --project bwforeign profile device add default eth0 nic name=eth0 network=incusbr0
          sudo incus --project bwforeign init images:ubuntu/24.04 s4b2foreign
          if sudo incus --project bwforeign config device add s4b2foreign extra nic name=extra network=bwbr0; then
            echo "S4_B2_NATIVE_DEDICATED_FOREIGN_RESTRICTED_ATTACH=SECURITY_BREAK"; exit 63
          fi
          echo "S4_B2_NATIVE_DEDICATED_FOREIGN_RESTRICTED_ATTACH=DENIED_PASS"
          sudo incus --project bwforeign delete s4b2foreign
          sudo incus project delete bwforeign
          sudo incus --project bwowned init images:ubuntu/24.04 s4b2unknown -c limits.cpu=1 -c limits.memory=512MiB
          sudo incus --project bwowned config device override s4b2unknown eth0 ipv4.address=10.248.83.14 ipv6.address=fd83:248::14
          sudo incus --project bwowned start s4b2unknown
          for i in $(seq 1 40); do
            if [[ "$(guest4 s4b2unknown)" = 10.248.83.14 && "$(guest6 s4b2unknown)" = fd83:248::14 ]]; then break; fi
            sleep 2
          done
          test "$(guest4 s4b2unknown)" = 10.248.83.14
          test "$(guest6 s4b2unknown)" = fd83:248::14
          probe TestS4B2NativeFaultLabUnknownSameProjectConsumer
          sudo incus --project bwowned stop s4b2unknown
          sudo incus --project bwowned delete s4b2unknown
          echo "S4_B2_FAULT_LAB_UNKNOWN_CONSUMER_CLEANUP=PASS"
          probe TestS4B2NativeDedicatedBridgeRevoke
          if sudo incus --project bwowned exec s4b2a -- ping -n -c 1 -W 2 "$b4" >/dev/null 2>&1; then exit 64; fi
          if sudo incus --project bwowned exec s4b2a -- ping -n -6 -c 1 -W 2 "$b6" >/dev/null 2>&1; then exit 65; fi
          sudo incus --project bwowned stop s4b2b
          sudo incus --project bwowned delete s4b2b
          init_owned s4b2replacement "$b4" "$b6"
          d_uuid="$(sudo incus --project bwowned config get s4b2replacement volatile.uuid)"
          test "$d_uuid" != "$b_uuid"
          for i in $(seq 1 30); do
            if [[ "$(guest4 s4b2replacement)" = "$b4" && "$(guest6 s4b2replacement)" = "$b6" ]]; then break; fi
            sleep 2
          done
          test "$(guest4 s4b2replacement)" = "$b4" && test "$(guest6 s4b2replacement)" = "$b6"
          sudo incus --project bwowned exec s4b2a -- ip -4 neigh del "$b4" dev eth0 || :
          if sudo incus --project bwowned exec s4b2a -- ping -n -c 2 -W 2 "$b4" >/dev/null 2>&1; then exit 66; fi
          sudo incus --project bwowned exec s4b2a -- ip -6 neigh del "$b6" dev eth0 || :
          if sudo incus --project bwowned exec s4b2a -- ping -n -6 -c 2 -W 2 "$b6" >/dev/null 2>&1; then exit 68; fi
          echo "S4_B2_FAULT_LAB_IPV6_REVOKE_BEFORE_REUSED_UUID_DENY=PASS"
          echo "S4_B2_NATIVE_DEDICATED_REVOKE_BEFORE_DUAL_STACK_REUSE_NO_IP_TRANSFER=PASS"
          for box in s4b2a s4b2c s4b2replacement; do
            sudo incus --project bwowned stop "$box"
            sudo incus --project bwowned delete "$box"
          done
          sudo incus --project bwowned profile device unset default eth0 security.acls
          sudo incus project delete bwowned
          sudo incus network acl show bw-s4b2-native | grep -Fqx 'used_by: []'
          sudo incus network acl delete bw-s4b2-native
          sudo incus network delete bwbr0
          test -z "$(sudo incus list --all-projects --format csv -c n)"
          echo "S4_B2_NATIVE_DEDICATED_COMPLETE_CLEANUP=PASS"
