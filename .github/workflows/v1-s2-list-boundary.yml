name: S2 operation_list compiled boundary targeted regression
on:
  push:
    branches: [feat/v1-rc11-list-boundary-20261121]
    paths:
      - scripts/s2_p1_operation_list_boundary*
      - .github/workflows/v1-s2-list-boundary.yml
      - internal/control/**
      - internal/state/**
  workflow_dispatch:
permissions:
  contents: read
jobs:
  list-boundary:
    if: github.repository == 'vanishs/boxweave' && github.ref == 'refs/heads/feat/v1-rc11-list-boundary-20261121'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RUNNER_ENVIRONMENT: github-hosted
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Exact optimized candidate and independent auth cuts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          sh -n scripts/s2_p1_operation_list_boundary.sh
          sh -n scripts/s2_p1_operation_list_boundary_ci.sh
          sh scripts/s2_p1_operation_list_boundary_ci.sh | tee "$RUNNER_TEMP/list-boundary.log"
          test "$(grep -Fxc S2_P1_REAL_INSTALLED_OPERATION_LIST_INFLIGHT_REVOCATION_AND_EXPIRY_NO_LEAK=PASS "$RUNNER_TEMP/list-boundary.log")" = 2
          grep -Fxq LIST_BOUNDARY_TWO_INDEPENDENT_RUNS_PASS "$RUNNER_TEMP/list-boundary.log"
