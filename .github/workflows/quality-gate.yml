name: v1 required quality gate

on:
  push:
    branches:
      - v1
      - "feat/v1-*"
    # Do not launch push checks just because Markdown documentation changed.
    paths-ignore:
      - "**/*.md"
      - "**/*.mdx"
      - "**/*.rst"
  pull_request:
    branches:
      - v1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v1-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout entire history for changed-file whitespace validation
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      # Keep this required job on EVERY v1 PR: a path-filtered required
      # workflow can leave an expected status permanently Pending.
      - name: Classify docs-only changes (fail closed on uncertainty)
        id: scope
        run: python3 scripts/ci_change_scope.py >> "$GITHUB_OUTPUT"
      - name: Unit-test change classification
        run: python3 -m unittest -v scripts/test_ci_change_scope.py
      - name: Test local docs-only hook classification
        run: python3 -m unittest -v scripts/test_local_hook_scope.py
      - name: Docs-only PR — check changed text format only
        if: steps.scope.outputs.docs_only == 'true'
        shell: bash
        run: |
          set -euo pipefail
          base="$(git merge-base HEAD origin/v1)"
          git diff --check "$base" HEAD
          git diff --no-renames --name-only --diff-filter=ACM -z "$base" HEAD -- |
            python3 scripts/check_format.py --paths0
      - name: Set up pinned Go
        if: steps.scope.outputs.docs_only != 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check whole repository formatting (gofmt, UTF-8, LF, Markdown, YAML, JSON)
        if: steps.scope.outputs.docs_only != 'true'
        run: python3 scripts/check_format.py
      - name: Parse tracked YAML and refuse duplicate keys
        if: steps.scope.outputs.docs_only != 'true'
        run: go run scripts/check_yaml.go
      - name: Reject newly introduced trailing whitespace
        if: steps.scope.outputs.docs_only != 'true'
        shell: bash
        run: |
          set -euo pipefail
          base="$(git merge-base HEAD origin/v1)"
          git diff --check "$base" HEAD
      - name: Check tracked shell script syntax
        if: steps.scope.outputs.docs_only != 'true'
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r path; do
            sh -n "$path"
          done < <(git ls-files '*.sh' '.githooks/pre-*')
      - name: Ensure precise Go module formatting and verified checksums
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          go mod verify
          go mod tidy -diff
      - name: Static Go vet
        if: steps.scope.outputs.docs_only != 'true'
        run: go vet ./...
      - name: Full Go race regression tests
        if: steps.scope.outputs.docs_only != 'true'
        env:
          CGO_ENABLED: "1"
        run: |
          go test -race -count=1 ./...
          go test -tags=s1lab -count=1 ./internal/install
      - name: Verify Go source builds
        if: steps.scope.outputs.docs_only != 'true'
        env:
          CGO_ENABLED: "1"
        run: go build ./...

# Required check name: "quality-gate" (this job).
# To actually block merges configure a GitHub ruleset on v1, requiring this
# check; merely having a workflow does not enforce merge protection.
