name: v1 required quality gate

on:
  push:
    branches:
      - v1
      - "feat/v1-*"
  pull_request:
    branches:
      - v1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v1-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout entire history for changed-file whitespace validation
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Determine documentation-only vs full CI scope
        id: scope
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_REF: ${{ github.ref }}
          CI_BEFORE_SHA: ${{ github.event.before }}
          CI_BASE_REF: ${{ github.base_ref }}
        run: python3 scripts/ci_change_scope.py
      - name: Test CI change-scope fail-closed behavior
        run: python3 scripts/test_ci_change_scope.py
      - name: Set up pinned Go
        if: steps.scope.outputs.full == 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check whole repository formatting (gofmt, UTF-8, LF, Markdown, YAML, JSON)
        run: python3 scripts/check_format.py
      - name: Parse tracked YAML and refuse duplicate keys
        if: steps.scope.outputs.full == 'true'
        run: go run scripts/check_yaml.go
      - name: Reject newly introduced trailing whitespace
        shell: bash
        run: |
          set -euo pipefail
          base="$(git merge-base HEAD origin/v1)"
          git diff --check "$base" HEAD
      - name: Check tracked shell script syntax
        if: steps.scope.outputs.full == 'true'
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r path; do
            sh -n "$path"
          done < <(git ls-files '*.sh' '.githooks/pre-*')
      - name: Python MCP loopback client and protocol negative tests
        if: steps.scope.outputs.full == 'true'
        run: python3 -m unittest discover -s scripts -p 'test_mcp_testkit.py' -q
      - name: Offline scoped uninstall planner/approval/negative tests
        if: steps.scope.outputs.full == 'true'
        run: python3 -m unittest discover -s scripts -p 'test_uninstall_core.py' -q
      - name: Ensure precise Go module formatting and verified checksums
        if: steps.scope.outputs.full == 'true'
        run: |
          go mod verify
          go mod tidy -diff
      - name: Static Go vet
        if: steps.scope.outputs.full == 'true'
        run: go vet ./...
      - name: Full Go race regression tests
        if: steps.scope.outputs.full == 'true'
        env:
          CGO_ENABLED: "1"
        run: |
          go test -race -count=1 ./...
          go test -tags=s1lab -count=1 ./internal/install
      - name: Verify Go source builds
        if: steps.scope.outputs.full == 'true'
        env:
          CGO_ENABLED: "1"
        run: go build ./...

      - name: Documentation-only fast-path verdict
        if: steps.scope.outputs.full == 'false'
        run: echo "CI_DOCS_ONLY_FAST_PATH=PASS (format, whitespace and classifier tests)"

# Required check name: "quality-gate" (this job).
# To actually block merges configure a GitHub ruleset on v1, requiring this
# check; merely having a workflow does not enforce merge protection.
