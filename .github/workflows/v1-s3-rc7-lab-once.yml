# Single-use owner-requested RC7 S3 LAB acceptance only.
# This is intentionally NOT the protected-v1 v1-release workflow.
# RC7 is a prerelease built from the unmerged PR #152 head; no stable pointer,
# no release/production or security signoff and no L0/L1 mutation by CI.
name: S3 RC7 pre-merge lab acceptance prerelease
on:
  push:
    branches:
      - feat/v1-s3-agent-files-20261115
permissions:
  contents: read
concurrency:
  group: v1-s3-rc7-lab-once
  cancel-in-progress: false

jobs:
  source:
    name: rc7-lab-exact-source-quality
    if: github.repository == 'vanishs/boxweave' && github.ref == 'refs/heads/feat/v1-s3-agent-files-20261115'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Source format, tests and manifest tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = 1.0.0
          sh -n install.sh
          make verify
          python3 -m unittest -v scripts/test_v1_release_manifest.py
          echo S3_RC7_LAB_SOURCE_QUALITY=PASS

  linux:
    name: rc7-lab-linux-${{ matrix.arch }}
    if: github.repository == 'vanishs/boxweave' && github.ref == 'refs/heads/feat/v1-s3-agent-files-20261115'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build real native CGO binary with exact immutable RC7 provenance
        shell: bash
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = 1.0.0
          test "$(go env GOARCH)" = "$TARGET_ARCH"
          test "$(go env CGO_ENABLED)" = 1
          mkdir -p release-assets
          name="boxweave-v1.0.0-rc.7-linux-$TARGET_ARCH"
          CGO_ENABLED=1 go build -trimpath -buildvcs=false \
            -ldflags "-X main.version=1.0.0-rc.7 -X main.commit=$GITHUB_SHA -buildid=" \
            -o "release-assets/$name" ./cmd/boxweave
          python3 - "release-assets/$name" "$GITHUB_SHA" <<'PY'
          import json, subprocess, sys
          data = json.loads(subprocess.check_output([sys.argv[1], 'build-info']))
          assert data == {"version":"1.0.0-rc.7", "commit":sys.argv[2]}, data
          PY
          sha256sum "release-assets/$name"
          echo S3_RC7_LAB_EXACT_SOURCE_CGO_BINARY=PASS
      - uses: actions/upload-artifact@v4
        with:
          name: s3-rc7-lab-linux-${{ matrix.arch }}
          path: release-assets/
          retention-days: 14
          if-no-files-found: error

  native-installed:
    name: rc7-lab-real-installed-incus76-http-mcp-git-loop
    if: github.repository == 'vanishs/boxweave' && github.ref == 'refs/heads/feat/v1-s3-agent-files-20261115'
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      RUNNER_ENVIRONMENT: github-hosted
      S3_FILE_INSTALLED_PHASE2: 'true'
      S3_FILE_INSTALLED_PHASE3: 'true'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: One-use runner guard
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(id -u)" -ne 0
          sudo -n true
          test ! -e /var/lib/incus
          ! id boxweave >/dev/null 2>&1
          sh -n scripts/s25_bridgehead_lab.sh
      - name: Real native installed MCP, original Git fail/fix/pass and independent verifier
        shell: bash
        run: |
          set -o pipefail
          sh scripts/s25_bridgehead_lab.sh 2>&1 | tee "$RUNNER_TEMP/s3-rc7-lab-native.log"
          grep -Fxq 'S3_INSTALLED_REAL_HTTP_MCP_FILE_NEGATIVE_AND_IDEMPOTENCY=PASS' "$RUNNER_TEMP/s3-rc7-lab-native.log"
          grep -Fxq 'S3_PHASE3_RESTART_FRESH_MCP_ORIGINAL_OPERATIONS_VERIFIED=PASS' "$RUNNER_TEMP/s3-rc7-lab-native.log"
          grep -Fxq 'S3_PHASE3_INDEPENDENT_NATIVE_GIT_WORKTREE_CLEAN=PASS' "$RUNNER_TEMP/s3-rc7-lab-native.log"
          grep -Fxq 'S3_PHASE3_SINGLE_AGENT_GIT_NATIVE_VERIFIED_AND_MCP_CLEANUP=PASS' "$RUNNER_TEMP/s3-rc7-lab-native.log"
          grep -Fxq 'S3_INSTALLED_INDEPENDENT_NATIVE_BOX_ABSENCE=PASS' "$RUNNER_TEMP/s3-rc7-lab-native.log"
          echo S3_RC7_LAB_INSTALLED_NATIVE_ACCEPTANCE=PASS

  publish:
    name: rc7-lab-immutable-prerelease-only
    if: github.repository == 'vanishs/boxweave' && github.ref == 'refs/heads/feat/v1-s3-agent-files-20261115'
    needs: [source, linux, native-installed]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: s3-rc7-lab-linux-*
          path: release-assets
          merge-multiple: true
      - name: Verify exact unmerged S3 owner target, no immutable tag collision
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = vanishs/boxweave
          test "$GITHUB_REF" = refs/heads/feat/v1-s3-agent-files-20261115
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/feat/v1-s3-agent-files-20261115" --jq .object.sha)" = "$GITHUB_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/pulls/152" --jq .head.sha)" = "$GITHUB_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/pulls/152" --jq .base.ref)" = v1
          test "$(gh api "repos/$GITHUB_REPOSITORY/pulls/152" --jq .draft)" = true
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v1.0.0-rc.7" >/dev/null 2>&1; then
            echo 'Refuse replacing an existing RC7 immutable tag' >&2
            exit 1
          fi
          if gh release view v1.0.0-rc.7 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Refuse replacing an existing RC7 Release' >&2
            exit 1
          fi
          echo S3_RC7_LAB_UNMERGED_HEAD_AND_NO_COLLISION=PASS
      - name: Build exact two-arch manifest, publish immutable pre-acceptance lab RC7
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/v1_release_manifest.py --directory release-assets \
            --tag v1.0.0-rc.7 --source "$GITHUB_SHA" --installer install.sh
          (cd release-assets && sha256sum -c SHA256SUMS)
          gh api "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/v1.0.0-rc.7" -f sha="$GITHUB_SHA" >/dev/null
          gh release create v1.0.0-rc.7 release-assets/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease \
            --title 'BoxWeave v1.0.0-rc.7 S3 pre-merge L1 acceptance candidate' \
            --notes 'S3-only supervised acceptance candidate sourced from unmerged Draft PR #152. Does NOT mean v1 merge, S3_MINIMAL_PASS, S4/S5 production readiness, autonomous Agent acceptance, or OAuth refresh security. Install ONLY after preserving exact L1 original state and proving native rollback. Stable v1 pointer unchanged.'
          mkdir release-readback
          gh release download v1.0.0-rc.7 --repo "$GITHUB_REPOSITORY" --dir release-readback
          cmp release-assets/SHA256SUMS release-readback/SHA256SUMS
          (cd release-readback && sha256sum -c SHA256SUMS)
          echo S3_RC7_LAB_PUBLISHED_EXACT_SOURCE_VERIFIED_PRERELEASE=PASS
