name: Historical S5B RC10 specialized recovery CLI six leaves (disposable)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  manual-legacy-leaves:
    if: github.repository == 'vanishs/boxweave' && github.ref == 'refs/heads/docs/s5b-rc10-closeout-20261121'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      RUNNER_ENVIRONMENT: github-hosted
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Exact RC10 source and test guard
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code eb021d3985c787c517cd7aee3efaf433d38f0393 -- cmd internal go.mod go.sum install.sh uninstall.sh
          sh -n scripts/s5b_rc10_specialized_recovery.sh
          python3 -m py_compile scripts/s5b_rc10_specialized_recovery.py
      - name: Actual published binary and six specialized CLI leaves
        shell: bash
        run: |
          set -euo pipefail
          sh scripts/s5b_rc10_specialized_recovery.sh | tee "$RUNNER_TEMP/specialized-recovery.log"
          grep -Fxq S5B_RC10_SPECIALIZED_RECOVERY_CLI_SIX_LEAVES=PASS "$RUNNER_TEMP/specialized-recovery.log"
