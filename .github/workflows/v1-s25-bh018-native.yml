name: S2.5 BH-018 isolated native Exec evidence (non-release)

on:
  push:
    branches:
      - fix/v1-s25-bh018-bh019-20261114
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bh018-original-native-exec:
    name: bh018-native-original-exec-matrix
    if: github.repository == 'vanishs/boxweave' && github.ref == 'refs/heads/fix/v1-s25-bh018-bh019-20261114'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      RUNNER_ENVIRONMENT: github-hosted
      BH018_GUEST_NAME: bh018-native-startup-1114
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Guard isolated fresh CI host and probe source formatting
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(id -u)" -ne 0
          sudo -n true
          grep -qx 'ID=ubuntu' /etc/os-release
          grep -Eq '^VERSION_ID="?24[.]04"?$' /etc/os-release
          test ! -e /var/lib/incus
          test -z "$(gofmt -l scripts/bh018_native_exec_probe.go)"
          test "$GITHUB_REF" = refs/heads/fix/v1-s25-bh018-bh019-20261114
          go build -o "$RUNNER_TEMP/bh018-native-exec-probe" ./scripts/bh018_native_exec_probe.go
      - name: Install exact signed Incus 7.6 only on disposable CI runner
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates curl gpg dnsmasq-base >/dev/null
          curl -fsSL --max-time 40 https://pkgs.zabbly.com/key.asc -o "$RUNNER_TEMP/zabbly-key.asc"
          fpr="$(gpg --show-keys --with-colons "$RUNNER_TEMP/zabbly-key.asc" | awk -F: '$1=="fpr"{print $10;exit}')"
          test "$fpr" = 4EFC590696CB15B87C73A3AD82CC8797C838DCFD
          sudo install -d -m 0755 /etc/apt/keyrings
          sudo install -m 0644 "$RUNNER_TEMP/zabbly-key.asc" /etc/apt/keyrings/bh018-zabbly.asc
          sudo tee /etc/apt/sources.list.d/bh018-zabbly.sources >/dev/null <<'SIGNED'
          Enabled: yes
          Types: deb
          URIs: https://pkgs.zabbly.com/incus/stable
          Suites: noble
          Components: main
          Architectures: amd64
          Signed-By: /etc/apt/keyrings/bh018-zabbly.asc
          SIGNED
          sudo apt-get update -qq
          pkg="$(apt-cache madison incus | awk '/pkgs.zabbly.com/ && $3 ~ /:7[.]6[-.]/ {print $3; exit}')"
          test -n "$pkg"
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends "incus=$pkg" "incus-client=$pkg" "incus-base=$pkg" >/dev/null
          sudo systemctl start incus.service
          sudo systemctl is-active --quiet incus.service
          test -z "$(sudo incus list --all-projects --format csv -c n)"
          sudo incus admin init --auto --storage-backend=dir
          test -z "$(sudo incus list --all-projects --format csv -c n)"
          sudo incus version
          echo "BH018_PINNED_SIGNED_INCUS_76=PASS"
      - name: Real native Guest 3x9 original SDK calls plus side-effect negative controls
        shell: bash
        run: |
          set -euo pipefail
          sudo incus launch images:ubuntu/24.04 "$BH018_GUEST_NAME" -c limits.cpu=1 -c limits.memory=768MiB
          sudo incus info "$BH018_GUEST_NAME"
          sudo incus exec "$BH018_GUEST_NAME" -- /bin/sh -c 'test -x /bin/true && test -x /bin/false && test -x /usr/bin/timeout && test ! -e /usr/bin/bh018-definitely-missing-executable && test ! -e /bh018-definitely-missing-cwd && test ! -x /etc/hostname'
          echo "BH018_EXACT_GUEST_COMMAND_PRECONDITIONS=PASS"
          printf '%s\n' '#!/bin/sh' 'echo 127 >> /tmp/bh018-effects127' 'exit 127' > "$RUNNER_TEMP/bh018-side-effect127.sh"
          printf '%s\n' '#!/bin/sh' 'echo 126 >> /tmp/bh018-effects126' 'exit 126' > "$RUNNER_TEMP/bh018-side-effect126.sh"
          sudo incus file push "$RUNNER_TEMP/bh018-side-effect127.sh" "$BH018_GUEST_NAME/tmp/bh018-side-effect127.sh"
          sudo incus file push "$RUNNER_TEMP/bh018-side-effect126.sh" "$BH018_GUEST_NAME/tmp/bh018-side-effect126.sh"
          sudo incus exec "$BH018_GUEST_NAME" -- /bin/chmod 0755 /tmp/bh018-side-effect127.sh /tmp/bh018-side-effect126.sh
          sudo incus exec "$BH018_GUEST_NAME" -- /bin/sh -c 'test ! -e /tmp/bh018-effects127 && test ! -e /tmp/bh018-effects126 && test -x /tmp/bh018-side-effect127.sh && test -x /tmp/bh018-side-effect126.sh'
          echo "BH018_SIDE_EFFECT_NEGATIVE_CONTROLS_PREPARED=PASS"
          set +e
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,BH018_GUEST_NAME "$RUNNER_TEMP/bh018-native-exec-probe" | tee "$RUNNER_TEMP/bh018-native-exec.jsonl"
          probe_rc=$?
          set -e
          sudo incus exec "$BH018_GUEST_NAME" -- /bin/sh -c 'wc -l /tmp/bh018-effects127 /tmp/bh018-effects126'
          sudo incus exec "$BH018_GUEST_NAME" -- /bin/sh -c 'test "$(wc -l < /tmp/bh018-effects127)" -eq 3 && test "$(wc -l < /tmp/bh018-effects126)" -eq 3'
          test "$probe_rc" -eq 0
          grep -qx 'BH018_NATIVE_ORIGINAL_27_CASES=PASS' "$RUNNER_TEMP/bh018-native-exec.jsonl"
          echo "BH018_NATIVE_FAILURE_126_127_WITH_GUEST_SIDE_EFFECTS=PASS"
          echo "BH018_DIRECT_SDK_ORIGINALS_WITH_GUEST_FAILURE_BOUNDARY=PASS"
      - name: Run two-parent native Incus nesting BPF security A/B
        shell: bash
        run: |
          set -euo pipefail
          sh -n scripts/bh019_inner_setup.sh
          sh -n scripts/bh019_bpf_lab.sh
          gateway_cidr="$(sudo incus network get incusbr0 ipv4.address)"
          gateway="${gateway_cidr%%/*}"
          case "$gateway" in
            10.*|172.*|192.168.*) ;;
            *) echo BH019_NONPRIVATE_BRIDGE_REFUSED >&2; exit 84 ;;
          esac
          python3 scripts/s25_package_proxy.py "$gateway" 18466 > "$RUNNER_TEMP/bh019-proxy.log" 2>&1 &
          proxy_pid=$!
          trap 'kill "$proxy_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in 1 2 3 4; do
            if curl --silent --show-error --fail --head -x "http://$gateway:18466" --connect-timeout 3 --max-time 10 https://pkgs.zabbly.com/key.asc >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" -eq 1
          echo BH019_ALLOWLISTED_PROXY_READY=PASS
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT env BH019_PROXY_URL="http://$gateway:18466" BH019_REPORT_DIR="$RUNNER_TEMP/bh019-matrix" sh scripts/bh019_bpf_lab.sh
      - name: Preserve scoped BH-019 parent and child logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bh019-native-parent-bpf-ab
          path: ${{ runner.temp }}/bh019-matrix/
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve per-operation native JSON witnesses
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bh018-original-incus-76-exec-results
          path: ${{ runner.temp }}/bh018-native-exec.jsonl
          if-no-files-found: warn
          retention-days: 14
