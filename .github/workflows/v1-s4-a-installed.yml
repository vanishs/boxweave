name: S4-A original grant, atomic lifecycle and raw native evidence (disposable)

on:
  push:
    branches:
      - feat/v1-s4-runtime-integration-20261116
    paths:
      - '.github/workflows/v1-s4-a-installed.yml'
      - 'cmd/**'
      - 'internal/**'
      - 'scripts/**'
      - '!scripts/ci_change_scope.py'
      - '!scripts/test_ci_change_scope.py'
      - 'go.mod'
      - 'go.sum'
      - 'install.sh'
      - 'Makefile'
      - 'VERSION'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: s4-a-native-${{ github.ref }}
  cancel-in-progress: false

jobs:
  s4-a-installed-native:
    name: s4-a-isolated-incus-76-installed-mcp-raw-verifier
    if: github.repository == 'vanishs/boxweave' && github.ref == 'refs/heads/feat/v1-s4-runtime-integration-20261116'
    runs-on: ubuntu-24.04
    timeout-minutes: 125
    env:
      RUNNER_ENVIRONMENT: github-hosted
      PYTHONDONTWRITEBYTECODE: '1'
      S4_A_RAW_WITNESS: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Stage 2 role-free SDK/actor and exact ACL source gate
        shell: bash
        run: |
          set -euo pipefail
          # This proves the new principal/Token ID and ACL tests come from
          # the SAME source checkout that is installed below. Native safety
          # and actual ChatGPT OAuth still require independent evidence.
          go test -count=1 ./internal/control ./internal/install -run 'TestS2RequestPrincipalRequiresExplicitSDKCredential|TestNativePeerACLWholePolicyComparison'
          if grep -R -F -n -e 'operationCredentialID' -e 'operationPrincipal(' --include='*.go' internal/control; then
            echo S4_A_STAGE2_OLD_AUTH_ENTRYPOINT_FOUND; exit 1
          fi
          echo S4_A_STAGE2_ROLE_FREE_SDK_SOURCE_SHA=$GITHUB_SHA
      - name: Precompile every installed S2 native probe before provisioning Incus
        shell: bash
        run: |
          set -euo pipefail
          # The standalone sources use //go:build ignore and are omitted by
          # go test ./...; catch stale SDK signatures before costly native setup.
          python3 - <<'PY'
          import os, pathlib, re, subprocess
          src = pathlib.Path("scripts/accept_s2_native.sh").read_text()
          names = sorted(set(re.findall(r'\./scripts/([A-Za-z0-9_]+\.go)', src)))
          assert len(names) >= 20, "native probe manifest unexpectedly empty"
          for name in names:
              print("S4_A_STAGE2_PRECOMPILE=" + name, flush=True)
              subprocess.run(["go", "build", "-trimpath",
                              "-o", os.path.join(os.environ["RUNNER_TEMP"], "compiled-" + name[:-3]),
                              "./scripts/" + name], check=True)
          print("S4_A_STAGE2_NATIVE_PROBE_SOURCE_SIGNATURES=PASS")
          PY
      - name: Confirm one-use host, independent native witness and local regressions
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(id -u)" -ne 0
          sudo -n true
          test ! -e /var/lib/incus
          ! id boxweave >/dev/null 2>&1
          sh -n scripts/accept_s2_native.sh
          sh -n scripts/s4_oauth_native_integration.sh
          go build -o "$RUNNER_TEMP/s4-oauth-probe-compile" ./scripts/s4_oauth_installed_probe.go
          go build -o "$RUNNER_TEMP/s4-native-event-tap-compile" ./scripts/s4_raw_native_event_tap.go
          python3 -m unittest discover -s scripts -p 'test_s4_raw_operation_witness.py'
          go test -count=1 ./internal/state ./internal/control ./internal/native -run 'TestS4'
          echo "S4_A_EXACT_HEAD=$GITHUB_SHA"
          echo S4_A_FOCUSED_SOURCE_AND_WITNESS_CONTRACT=PASS
      - name: Install nonroot restricted BoxWeave and real Incus 7.6 then witness original raw terminal
        shell: bash
        run: |
          set -euo pipefail
          logfile="$RUNNER_TEMP/s4-a-isolated-native.redacted.log"
          # Stream only the same fixed evidence/phase prefixes already allowed
          # below. Raw native/probe errors and credentials stay runner-local.
          # pipefail preserves failure in any stage, including the real suite.
          if ! sh scripts/accept_s2_native.sh 2>&1 | tee "$logfile" | \
              grep --line-buffered -E '^(S4_A_|BH018_INSTALLED_|BH018_MCP_RESUME_PHASE=|S2_NATIVE_BLOCKED|S2_NATIVE_FAIL:)'; then
            grep -E '^S4_A_CANDIDATE_BINARY_SHA256=' "$logfile" || :
            grep -E '^(S4_A_|BH018_INSTALLED_|BH018_MCP_RESUME_PHASE=|S2_NATIVE_BLOCKED|S2_NATIVE_FAIL:|(panic: )?S2_UNKNOWN_CREATE_NATIVE_BIND_FAIL:)' "$logfile" | tail -n 110 || :
            grep -E '^S2_NATIVE_[A-Z0-9_]+=PASS$' "$logfile" | tail -n 12 || :
            # These three probe prefixes contain fixed test assertions only,
            # audited in source; never print arbitrary native/HTTP panic text.
            grep -E '^panic: S2_P1_(STOP_DELETE_ACK_LOSS|TOKEN_INFLIGHT|INFLIGHT_LIST)_FAIL:' "$logfile" || :
            grep -E '^S2_[A-Z0-9_]+=PASS$' "$logfile" | tail -n 20 || :
            if grep -q '^panic: S2_ACK_LOSS_ACCEPTANCE_FAILED:' "$logfile"; then
              echo S4_A_FAILURE_CLASS=ACK_PROXY_PROBE_ASSERTION
            elif grep -q '^panic: S2_P1_' "$logfile"; then
              echo S4_A_FAILURE_CLASS=P1_PROBE_ASSERTION
            fi
            echo S4_A_INSTALLED_REAL_NATIVE_MCP=FAIL_OR_BLOCKED >&2
            exit 1
          fi
          grep -Fxq 'S4_A_RAW_NATIVE_ORIGINAL_TERMINAL=PASS' "$logfile"
          for case in CREATE EXIT126 EXIT127; do
            grep -Fxq "S4_A_RAW_NATIVE_CASE_${case}=PASS" "$logfile"
          done
          grep -Fxq 'S4_A_RAW_DELETE_TERMINAL_ATOMIC_TOMBSTONE_SINGLE_ORIGINAL=PASS' "$logfile"
          grep -Fxq 'S4_A_RAW_CREATE_EXEC_FINAL_SQLITE_UUID_EXIT_CORRELATION=PASS' "$logfile"
          grep -Fxq 'S4_A_RAW_NATIVE_EVENT_ORIGINAL_TERMINAL=PASS' "$logfile"
          grep -Fxq 'S4_A_RAW_NATIVE_EVENT_STREAM=PASS' "$logfile"
          grep -Fxq 'S4_A_REAL_INSTALLED_OAUTH_REFRESH_GRANT_REPLAY_ONCE=PASS' "$logfile"
          grep -Fxq 'S4_A_INSTALLED_OAUTH_REVOKED_GRANT_MANUAL_NO_ADMISSION=PASS' "$logfile"
          grep -Fxq 'S4_A_INDEPENDENT_GUEST_ONE_EFFECT=PASS' "$logfile"
          grep -Fxq 'BH018_NATIVE_INSTALLED_MCP_ORIGINAL_126_127_ATOMIC_RECEIPTS=PASS' "$logfile"
          grep -Fxq 'BH018_NATIVE_INSTALLED_MCP_ATOMIC_RESTART_IDEMPOTENCY_AND_CLEANUP=PASS' "$logfile"
          grep -Fxq 'S2_NATIVE_SDK_MCP_BLACKBOX_REAL_INCUS=PASS' "$logfile"
          grep -E '^S4_A_' "$logfile"
          echo S4_A_INSTALLED_INCUS_76_RESTRICTED_HTTP_MCP_AND_INDEPENDENT_RAW_TERMINAL=PASS
