name: S4-B2 installed restricted controller to root peer revoke (disposable)

on:
  push:
    branches: [feat/v1-s4-runtime-integration-20261116]
    paths:
      - .github/workflows/v1-s4-b2-controller-root-installed.yml
      - internal/install/native_peer_root_integrated.go
      - internal/install/native_peer_root_installed_e2e_native_test.go
      - internal/install/native_peer_root_socket.go
      - internal/state/network_peer_root_worker.go
      - internal/control/peer_root.go
      - cmd/boxweave/main.go
  workflow_dispatch:

permissions:
  contents: read

jobs:
  root-installed-native:
    name: s4-b2-installed-controller-root-original-nft-verifier
    if: github.repository == 'vanishs/boxweave' && github.ref == 'refs/heads/feat/v1-s4-runtime-integration-20261116'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Fresh signed Incus 7.6, dedicated restricted Project and original fixture
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$(id -u)" -ne 0
          sudo -n true
          test ! -e /var/lib/incus && ! id boxweave >/dev/null 2>&1
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates curl gpg dnsmasq-base nftables conntrack sqlite3 jq >/dev/null
          curl -fsSL --max-time 30 https://pkgs.zabbly.com/key.asc -o "$RUNNER_TEMP/key.asc"
          fpr="$(gpg --show-keys --with-colons "$RUNNER_TEMP/key.asc" | awk -F: '$1=="fpr" {print $10; exit}')"
          test "$fpr" = 4EFC590696CB15B87C73A3AD82CC8797C838DCFD
          sudo install -m 0644 "$RUNNER_TEMP/key.asc" /etc/apt/keyrings/s4b2-root-zabbly.asc
          echo 'deb [arch=amd64 signed-by=/etc/apt/keyrings/s4b2-root-zabbly.asc] https://pkgs.zabbly.com/incus/stable noble main' | sudo tee /etc/apt/sources.list.d/s4b2-root-incus.list >/dev/null
          sudo apt-get update -qq
          pkg="$(apt-cache madison incus | awk '/pkgs.zabbly.com/ && $3 ~ /:7[.]6[-.]/ {print $3; exit}')"
          test -n "$pkg"
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends "incus=$pkg" "incus-client=$pkg" "incus-base=$pkg" >/dev/null
          sudo systemctl start incus.service
          sudo incus admin init --auto --storage-backend=dir
          sudo incus version
          test -z "$(sudo incus list --all-projects --format csv -c n)"
          sudo useradd -m -s /bin/sh boxweave
          uid="$(id -u boxweave)"
          test "$uid" -ge 1000
          project="user-$uid"
          sudo incus network create bwbr0 ipv4.address=10.248.83.1/24 ipv4.nat=true ipv6.address=fd83:248::1/64 ipv6.nat=true ipv6.dhcp.stateful=true
          go test -c -o "$RUNNER_TEMP/s4b2-root-fixture" ./internal/install
          sudo install -m 0755 "$RUNNER_TEMP/s4b2-root-fixture" /usr/local/bin/s4b2-root-fixture
          sudo env GITHUB_ACTIONS=true BOXWEAVE_DISPOSABLE_NATIVE_PROBE=s4b1-ci-20261116 \
            /usr/local/bin/s4b2-root-fixture -test.v -test.run '^TestS4B2NativeDedicatedBridgeACLSetup$'
          sudo incus project create "$project" \
            -c restricted=true -c features.images=false -c features.profiles=true -c features.networks=false \
            -c restricted.devices.nic=managed -c restricted.networks.access=bwbr0
          sudo incus --project "$project" profile device add default root disk path=/ pool=default
          sudo incus --project "$project" profile device add default eth0 nic name=eth0 \
            network=bwbr0 security.acls=bw-s4b2-native \
            security.acls.default.ingress.action=reject security.acls.default.egress.action=reject \
            security.ipv4_filtering=true security.ipv6_filtering=true security.mac_filtering=true
          for spec in 's4b2a 10.248.83.11 fd83:248::11' 's4b2b 10.248.83.12 fd83:248::12' 's4b2c 10.248.83.13 fd83:248::13'; do
            read -r name ipv4 ipv6 <<< "$spec"
            sudo incus --project "$project" init images:ubuntu/24.04 "$name" -c limits.cpu=1 -c limits.memory=512MiB
            sudo incus --project "$project" config device override "$name" eth0 "ipv4.address=$ipv4" "ipv6.address=$ipv6"
            sudo incus --project "$project" start "$name"
          done
          for attempt in $(seq 1 45); do
            all_ready=1
            for name in s4b2a s4b2b s4b2c; do
              sudo incus --project "$project" exec "$name" -- ip -4 addr show eth0 | grep -q '10.248.83.' || all_ready=0
            done
            if test "$all_ready" = 1; then break; fi
            sleep 2
          done
          test "$all_ready" = 1
          sudo install -d -m0700 -o boxweave -g boxweave /var/lib/boxweave
          go build -o "$RUNNER_TEMP/boxweave-candidate" ./cmd/boxweave
          sudo install -m0755 "$RUNNER_TEMP/boxweave-candidate" /usr/local/bin/bw-s4b2-installed
          sudo env GITHUB_ACTIONS=true BOXWEAVE_S4B2_INSTALLED_ONE_USE=20261117-controller-root \
            BOXWEAVE_S4B2_INSTALLED_SCOPE=/tmp/s4b2-installed-scope.json \
            /usr/local/bin/s4b2-root-fixture -test.v -test.run '^TestS4B2NativeInstalledRootSeedReviewedGrant$'
          sudo -u boxweave env GITHUB_ACTIONS=true BOXWEAVE_S4B2_INSTALLED_ONE_USE=20261117-controller-root \
            BOXWEAVE_S4B2_INSTALLED_SCOPE=/tmp/s4b2-installed-scope.json \
            BOXWEAVE_S4B2_INSTALLED_DB=/var/lib/boxweave/ledger.sqlite \
            /usr/local/bin/s4b2-root-fixture -test.v -test.run '^TestS4B2NativeInstalledNonrootSeedOriginal$' \
            | tee "$RUNNER_TEMP/s4b2-root-seed.log"
          original="$(sed -n 's/^S4_B2_INSTALLED_ORIGINAL_ID=//p' "$RUNNER_TEMP/s4b2-root-seed.log" | tail -n1)"
          test "${#original}" -eq 32
          echo "S4_B2_INSTALLED_SOURCE_SHA=$GITHUB_SHA"
          echo "S4_B2_INSTALLED_EXACT_ORIGINAL=$original"
          echo "S4_B2_INSTALLED_SETUP_RESTRICTED_PROJECT_AND_PINNED_ROOT_GRANT=PASS"
          echo "$original" > "$RUNNER_TEMP/s4b2-root-original-id"
          echo "$project" > "$RUNNER_TEMP/s4b2-root-project"
      - name: Execute actual nonroot controller to operator-approved root socket and verify original
        shell: bash
        run: |
          set -euo pipefail
          original="$(cat "$RUNNER_TEMP/s4b2-root-original-id")"
          project="$(cat "$RUNNER_TEMP/s4b2-root-project")"
          db=/var/lib/boxweave/ledger.sqlite
          bin=/usr/local/bin/bw-s4b2-installed
          rootpid=''
          phase=INIT
          cleanup_helper() {
            if test -n "$rootpid"; then sudo kill "$rootpid" 2>/dev/null || :; fi
          }
          failure_diagnostics() {
            local rc=$?
            echo "S4_B2_INSTALLED_FAILURE_PHASE=$phase EXIT=$rc"
            echo "S4_B2_INSTALLED_SQLITE_OPERATION_STATE=$(sudo -u boxweave sqlite3 "$db" "SELECT state FROM operations WHERE id='$original'" 2>/dev/null || echo QUERY_FAILED)"
            echo "S4_B2_INSTALLED_SQLITE_PEER_STATUS=$(sudo -u boxweave sqlite3 "$db" "SELECT status FROM peer_grants WHERE operation_id='$original'" 2>/dev/null || echo QUERY_FAILED)"
            local journal="/var/lib/boxweave-native-peer-conntrack-v1/$original.json"
            if sudo test -f "$journal"; then
              sudo jq -cr '{status:.status,probed:.report.probed_scopes,deleted:.report.deleted_scopes,kernel:.report.kernel_verified,verified_nics:.report.verified_nics}' "$journal" 2>/dev/null || :
            else
              echo "S4_B2_INSTALLED_ROOT_JOURNAL=ABSENT"
            fi
            if test -f "$RUNNER_TEMP/s4b2-root-helper.log"; then
              echo S4_B2_INSTALLED_ROOT_HELPER_LOG_BEGIN
              sed -n '1,20p' "$RUNNER_TEMP/s4b2-root-helper.log" | cut -c 1-240
              echo S4_B2_INSTALLED_ROOT_HELPER_LOG_END
            fi
          }
          trap failure_diagnostics ERR
          trap cleanup_helper EXIT
          phase=STAGE
          sudo -u boxweave "$bin" native-peer-root-stage -db "$db" -project "$project" -operation-id "$original"
          test "$(sudo -u boxweave sqlite3 "$db" "SELECT state FROM operations WHERE id='$original'")" = DISPATCHING
          phase=ROOT_PLAN
          sudo "$bin" native-peer-root-plan -db "$db" -project "$project" -network bwbr0 -acl bw-s4b2-native \
            -operation-id "$original" > "$RUNNER_TEMP/s4b2-root-plan.json"
          sha="$(jq -r .plan_sha256 "$RUNNER_TEMP/s4b2-root-plan.json")"
          test "${#sha}" -eq 64
          echo "S4_B2_INSTALLED_OPERATOR_PREMUTATION_SHA=$sha"
          phase=ROOT_SERVE
          sudo "$bin" native-peer-root-serve -db "$db" -project "$project" -network bwbr0 -acl bw-s4b2-native \
            -operation-id "$original" -peer-plan-sha256 "$sha" -approve-local \
            > "$RUNNER_TEMP/s4b2-root-helper.log" 2>&1 &
          rootpid=$!
          ready=0
          for _ in $(seq 1 30); do
            if sudo test -S /run/boxweave-native-peer-root.sock; then ready=1; break; fi
            sleep 1
          done
          if test "$ready" != 1; then
            echo S4_B2_INSTALLED_ROOT_SOCKET_START_FAILED
            sed -n '1,20p' "$RUNNER_TEMP/s4b2-root-helper.log"
            exit 91
          fi
          phase=ROOT_EXECUTE
          sudo -u boxweave "$bin" native-peer-root-execute -db "$db" -project "$project" -operation-id "$original"
          echo S4_B2_INSTALLED_ROOT_EXECUTE_EXIT_ZERO=PASS
          phase=SQLITE_FINAL_OPERATION
          test "$(sudo -u boxweave sqlite3 "$db" "SELECT state FROM operations WHERE id='$original'")" = SUCCEEDED
          phase=SQLITE_GRANT
          test "$(sudo -u boxweave sqlite3 "$db" "SELECT status FROM peer_grants WHERE operation_id='$original'")" = REVOKED
          phase=ROOT_JOURNAL
          sudo test -f "/var/lib/boxweave-native-peer-conntrack-v1/$original.json"
          sudo grep -q '"status":"COMPLETE_VERIFIED"' "/var/lib/boxweave-native-peer-conntrack-v1/$original.json"
          if sudo -u boxweave "$bin" native-peer-root-execute -db "$db" -project "$project" -operation-id "$original" >/dev/null 2>&1; then
            echo S4_B2_INSTALLED_ROOT_REPLAY_UNSAFE; exit 92
          fi
          phase=KERNEL_NFT
          sudo env GITHUB_ACTIONS=true BOXWEAVE_DISPOSABLE_NATIVE_PROBE=s4b1-ci-20261116 \
            BOXWEAVE_S4B2_INSTALLED_ONE_USE=20261117-controller-root BOXWEAVE_S4B2_NATIVE_ROOT_PROJECT="$project" \
            /usr/local/bin/s4b2-root-fixture -test.v -test.run '^TestS4B2NativeRootKernelPerNICDropReadback$'
          phase=RESUMED_GUEST_STATES
          for name in s4b2a s4b2b; do
            test "$(sudo incus --project "$project" list "$name" -c s --format csv)" = RUNNING
            test "$(sudo incus --project "$project" config get "$name" boot.autostart)" = false
          done
          if sudo incus --project "$project" exec s4b2a -- ping -n -c 1 -W 2 10.248.83.12 >/dev/null 2>&1; then
            echo S4_B2_INSTALLED_REVOKE_IPV4_REACHABLE; exit 93
          fi
          if sudo incus --project "$project" exec s4b2a -- ping -n -c 1 -W 2 fd83:248::12 >/dev/null 2>&1; then
            echo S4_B2_INSTALLED_REVOKE_IPV6_REACHABLE; exit 94
          fi
          echo "S4_B2_INSTALLED_NONROOT_ROOT_SOCKET_OPERATOR_SHA_ORIGINAL_NFT_SQLITE_REVOKE=PASS"
      - name: Independent one-use root/Project/ACL cleanup
        if: always()
        shell: bash
        run: |
          set -u
          if id boxweave >/dev/null 2>&1 && sudo incus version >/dev/null 2>&1; then
            project="user-$(id -u boxweave)"
            for name in s4b2a s4b2b s4b2c; do
              sudo incus --project "$project" delete "$name" --force 2>/dev/null || :
            done
            sudo incus project delete "$project" 2>/dev/null || :
            sudo incus network acl delete bw-s4b2-native 2>/dev/null || :
            sudo incus network delete bwbr0 2>/dev/null || :
            sudo incus list --all-projects --format csv -c n
            echo S4_B2_INSTALLED_ROOT_DISPOSABLE_CLEANUP_ATTEMPTED=TRUE
          fi
