name: S2.5 independent disposable nested MCP LAB (non-release)

on:
  push:
    branches:
      - feat/v1-s25-native-readiness-20261111
  workflow_dispatch:

permissions:
  contents: read

jobs:
  s25-bridgehead-lab:
    name: s25-nested-mcp-dual-agent-independent-verifier
    if: github.repository == 'vanishs/boxweave'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      RUNNER_ENVIRONMENT: github-hosted
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate isolated LAB scripts and independent verifier
        run: |
          sh -n scripts/s25_bridgehead_lab.sh
          sh -n scripts/s25_inner_setup.sh
          python3 -m py_compile scripts/s25_independent_verifier.py
          python3 -m py_compile scripts/s25_simwan6.py
          python3 -m py_compile scripts/s25_r12_foreign_l1.py
          go build -o "$RUNNER_TEMP/s25-agent-build-check" ./scripts/s25_lab_agent.go
      - name: Exact-source native L0 -> MCP L1 -> MCP L2, two Agents and independent verification
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/s25-evidence"
          sh scripts/s25_bridgehead_lab.sh 2>&1 | tee "$RUNNER_TEMP/s25-evidence/console.log"
          grep -qx "S25_HTTP_BAD_HOST_ORIGIN_PATH_AND_TOKEN_DENIAL=PASS" "$RUNNER_TEMP/s25-evidence/console.log"
          grep -qx "S25_ORIGINAL_KEY_DIFFERENT_INTENT_DENIED=PASS" "$RUNNER_TEMP/s25-evidence/console.log"
          grep -qx "S25_MCP_QUIET_RUNNING_BOUNDED_WAIT=PASS" "$RUNNER_TEMP/s25-evidence/console.log"
          grep -qx "S25_MCP_QUIET_FINISH_UNCANCELLED=PASS" "$RUNNER_TEMP/s25-evidence/console.log"
          grep -qx "S25_V_QUIET_ORIGINAL_SQLITE_RECONCILED=PASS" "$RUNNER_TEMP/s25-evidence/console.log"
          grep -qx "S25_L1_MCP_L2_UPDATE_STOP_START_SAME_UUID=PASS" "$RUNNER_TEMP/s25-evidence/console.log"
          grep -qx "S25_V_L1_MCP_L2_UPDATE_STOP_START_SAME_NATIVE_UUID=PASS" "$RUNNER_TEMP/s25-evidence/console.log"
          grep -qx "S25_V_MCP_L2_NATIVE_IPV4_IPV6_GATEWAY_EGRESS=PASS" "$RUNNER_TEMP/s25-evidence/console.log"
          grep -qx "S25_MCP_GUEST_GIT_TEST_ORIGINAL_FAILURE=PASS" "$RUNNER_TEMP/s25-evidence/console.log"
          grep -qx "S25_MCP_GUEST_GIT_FIX_AND_RETEST=PASS" "$RUNNER_TEMP/s25-evidence/console.log"
          grep -qx "S25_V_MCP_ORIGINAL_GIT_FAIL_AND_REPAIR_OPS=PASS" "$RUNNER_TEMP/s25-evidence/console.log"
          grep -qx 'S25_SIMWAN6_SEPARATELY_ROUTED_TLS_HOST_CONTROL=PASS' "$RUNNER_TEMP/s25-evidence/console.log"
          grep -qx 'S25_SIMWAN6_OUTER_MCP_IPV6_TLS_PER_NIC_ON_OFF_ON=PASS' "$RUNNER_TEMP/s25-evidence/console.log"
          grep -qx 'S25_V_SIMWAN6_OUTER_SDK_ORIGINALS_NATIVE_NIC_ROUTED_TLS_PEER_DENIAL=PASS' "$RUNNER_TEMP/s25-evidence/console.log"
          grep -qx 'S25_V_SIMWAN6_OUTER_ORIGINAL_MCP_PEER_DELETED=PASS' "$RUNNER_TEMP/s25-evidence/console.log"
          grep -qx 'S25_SIMWAN6_INNER_MCP_IPV6_TLS_PER_NIC_ON_OFF_ON=PASS' "$RUNNER_TEMP/s25-evidence/console.log"
          grep -qx 'S25_V_SIMWAN6_INNER_SDK_ORIGINALS_NATIVE_NIC_ROUTED_TLS_PEER_DENIAL=PASS' "$RUNNER_TEMP/s25-evidence/console.log"
          grep -qx 'S25_V_SIMWAN6_INNER_ORIGINAL_MCP_PEER_DELETED=PASS' "$RUNNER_TEMP/s25-evidence/console.log"
          grep -qx 'S25_SIMWAN6_BOTH_LAYER_RAW_PACKET_AND_NATIVE_EVIDENCE_ARCHIVED=PASS' "$RUNNER_TEMP/s25-evidence/console.log"
          grep -qx 'S25_R2_REAL_SERVICE_SIGKILL_DISTINCT_PID_HTTP_AUTH_RECOVERY=PASS' "$RUNNER_TEMP/s25-evidence/console.log"
          grep -qx 'S25_R2_SIGKILL_ORIGINAL_TWO_AGENT_SQLITE_AND_NATIVE_NO_REPLAY=PASS' "$RUNNER_TEMP/s25-evidence/console.log"
          grep -qx 'S25_R2_UNBACKED_ROLLBACK_AND_BAD_UPGRADE_DIGEST_REFUSED=PASS' "$RUNNER_TEMP/s25-evidence/console.log"
          grep -qx 'S25_R2_EXACT_SOURCE_CANARY_UPGRADE_WITH_LEDGER_BACKUP=PASS' "$RUNNER_TEMP/s25-evidence/console.log"
          grep -qx 'S25_R2_OPERATOR_FALLBACK_WHILE_MCP_UNAVAILABLE=PASS' "$RUNNER_TEMP/s25-evidence/console.log"
          grep -qx 'S25_R2_OPERATOR_ROOT_LOCAL_EXACT_BINARY_ROLLBACK=PASS' "$RUNNER_TEMP/s25-evidence/console.log"
          grep -qx 'S25_R2_MCP_ORIGINAL_SUCCEEDED_RECEIPTS_AFTER_ROLLBACK=PASS' "$RUNNER_TEMP/s25-evidence/console.log"
          grep -qx 'S25_V_R2_ORIGINAL_OPS_EXACT_BINARY_SQLITE_NATIVE_ROLLBACK=PASS' "$RUNNER_TEMP/s25-evidence/console.log"
          grep -qx 'S25_V_R12_L1_FOREIGN_PROJECT_PACKET_AND_PARENT_SOCKET=PASS' "$RUNNER_TEMP/s25-evidence/console.log"
          grep -qx 'S25_V_R12_L1_FOREIGN_NATIVE_UUID_CLEANUP=PASS' "$RUNNER_TEMP/s25-evidence/console.log"
          grep -qx 'S25_R12_L1_FOREIGN_PACKET_AND_SOCKET_INDEPENDENT_V=PASS' "$RUNNER_TEMP/s25-evidence/console.log"
          grep -qx 'S25_R12_TWO_AGENT_RESOURCE_CONFLICT_DENIED=PASS' "$RUNNER_TEMP/s25-evidence/console.log"
          grep -qx 'S25_R12_REAL_MCP_REPLY_LOST_AFTER_DISPATCH_NO_RETRY=PASS' "$RUNNER_TEMP/s25-evidence/console.log"
          grep -qx 'S25_R12_INDEPENDENT_AGENT_RECOVERED_MCP_LOST_REPLY_ORIGINAL=PASS' "$RUNNER_TEMP/s25-evidence/console.log"
          grep -qx 'S25_R12_REVOKED_ORIGINAL_AGENT_HTTP_401=PASS' "$RUNNER_TEMP/s25-evidence/console.log"
          grep -qx 'S25_R12_POST_REVOKE_SECOND_AGENT_ORIGINAL_RECEIPT_INTACT=PASS' "$RUNNER_TEMP/s25-evidence/console.log"
          grep -qx 'S25_V_R12_LOST_ACK_EXACT_ONE_NATIVE_EXEC_ORIGINAL=PASS' "$RUNNER_TEMP/s25-evidence/console.log"
          grep -qx 'S25_R2_ORIGINAL_SQLITE_NATIVE_CLEAN_AFTER_ROLLBACK=PASS' "$RUNNER_TEMP/s25-evidence/console.log"
          grep -qx 'S25_TARGETED_MCP_DUAL_AGENT_RECOVERY_VERIFIER=PASS' "$RUNNER_TEMP/s25-evidence/console.log"
          grep -qx 'S25_ALL_BH_AND_TC_FORMAL_SIGNOFF=NOT_YET' "$RUNNER_TEMP/s25-evidence/console.log"
      - name: Retain exact test metadata and independently observed results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s25-nested-mcp-lab-evidence
          path: ${{ runner.temp }}/s25-evidence/
          retention-days: 7
          if-no-files-found: warn
