name: S2.5 BH-018 installed HTTP MCP candidate (isolated non-release)

on:
  push:
    branches:
      - fix/v1-s25-bh018-bh019-20261114
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bh018-installed-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  isolated-installed-mcp:
    name: bh018-installed-http-mcp-incus-76
    if: github.repository == 'vanishs/boxweave' && github.ref == 'refs/heads/fix/v1-s25-bh018-bh019-20261114'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      RUNNER_ENVIRONMENT: github-hosted
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Guard pristine owned runner and run focused SQLite/source regression
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(id -u)" -ne 0
          sudo -n true
          test ! -e /var/lib/incus
          ! id boxweave >/dev/null 2>&1
          test -z "$(gofmt -l internal/state/worker_bh018_lost_finalize_ack_test.go)"
          go test -count=1 ./internal/state ./internal/native ./internal/control -run TestBH018
          printf 'BH018_NONRELEASE_SOURCE_SHA=%s\n' "$GITHUB_SHA"
          echo BH018_ISOLATED_SOURCE_SQLITE_GUARD=PASS
      - name: Real installed nonroot HTTP MCP and Incus 7.6 S2+BH018 matrix
        shell: bash
        run: |
          set -euo pipefail
          # accept_s2_native.sh rejects any pre-existing Incus or service user
          # before installation. It operates only on this expendable CI VM.
          # Keep all raw output in this runner's private temporary directory;
          # do not upload credentials or state databases as artifacts.
          logfile="$RUNNER_TEMP/bh018-isolated-native.log"
          if ! sh scripts/accept_s2_native.sh >"$logfile" 2>&1; then
            grep -E '^(BH018_|S2_NATIVE_|S2_P1_|S2_P0_)' "$logfile" | tail -n 100 || :
            echo 'BH018_INSTALLED_NATIVE_MCP=BLOCKED_OR_FAILED; see isolated-runner diagnostics' >&2
            exit 1
          fi
          grep -Fxq 'BH018_NATIVE_INSTALLED_MCP_ORIGINAL_126_127_ATOMIC_RECEIPTS=PASS' "$logfile"
          grep -Fxq 'BH018_NATIVE_INSTALLED_MCP_ATOMIC_RESTART_IDEMPOTENCY_AND_CLEANUP=PASS' "$logfile"
          # Signing this exact-source installed job additionally requires the
          # *real daemon* SQLite WAL terminal SIGKILL, read-only all-or-none
          # SQLite oracle and independent Guest one-effect witness. An
          # earlier 126/127 green cannot substitute for these hard gates.
          grep -Fxq 'BH018_INSTALLED_SERVICE_KILLED_DURING_REAL_EXEC_SQLITE_WAL_COMMIT=PASS' "$logfile"
          grep -Fxq 'BH018_INSTALLED_WAL_KILL_SQLITE_TERMINAL_OR_UNKNOWN_CROSSCHECK=PASS' "$logfile"
          grep -Fxq 'BH018_INSTALLED_SERVICE_PRECOMMIT_SIGKILL_GUEST_EFFECT_ONCE=PASS' "$logfile"
          grep -Fxq 'BH018_INSTALLED_SERVICE_WAL_COMMIT_SIGKILL_UNKNOWN_LOCK_AND_TEARDOWN=PASS' "$logfile"
          grep -Fxq 'S2_NATIVE_SDK_MCP_BLACKBOX_REAL_INCUS=PASS' "$logfile"
          grep -E '^(BH018_|S2_NATIVE_)' "$logfile" | tail -n 100
          echo BH018_CANDIDATE_REAL_INSTALLED_HTTP_MCP_MATRIX=PASS
