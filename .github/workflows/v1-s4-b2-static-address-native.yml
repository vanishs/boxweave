name: S4-B2 disposable native dual-stack static lease and reuse test
on:
  push:
    branches: [feat/v1-s4-runtime-integration-20261116]
    paths: [.github/workflows/v1-s4-b2-static-address-native.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    if: github.repository == 'vanishs/boxweave' && github.ref == 'refs/heads/feat/v1-s4-runtime-integration-20261116'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare clean native Incus 7.6 and static-capable bridge
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true && test ! -e /var/lib/incus
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates curl gpg dnsmasq-base >/dev/null
          curl -fsSL --max-time 30 https://pkgs.zabbly.com/key.asc -o "$RUNNER_TEMP/key.asc"
          fpr="$(gpg --show-keys --with-colons "$RUNNER_TEMP/key.asc" | awk -F: '$1=="fpr" {print $10; exit}')"
          test "$fpr" = 4EFC590696CB15B87C73A3AD82CC8797C838DCFD
          sudo install -m 0644 "$RUNNER_TEMP/key.asc" /etc/apt/keyrings/s4b2-static-zabbly.asc
          echo 'deb [arch=amd64 signed-by=/etc/apt/keyrings/s4b2-static-zabbly.asc] https://pkgs.zabbly.com/incus/stable noble main' | sudo tee /etc/apt/sources.list.d/s4b2-static-incus.list >/dev/null
          sudo apt-get update -qq
          pkg="$(apt-cache madison incus | awk '/pkgs.zabbly.com/ && $3 ~ /:7[.]6[-.]/ {print $3; exit}')"
          test -n "$pkg"
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends "incus=$pkg" "incus-client=$pkg" "incus-base=$pkg" >/dev/null
          sudo systemctl start incus.service
          sudo incus admin init --auto --storage-backend=dir
          sudo incus version
          test -z "$(sudo incus list --all-projects --format csv -c n)"
          sudo incus network create b2lease0 ipv4.address=10.246.173.1/24 ipv4.nat=true ipv6.address=fd17:246::1/64 ipv6.nat=true ipv6.dhcp.stateful=true
          sudo incus profile create b2lease
          sudo incus profile device add b2lease root disk path=/ pool=default
          sudo incus profile device add b2lease eth0 nic name=eth0 network=b2lease0 security.ipv4_filtering=true security.ipv6_filtering=true security.mac_filtering=true
          echo "S4_B2_NATIVE_STATIC_BRIDGE_STATEFUL_IPV6_READY=PASS"
      - name: Static identity, simultaneous duplicate and post-delete reuse
        shell: bash
        run: |
          set -euo pipefail
          ip4=10.246.173.42
          ip6=fd17:246::42
          init_static() {
            sudo incus init images:ubuntu/24.04 "$1" -p b2lease -c limits.cpu=1 -c limits.memory=512MiB
            sudo incus config device override "$1" eth0 "ipv4.address=$ip4" "ipv6.address=$ip6"
          }
          guest4() { sudo incus exec "$1" -- sh -c "ip -4 -o addr show eth0 | awk '{print \$4}' | cut -d/ -f1" 2>/dev/null || :; }
          guest6() { sudo incus exec "$1" -- sh -c "ip -6 -o addr show eth0 scope global | awk '{print \$4}' | cut -d/ -f1" 2>/dev/null || :; }
          init_static b2old
          old_uuid="$(sudo incus config get b2old volatile.uuid)"
          test -n "$old_uuid"
          sudo incus start b2old
          b4=''; b6=''
          for i in $(seq 1 35); do
            b4="$(guest4 b2old)"; b6="$(guest6 b2old)"
            if [[ "$b4" = "$ip4" && "$b6" = "$ip6" ]]; then break; fi
            sleep 2
          done
          echo "S4_B2_NATIVE_STATIC_OLD_UUID=$old_uuid EXPECTED4=$ip4 OBSERVED4=$b4 EXPECTED6=$ip6 OBSERVED6=$b6"
          sudo incus network list-leases b2lease0 || :
          if [[ "$b4" = "$ip4" && "$b6" = "$ip6" ]]; then
            echo "S4_B2_NATIVE_STATIC_DUAL_STACK_GUEST_ASSIGNED=PASS"
          else
            echo "S4_B2_NATIVE_STATIC_DUAL_STACK_GUEST_ASSIGNED=PARTIAL_GUEST_CLIENT_OR_DHCP"
          fi
          sudo incus init images:ubuntu/24.04 b2duplicate -p b2lease -c limits.cpu=1 -c limits.memory=512MiB
          if sudo incus config device override b2duplicate eth0 "ipv4.address=$ip4" "ipv6.address=$ip6"; then
            echo "S4_B2_DUPLICATE_STATIC_CONFIGURATION=ACCEPTED"
            if sudo incus start b2duplicate; then
              echo "S4_B2_DUPLICATE_STATIC_SIMULTANEOUS_NATIVE_START=ACCEPTED_NOT_EXCLUSIVE"
              sudo incus stop b2duplicate
            else
              echo "S4_B2_DUPLICATE_STATIC_SIMULTANEOUS_NATIVE_START=REFUSED"
            fi
          else
            echo "S4_B2_DUPLICATE_STATIC_CONFIGURATION=REFUSED"
          fi
          sudo incus delete b2duplicate
          sudo incus stop b2old
          sudo incus delete b2old
          init_static b2replacement
          new_uuid="$(sudo incus config get b2replacement volatile.uuid)"
          test "$old_uuid" != "$new_uuid"
          sudo incus start b2replacement
          new4=''; new6=''
          for i in $(seq 1 30); do
            new4="$(guest4 b2replacement)"; new6="$(guest6 b2replacement)"
            if [[ "$new4" = "$ip4" && "$new6" = "$ip6" ]]; then break; fi
            sleep 2
          done
          echo "S4_B2_NATIVE_STATIC_REPLACEMENT_UUID=$new_uuid OBSERVED4=$new4 OBSERVED6=$new6"
          if [[ "$new4" = "$ip4" && "$new6" = "$ip6" ]]; then
            echo "S4_B2_NATIVE_STATIC_POST_DELETE_BOTH_IP_REUSED=OBSERVED"
          else
            echo "S4_B2_NATIVE_STATIC_POST_DELETE_REUSE=PARTIAL_GUEST_CLIENT_OR_DHCP"
          fi
          sudo incus network list-leases b2lease0 || :
          sudo incus stop b2replacement
          sudo incus delete b2replacement
          sudo incus profile delete b2lease
          sudo incus network delete b2lease0
          test -z "$(sudo incus list --all-projects --format csv -c n)"
          echo "S4_B2_NATIVE_STATIC_DISPOSABLE_CLEANUP=PASS"
