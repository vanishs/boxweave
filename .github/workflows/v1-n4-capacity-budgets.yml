name: N4 bounded 1024 SQLite and native-object model budget

on:
  push:
    branches: [feat/v1-network-reliability-20261122]
    paths:
      - internal/state/network_n4_capacity_perf_test.go
      - internal/state/network_native_inventory.go
      - internal/native/network_project_scan.go
      - internal/native/network_project_scan_test.go
      - .github/workflows/v1-n4-capacity-budgets.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bounded-inventory:
    if: github.repository == 'vanishs/boxweave' && github.ref == 'refs/heads/feat/v1-network-reliability-20261122'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Bound exact source and validate checked-in fixtures
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(gofmt -l internal/state/network_n4_capacity_perf_test.go)"
          git diff --check
          echo "N4_SOURCE_EXACT=$GITHUB_SHA"
      - name: Time complete 1024 SQLite network inventory and root ledger
        env:
          BOXWEAVE_N4_PERF_FIXTURE: n4-1024-local-only
        run: |
          set -euo pipefail
          go test -count=1 -v ./internal/state -run '^TestN4ProjectCapacityAndNetworkAudit1024LocalBudget$'
          echo N4_1024_SQLITE_AND_PEER_ROOT_LEDGER_BUDGET=PASS
      - name: Refuse 1025 native objects and unstable native witnesses
        run: |
          set -euo pipefail
          go test -count=1 -v ./internal/native -run '^Test(N3NativeProject1024ObjectsAnd1025FailureNoPartial|N3NativeSnapshotFullNetworkLeaseRaceIsFailClosed)$'
          echo N4_1024_NATIVE_MODEL_BOUND_ONLY=PASS
      - name: Static checks for Project inventory
        run: go vet ./internal/state ./internal/native
