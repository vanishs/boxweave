name: S5B1 exact frozen installed SDK and retirement (non-release)

on:
  push:
    branches:
      - feat/v1-s5b-acceptance-20261120
    paths:
      - '.github/workflows/v1-s5b1-frozen-installed.yml'
      - 'scripts/s5b1_installed_closeout.sh'
      - 'scripts/s25_bridgehead_lab.sh'
      - 'scripts/s3_file_installed_probe.go'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-installed:
    if: github.repository == 'vanishs/boxweave' && github.ref == 'refs/heads/feat/v1-s5b-acceptance-20261120'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        mode: [sdk, retirement, metadata]
    env:
      RUNNER_ENVIRONMENT: github-hosted
      PYTHONDONTWRITEBYTECODE: '1'
      S5B1_MODE: ${{ matrix.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: a3e02b4750edcabb80427e3311a19614d82b0029
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: s5b1-test-harness
          ref: ${{ github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Require frozen product and only overlay reviewed test scripts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = a3e02b4750edcabb80427e3311a19614d82b0029
          test "$(git rev-parse HEAD^{tree})" = 19f4548315c497f611bd83d5537bf6ec5d63e9d1
          git diff --no-index --exit-code cmd s5b1-test-harness/cmd
          git diff --no-index --exit-code internal s5b1-test-harness/internal
          cmp go.mod s5b1-test-harness/go.mod
          cmp go.sum s5b1-test-harness/go.sum
          cmp install.sh s5b1-test-harness/install.sh
          cmp uninstall.sh s5b1-test-harness/uninstall.sh
          cmp scripts/uninstall_core.py s5b1-test-harness/scripts/uninstall_core.py
          cp s5b1-test-harness/scripts/s25_bridgehead_lab.sh scripts/s25_bridgehead_lab.sh
          cp s5b1-test-harness/scripts/s5b1_installed_closeout.sh scripts/s5b1_installed_closeout.sh
          cp s5b1-test-harness/scripts/s3_file_installed_probe.go scripts/s3_file_installed_probe.go
          sh -n scripts/s25_bridgehead_lab.sh
          sh -n scripts/s5b1_installed_closeout.sh
      - name: Installed frozen native fixture and exact scoped proof
        shell: bash
        run: |
          set -euo pipefail
          sh scripts/s25_bridgehead_lab.sh | tee "$RUNNER_TEMP/s5b1-result.log"
          grep -Fxq 'S5B1_CLI_GUARDED_ACTUAL_SUBSET=PASS' "$RUNNER_TEMP/s5b1-result.log"
          if test "$S5B1_MODE" = sdk; then
            grep -Fxq 'S5B1_EXACT_23_SCHEMA_CACHE_TYPED_TEXT_AND_REFUSALS=PASS' "$RUNNER_TEMP/s5b1-result.log"
            grep -q '^S5B1_EXACT_READINESS_RECOVERY_ACTIVITY_FORWARD=PASS ' "$RUNNER_TEMP/s5b1-result.log"
            grep -Fxq 'S5B1_EXACT_INSTALLED_OLD_NEW_SDK_SCOPED=PASS' "$RUNNER_TEMP/s5b1-result.log"
          elif test "$S5B1_MODE" = metadata; then
            grep -Fxq 'S5B2_READY_TIMEOUT_DELAY_RESTART_NATIVE_DETAIL_ARCHIVE=PASS' "$RUNNER_TEMP/s5b1-result.log"
          else
            grep -Fxq 'S5B1_ACTUAL_GUIDED_FULL_RETIREMENT_ARCHIVE_AND_INCUS_PRESERVED=PASS' "$RUNNER_TEMP/s5b1-result.log"
          fi
