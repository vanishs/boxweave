name: v1 N2 clean installed retirement lifecycle
on:
  pull_request:
    branches: [v1]
    paths:
      - internal/install/**
      - internal/diagnostic/**
      - internal/state/diagnostic_snapshot*.go
      - cmd/boxweave/doctor*.go
      - cmd/boxweave/recover_plan*.go
      - cmd/boxweave/recover_apply*.go
      - internal/state/reviewed_*.go
      - internal/state/diagnostic_ledger.go
      - scripts/pr177_d4_installed_recovery.py
      - scripts/pr188_h1a_observe.py
      - scripts/pr188_h1b_plan.py
      - scripts/pr188_h2b_offline.py
      - scripts/pr188_h2c_purge.py
      - scripts/test_offline_retirement.py
      - internal/state/maintenance_offline*.go
      - scripts/test_maintenance_preview.py
      - internal/state/maintenance_observe*.go
      - cmd/boxweave/maintenance_doctor.go
      - internal/state/diagnostic_recovery*.go
      - internal/recovery/**
      - internal/state/network_ipv4*.go
      - internal/control/ipv4_retirement*.go
      - internal/control/peer_tools.go
      - internal/control/operation_recover.go
      - internal/state/network_peer*.go
      - internal/state/operation_recover.go
      - internal/recovery/service.go
      - install.sh
      - scripts/pr188_h3a_oauth.py
      - scripts/pr188_h3b_installed.py
      - scripts/pr188_h4a_installed.py
      - scripts/pr188_h4b_installed.py
      - scripts/test_scoped_drain.py
      - scripts/test_lxc_empty_retirement.py
      - cmd/boxweave/scoped_drain.go
      - cmd/boxweave/maintenance_readiness.go
      - scripts/test_uninstall_core.py
      - internal/control/server.go
      - internal/control/tool_failure.go
      - internal/control/operation_diagnostic.go
      - internal/state/scoped_identity_capacity.go
      - internal/state/project_capacity.go
      - internal/state/network_scoped*.go
      - internal/native/peer_static_binding*.go
      - internal/networklimits/**
      - internal/state/oauth.go
      - scripts/uninstall_core.py
      - scripts/n2_installed_lifecycle.*
      - scripts/pr178_n2_scoped_lifecycle.py
      - scripts/pr191_scoped_lifecycle_recovery.py
      - scripts/s2_p1_bound_create_receipt_fault_probe.go
      - scripts/test_pr191_scoped_create_rollback.py
      - scripts/pr191_scoped_ack_loss.py
      - scripts/pr191_scoped_s2_native.sh
      - scripts/pr191_scoped_s2_retention.sh
      - scripts/pr191_scoped_s2_quota.sh
      - scripts/pr191_scoped_noquota_lab.sh
      - scripts/pr191_scoped_s2_direct_quota.sh
      - scripts/s2_native_guest_quota_witness.sh
      - scripts/s2_native_guest_quota_probe.go
      - scripts/pr191_scoped_auth_races.sh
      - scripts/pr191_scoped_private_reads.py
      - scripts/pr191_scoped_auth_poll_oracle.py
      - scripts/test_pr191_scoped_auth_poll_oracle.py
      - scripts/s2_p1_token_inflight_probe.go
      - scripts/s2_p1_operation_list_boundary.sh
      - scripts/s2_p1_operation_list_boundary_probe.go
      - scripts/s2_p1_private_read_inflight_probe.go
      - scripts/s2_p1_private_read_delay_proxy.go
      - scripts/s2_ext4_quota_pool_lab.sh
      - scripts/s2_mcp_quota_witness.sh
      - scripts/test_pr191_scoped_quota.py
      - scripts/pr191_scoped_update_transport.py
      - scripts/s2_ack_loss_proxy.go
      - scripts/s2_ack_loss_probe.go
      - scripts/s2_sqlite_enospc_lab.sh
      - scripts/s2_sqlite_fsync_probe.go
      - scripts/s2_exec_gc_probe.go
      - scripts/s2_exec_gc_installed_review.sh
      - scripts/s2_gc_delete_proxy.go
      - scripts/s2_mcp_quota_probe.go
      - scripts/pr191_scoped_s2_native.py
      - scripts/pr191_scoped_schema_refusal.py
      - scripts/test_pr191_scoped_schema_refusal.py
      - scripts/test_pr191_scoped_s2_native.py
      - scripts/s2_queued_cancel_seed.go
      - scripts/s2_p1_simulated_wan_lab.sh
      - scripts/s2_p1_simulated_wan_server.py
      - scripts/test_pr191_scoped_update_ack.py
      - scripts/pr191_scoped_update_ack_wal.py
      - scripts/test_pr191_scoped_update_ack_wal.py
      - scripts/s2_p0_native_sqlite_probe.go
      - scripts/s2_p0_native_sqlite_proxy.go
      - scripts/pr191_scoped_wal_cut.*
      - scripts/test_pr191_scoped_wal_cut.py
      - scripts/test_pr191_scoped_exec_wal_oracle.py
      - scripts/pr191_scoped_exec_crash.py
      - scripts/pr191_scoped_overlap.py
      - scripts/test_pr191_scoped_overlap.py
      - scripts/s2_p1_build_overlap_overlay.py
      - scripts/s2_p1_native_create_delete_overlap_probe.go
      - scripts/pr191_scoped_stop_ack.py
      - scripts/test_pr191_scoped_stop_ack.py
      - scripts/s2_p1_stop_delete_probe.go
      - scripts/s2_p1_stop_delete_proxy.go
      - scripts/pr191_scoped_malformed_exec.py
      - scripts/test_pr191_scoped_malformed_exec.py
      - scripts/s2_p2_malformed_exec_probe.go
      - scripts/s2_p2_malformed_exec_proxy.go
      - scripts/s2_crash_probe.go
      - scripts/s2_legacy_sdk_probe.go
      - scripts/s2_native_probe.go
      - scripts/pr191_scoped_sdk_compat.py
      - scripts/test_pr191_scoped_sdk_compat.py
      - scripts/pr182_scoped_retirement.py
      - scripts/pr188_scoped_roundtrip.py
      - scripts/test_scoped_roundtrip.py
      - scripts/pr178_n3_scoped_peer.py
      - scripts/pr178_n4_*.py
      - .github/workflows/v1-n2-installed-lifecycle.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  installed-lifecycle:
    if: github.repository == 'vanishs/boxweave' && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || github.ref == 'refs/heads/feat/v1-network-reliability-20261122')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mode: [legacy, scoped, scoped-retirement, legacy-offline, scoped-create-ack, scoped-delete-ack, scoped-update-ack, scoped-update-ack-receipt, scoped-create-wal-before, scoped-create-wal-after, scoped-delete-wal-before, scoped-delete-wal-after, scoped-exec-wal-before, scoped-exec-wal-after, scoped-update-ack-wal-before, scoped-update-ack-wal-after, scoped-exec-crash, scoped-sdk-compat, scoped-s2-native, scoped-exec-retention, scoped-update-transport, scoped-physical-quota, scoped-auth-races, scoped-noquota, scoped-malformed-exec, scoped-stop-ack, scoped-overlap]
    env:
      RUNNER_ENVIRONMENT: github-hosted
      PR178_SCOPED_N2: ${{ startsWith(matrix.mode, 'scoped') && '1' || '0' }}
      PR188_OFFLINE_RETIREMENT: ${{ matrix.mode == 'legacy-offline' && '1' || '0' }}
      PR182_SCOPED_RETIREMENT: ${{ matrix.mode == 'scoped-retirement' && '1' || '0' }}
      P1B_ACK_CUT: ${{ matrix.mode == 'scoped-create-ack' && 'create' || matrix.mode == 'scoped-delete-ack' && 'delete' || matrix.mode == 'scoped-update-ack' && 'update' || matrix.mode == 'scoped-update-ack-receipt' && 'update-receipt' || '' }}
      P1B_UPDATE_ACK_WAL: ${{ matrix.mode == 'scoped-update-ack-wal-before' && 'before' || matrix.mode == 'scoped-update-ack-wal-after' && 'after' || '' }}
      P1B_WAL_CUT: ${{ matrix.mode == 'scoped-create-wal-before' && 'create-before' || matrix.mode == 'scoped-create-wal-after' && 'create-after' || matrix.mode == 'scoped-delete-wal-before' && 'delete-before' || matrix.mode == 'scoped-delete-wal-after' && 'delete-after' || matrix.mode == 'scoped-exec-wal-before' && 'exec-before' || matrix.mode == 'scoped-exec-wal-after' && 'exec-after' || '' }}
      P1B_S2_EXEC_CRASH: ${{ matrix.mode == 'scoped-exec-crash' && '1' || '0' }}
      P1B_S2_OVERLAP: ${{ matrix.mode == 'scoped-overlap' && '1' || '0' }}
      P1B_S2_STOP_ACK: ${{ matrix.mode == 'scoped-stop-ack' && '1' || '0' }}
      P1B_S2_MALFORMED_EXEC: ${{ matrix.mode == 'scoped-malformed-exec' && '1' || '0' }}
      P1B_S2_AUTH_RACES: ${{ matrix.mode == 'scoped-auth-races' && '1' || '0' }}
      P1B_S2_PHYSICAL_QUOTA: ${{ matrix.mode == 'scoped-physical-quota' && '1' || '0' }}
      P1B_S2_NOQUOTA: ${{ matrix.mode == 'scoped-noquota' && '1' || '0' }}
      P1B_S2_UPDATE_TRANSPORT: ${{ matrix.mode == 'scoped-update-transport' && '1' || '0' }}
      P1B_S2_RETENTION: ${{ matrix.mode == 'scoped-exec-retention' && '1' || '0' }}
      P1B_S2_NATIVE: ${{ matrix.mode == 'scoped-s2-native' && '1' || '0' }}
      P1B_S2_OLD_SDK: ${{ matrix.mode == 'scoped-sdk-compat' && '1' || '0' }}
      N2_EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Exact-head native bootstrap, install, outage, compatible upgrade, rollback and uninstall
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$N2_EXACT_HEAD"
          echo "H5_INSTALLED_SOURCE=$N2_EXACT_HEAD mode=${{ matrix.mode }}"
          sh -n scripts/n2_installed_lifecycle.sh
          sh scripts/n2_installed_lifecycle.sh | tee "$RUNNER_TEMP/n2-installed.log"
          for marker in WRAPPER REAL_OAUTH_RESUME INSTALLED_NO_EFFECT; do
            grep -Fxq "PR188_H3A_${marker}=PASS" "$RUNNER_TEMP/n2-installed.log"
          done
          grep -Fq 'N2_CLEAN_BOOTSTRAP_ADDRESS_POOL=PASS ' "$RUNNER_TEMP/n2-installed.log"
          grep -Fxq PR177_D3_INSTALLED_ABSENT_ISSUE_NO_EFFECT=PASS "$RUNNER_TEMP/n2-installed.log"
          grep -Fxq PR177_D2_INSTALLED_EMPTY_DIAGNOSTIC_COVERAGE=PASS "$RUNNER_TEMP/n2-installed.log"
          grep -Fxq PR177_D1_INSTALLED_MODE_AND_AUTHORITY=PASS "$RUNNER_TEMP/n2-installed.log"
          grep -Fxq PR177_D1_INSTALLED_NO_SERVICE_RESTART=PASS "$RUNNER_TEMP/n2-installed.log"
          grep -Fxq PR188_H3B_INSTALLED_DIAGNOSTIC=PASS "$RUNNER_TEMP/n2-installed.log"
          grep -Fxq PR188_H4A_INSTALLED_PREFLIGHT=PASS "$RUNNER_TEMP/n2-installed.log"
          grep -Fxq PR188_H4B_INSTALLED_CAPACITY_PARITY=PASS "$RUNNER_TEMP/n2-installed.log"
          grep -Fxq PR188_H1A_ACTIVE_EMPTY=PASS "$RUNNER_TEMP/n2-installed.log"
          grep -Fxq PR188_H1A_OFFLINE_EMPTY=PASS "$RUNNER_TEMP/n2-installed.log"
          for marker in ACTIVE_EMPTY OFFLINE_EMPTY UNTRUSTED_OBSERVER_NONROOT UNSAFE_STATE_STALE NEGATIVE_NO_EFFECT; do
            grep -Fxq "PR188_H1B_$marker=PASS" "$RUNNER_TEMP/n2-installed.log"
          done
          if test "$P1B_S2_AUTH_RACES" = 1; then
            grep -Fxq PR178_N2_INSTALL=PASS "$RUNNER_TEMP/n2-installed.log"
            grep -Fxq PR178_N2_FRESH_ONLY=PASS "$RUNNER_TEMP/n2-installed.log"
            for marker in S2_P1_REAL_INSTALLED_OPERATION_LIST_INFLIGHT_REVOCATION_AND_EXPIRY_NO_LEAK S4_A_OPERATION_LIST_COMPILED_CALL_TWO_INDEPENDENT_AUTH_CUTS S2_P1_FOUR_REAL_MCP_NATIVE_PRIVATE_READ_BEARER_REVOKE_NO_LEAK S2_P1_FOUR_REAL_MCP_NATIVE_PRIVATE_READ_BEARER_EXPIRY_NO_LEAK S2_P2_STALLED_NATIVE_OUTPUT_CANCEL_NO_NATIVE_CHANGE P1B_SCOPED_AUTH_FIXED_LEDGER_NATIVE_ABSENCE; do
              grep -Fxq "$marker=PASS" "$RUNNER_TEMP/n2-installed.log"
            done
            test "$(grep -c '^P1B_SCOPED_LIST_AUTH_ORIGINAL ' "$RUNNER_TEMP/n2-installed.log")" = 2
            test "$(grep -c '^P1B_SCOPED_PRIVATE_READ_ORIGINAL ' "$RUNNER_TEMP/n2-installed.log")" = 1
            test "$(grep -c '^P1B_SCOPED_GET_AUTH_ORIGINAL ' "$RUNNER_TEMP/n2-installed.log")" = 2
            for marker in S2_P1_INSTALLED_MCP_REVOKED_DURING_READ_NO_LEAK S2_P1_INSTALLED_MCP_EXPIRED_DURING_READ_NO_LEAK S2_P1_REAL_INSTALLED_MCP_STATUS_CHANGED_DURING_SIGNED_CURSOR P1B_SCOPED_CURSOR_EXACT_FIVE_ORIGINALS P1B_SCOPED_AUTH_POLL_CURSOR_FIXED_LEDGER_NO_NATIVE_EFFECT; do
              grep -Fxq "$marker=PASS" "$RUNNER_TEMP/n2-installed.log"
            done
            grep -Fxq P1B_SCOPED_PRIVATE_READ_SEED_IDLE=PASS "$RUNNER_TEMP/n2-installed.log"
            grep -Fxq S2_P2_REAL_NATIVE_RECORDED_STDOUT_STALLED_CLIENT_DISCONNECT_RECOVER=PASS "$RUNNER_TEMP/n2-installed.log"
            for auth in REVOKED EXPIRED; do
              for method in HOST_STATUS BOX_LIST BOX_GET OPERATION_OUTPUT_GET; do
                grep -Fxq "S2_P1_PRIVATE_READ_${auth}_AFTER_REAL_NATIVE_HTTP_200_${method}=PASS" "$RUNNER_TEMP/n2-installed.log"
              done
            done
            exit 0
          fi
          if test "$P1B_S2_NOQUOTA" = 1; then
            grep -Fxq PR178_N2_INSTALL=PASS "$RUNNER_TEMP/n2-installed.log"
            grep -Fxq PR178_N2_FRESH_ONLY=PASS "$RUNNER_TEMP/n2-installed.log"
            for marker in P1B_SCOPED_NOQUOTA_SEPARATE_EXT4_NO_PROJECT_QUOTA P1B_SCOPED_NOQUOTA_INSTALLED_ROOT_AND_RESTRICTED_WARNING P1B_SCOPED_NOQUOTA_INSTALLED_LIFECYCLE_NATIVE_ABSENCE; do
              grep -Fxq "$marker=PASS" "$RUNNER_TEMP/n2-installed.log"
            done
            exit 0
          fi
          if test "$P1B_S2_PHYSICAL_QUOTA" = 1; then
            grep -Fxq PR178_N2_INSTALL=PASS "$RUNNER_TEMP/n2-installed.log"
            grep -Fxq PR178_N2_FRESH_ONLY=PASS "$RUNNER_TEMP/n2-installed.log"
            for marker in S2_NATIVE_EXT4_PROJECT_QUOTA_BACKING_CONFIGURED S2_MCP_QUOTA_NEAR_LIMIT_SAFE_MOUNT S2_MCP_REAL_GUEST_QUOTA_ORIGINAL_RECEIPT_OUTPUT_EXIT_ONE S2_MCP_EXACT_ORIGINAL_NATIVE_LOG_MISSING_ARCHIVE_PREFIX S2_MCP_NATIVE_OUTPUT_404_TYPED_WITHOUT_FALSE_EXPIRY P1B_SCOPED_QUOTA_FIXED_LEDGER_AND_NATIVE_ABSENCE P1B_SCOPED_DIRECT_QUOTA_OWNERSHIP_PINNED S2_NATIVE_REAL_GUEST_RECORDED_EXEC_QUOTA_PARTIAL_OUTPUT P1B_SCOPED_DIRECT_NATIVE_NO_SYNTHETIC_MCP_RECEIPTS P1B_SCOPED_DIRECT_QUOTA_FIXED_LEDGER_AND_NATIVE_ABSENCE P1B_SCOPED_INDEPENDENT_EDQUOT_REAL_KERNEL_REFUSAL S2_NATIVE_GUEST_QUOTA_SPACE_RECOVERED_AND_FIXTURE_REMOVED; do
              grep -Fxq "$marker=PASS" "$RUNNER_TEMP/n2-installed.log"
            done
            exit 0
          fi
          if test "$P1B_S2_UPDATE_TRANSPORT" = 1; then
            grep -Eq '^P1B_SCOPED_LEGACY_UNKNOWN_RELEASE_REFUSED_ORIGINAL_RETAINED=PASS [a-f0-9]{32} [a-f0-9-]{36}$' "$RUNNER_TEMP/n2-installed.log"
            grep -Fxq PR178_N2_INSTALL=PASS "$RUNNER_TEMP/n2-installed.log"
            grep -Fxq PR178_N2_FRESH_ONLY=PASS "$RUNNER_TEMP/n2-installed.log"
            for mode in etag ack postread; do
              grep -Fxq "P1B_SCOPED_UPDATE_TRANSPORT=PASS $mode" "$RUNNER_TEMP/n2-installed.log"
              test "$(grep -c "^P1B_SCOPED_UPDATE_TRANSPORT_SDK_ORIGINAL $mode " "$RUNNER_TEMP/n2-installed.log")" = 2
            done
            exit 0
          fi
          if test "$P1B_S2_RETENTION" = 1; then
            grep -Fxq PR178_N2_INSTALL=PASS "$RUNNER_TEMP/n2-installed.log"
            grep -Fxq PR178_N2_FRESH_ONLY=PASS "$RUNNER_TEMP/n2-installed.log"
            for marker in S2_SQLITE_ACTUAL_ISOLATED_EXT4_ENOSPC_RECOVERY_UNKNOWN_NO_REPLAY S2_GC_NATIVE_7D_TWO_STREAMS_DELETE_AUDIT_404_NO_REPLAY S2_GC_PUBLIC_ORIGINAL_TWO_STREAMS_EXPIRED S2_GC_REAL_NATIVE_DELETE_ACK_LOSS_REVIEW_REQUIRED_SIBLING_LOCKED P1B_SCOPED_GC_INSTALLED_ROOT_RECOVER_CYCLE S2_GC_PUBLIC_LOST_ACK_TTL_ELAPSED_NOT_PHYSICAL_EXPIRY P1B_SCOPED_GC_FIXED_LEDGER_NATIVE_ABSENCE; do
              grep -Fxq "$marker=PASS" "$RUNNER_TEMP/n2-installed.log"
            done
            exit 0
          fi
          if test "$P1B_S2_NATIVE" = 1; then
            for layout in foreign corrupt old ambiguous versioned-foreign; do
              grep -Fxq "P1B_SCOPED_SCHEMA_REFUSED=PASS $layout" "$RUNNER_TEMP/n2-installed.log"
            done
            grep -Fxq P1B_SCOPED_PUBLIC_IPV4_TLS_ORIGINAL_EVIDENCE=PASS "$RUNNER_TEMP/n2-installed.log"
            grep -Exq 'P1B_SCOPED_PUBLIC_IPV4_TLS_INDEPENDENT=(PASS|UNVERIFIED)' "$RUNNER_TEMP/n2-installed.log"
            grep -Fxq PR178_N2_INSTALL=PASS "$RUNNER_TEMP/n2-installed.log"
            grep -Fxq PR178_N2_FRESH_ONLY=PASS "$RUNNER_TEMP/n2-installed.log"
            for marker in S2_NATIVE_SQLITE_FOREIGN_CORRUPT_FAIL_CLOSED S2_NATIVE_SQLITE_OLD_MULTIPLE_VERSION_AND_FOREIGN_TABLES_DENIED P1B_SCOPED_SCHEMA_FIXED_INSTALLED_NO_EFFECT P1B_SCOPED_S2_NATIVE_PROBE P1B_SCOPED_S2_FIXED_LEDGER P1B_SCOPED_S2_NATIVE_FOREIGN_UNCHANGED P1B_SCOPED_S2_FOREIGN_UUID_READ_DENIED P1B_SCOPED_S2_REDACTION S2_NATIVE_REAL_SQLITE_HISTORY_WRITER_DURING_MCP_PAGE P1B_SCOPED_RESERVED_WAN_TLS_ON_DENIED P1B_SCOPED_RESERVED_WAN_TLS_OFF_ON_DENIED P1B_SCOPED_RESERVED_WAN_INDEPENDENT_ZERO_HITS S2_P1_SIMULATED_WAN_HTTPS_OFFLINE_DENIED S2_NATIVE_PACKET_INTERNET_TOGGLE_IPV4_IPV6_GATEWAY_EGRESS S2_NATIVE_PACKET_INTERNET_ON_DOES_NOT_UNBLOCK_PEERS; do
              grep -Fxq "$marker=PASS" "$RUNNER_TEMP/n2-installed.log"
            done
            grep -Eq '^P1B_SCOPED_S2_PHYSICAL_SPOOL=(PASS|UNVERIFIED)$' "$RUNNER_TEMP/n2-installed.log"
            exit 0
          fi
          if test "$P1B_S2_OLD_SDK" = 1; then
            grep -Fxq PR178_N2_INSTALL=PASS "$RUNNER_TEMP/n2-installed.log"
            grep -Fxq PR178_N2_FRESH_ONLY=PASS "$RUNNER_TEMP/n2-installed.log"
            for marker in P1B_SCOPED_OLD_SDK_PINNED_1_6_1 S2_P1_PREVIOUS_OFFICIAL_MCP_SDK_LEGACY_PROTOCOL_16_TOOLS_NO_NATIVE_EFFECT S4_B4_PREVIOUS_OFFICIAL_SDK_23_TOOLS_DISCOVERY S2_P1_PREVIOUS_OFFICIAL_MCP_SDK_NATIVE_CREATE_UPDATE_EXEC_DELETE P1B_SCOPED_OLD_SDK_FIXED_LEDGER_NATIVE_ABSENCE; do
              grep -Fxq "$marker=PASS" "$RUNNER_TEMP/n2-installed.log"
            done
            test "$(grep -c '^P1B_SCOPED_OLD_SDK_ORIGINAL ' "$RUNNER_TEMP/n2-installed.log")" = 6
            for marker in MCP_DISCOVERY_23_OF_23 MCP_TOOL_ANNOTATIONS_ACTUALLY_ADVERTISED EXEC_RECONNECT_EXIT_7_STDOUT_STDERR NOISY_EXEC_PAGINATION_70K DUAL_STREAM_16M_OUTPUT_READ_BUDGET DELAYED_EXEC_TIMEOUT_BUDGET QUIET_EXEC_RECORDED_ZERO_EXIT CANCELLED_LONG_POLL_IS_READ_ONLY EXEC_UNSUPPORTED_CANCEL_TRUTHFUL; do
              grep -Fxq "S2_NATIVE_$marker=PASS" "$RUNNER_TEMP/n2-installed.log"
            done
            grep -Fxq S2_P2_REAL_CONTINUOUS_STDOUT_GUEST_TIMEOUT_NOT_MCP_CANCELLATION=PASS "$RUNNER_TEMP/n2-installed.log"
            grep -Fq 'P1B_SCOPED_CURRENT_SDK_OUTPUT_SUBSET=PASS ' "$RUNNER_TEMP/n2-installed.log"
            grep -Fxq P1B_SCOPED_CURRENT_SDK_OUTPUT_FIXED_LEDGER=PASS "$RUNNER_TEMP/n2-installed.log"
            test "$(grep -c '^P1B_SCOPED_CURRENT_SDK_ORIGINAL ' "$RUNNER_TEMP/n2-installed.log")" = 10
            exit 0
          fi
          if test "$P1B_S2_MALFORMED_EXEC" = 1; then
            for marker in PR178_N2_INSTALL PR178_N2_FRESH_ONLY S2_P2_MALFORMED_NATIVE_EXEC_OWNED_RUNNING_SEEDED S2_P2_GUEST_REAL_EXEC_READY_POSITIVE_CONTROL S2_P2_GUEST_ROOT_WITNESS_STABLE_ACROSS_SEPARATE_EXEC S2_P2_REAL_INCUS_MALFORMED_FINAL_EXEC_RETURN_UNKNOWN_NO_RETRY S2_P2_REAL_GUEST_MUTATION_EXACTLY_ONCE_AFTER_MALFORMED_RESPONSE S2_P2_REAL_MALFORMED_EXEC_SAME_SQLITE_RESTART_NO_REDISPATCH P1B_SCOPED_MALFORMED_EXEC_FIXED_LEDGER_RESTART_RETAINED_UNKNOWN; do
              grep -Fxq "$marker=PASS" "$RUNNER_TEMP/n2-installed.log"
            done
            grep -Eq '^P1B_SCOPED_MALFORMED_EXEC_ORIGINAL [0-9a-f]{32} [0-9a-f-]{36} [0-9a-f]{32} [0-9a-f-]{36}$' "$RUNNER_TEMP/n2-installed.log"
            exit 0
          fi
          if test "$P1B_S2_OVERLAP" = 1; then
            for marker in PR178_N2_INSTALL PR178_N2_FRESH_ONLY S4_A_OVERLAY_PREATOMIC_EXACT_SINGLE_INSERTION S2_P1_NATIVE_OVERLAY_TEST_ONLY_SERVICE_MCP_AUTH_READY S4_A_NATIVE_UUID_PREATOMIC_INDEPENDENT_INCUS_CONFIRM S4_A_REAL_NATIVE_PREATOMIC_TWELVE_SDK_DELETE_REFUSED S4_A_REAL_NATIVE_OVERLAP_ATOMIC_CREATE_DELETE_TOMBSTONE S4_A_REAL_NATIVE_PREATOMIC_CONCURRENT_DELETE_FULL_LIFECYCLE P1B_SCOPED_PREATOMIC_OVERLAP_FIXED_LEDGER; do
              grep -Fxq "$marker=PASS" "$RUNNER_TEMP/n2-installed.log"
            done
