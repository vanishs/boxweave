name: v1 N2 clean installed retirement lifecycle
on:
  push:
    branches: ["release/v1.*-rc.*"]
  pull_request:
    branches: [v1]
    # Cover the complete installed-runtime and fixture dependency families,
    # rather than maintaining a growing list of individual cutover leaves.
    # Documentation-only paths remain excluded; every former path is covered.
    paths:
      - '.github/workflows/v1-release.yml'
      - '.github/workflows/v1-pr191-s25-scoped.yml'
      - 'internal/**'
      - 'cmd/**'
      - 'scripts/**'
      - 'install.sh'
      - 'uninstall.sh'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - '.github/workflows/v1-s2-native.yml'
      - '.github/workflows/v1-n2-installed-lifecycle.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  installed-lifecycle:
    if: github.repository == 'vanishs/boxweave' && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || github.ref == 'refs/heads/feat/v1-network-reliability-20261122' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/v1.')))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mode: [scoped, scoped-retirement, scoped-offline-empty, scoped-offline-settled, scoped-offline-original, scoped-create-ack, scoped-delete-ack, scoped-update-ack, scoped-update-ack-receipt, scoped-create-wal-before, scoped-create-wal-after, scoped-delete-wal-before, scoped-delete-wal-after, scoped-exec-wal-before, scoped-exec-wal-after, scoped-update-ack-wal-before, scoped-update-ack-wal-after, scoped-exec-crash, scoped-sdk-compat, scoped-s2-native, scoped-exec-retention, scoped-update-transport, scoped-physical-quota, scoped-auth-races, scoped-noquota, scoped-malformed-exec, scoped-stop-ack, scoped-overlap, scoped-altpool]
    env:
      RUNNER_ENVIRONMENT: github-hosted
      PR178_SCOPED_N2: '1'
      P2_R3_OFFLINE: ${{ matrix.mode == 'scoped-offline-empty' && 'empty' || matrix.mode == 'scoped-offline-settled' && 'settled' || matrix.mode == 'scoped-offline-original' && 'original' || '' }}
      PR182_SCOPED_RETIREMENT: ${{ matrix.mode == 'scoped-retirement' && '1' || '0' }}
      P1B_ACK_CUT: ${{ matrix.mode == 'scoped-create-ack' && 'create' || matrix.mode == 'scoped-delete-ack' && 'delete' || matrix.mode == 'scoped-update-ack' && 'update' || matrix.mode == 'scoped-update-ack-receipt' && 'update-receipt' || '' }}
      P1B_UPDATE_ACK_WAL: ${{ matrix.mode == 'scoped-update-ack-wal-before' && 'before' || matrix.mode == 'scoped-update-ack-wal-after' && 'after' || '' }}
      P1B_WAL_CUT: ${{ matrix.mode == 'scoped-create-wal-before' && 'create-before' || matrix.mode == 'scoped-create-wal-after' && 'create-after' || matrix.mode == 'scoped-delete-wal-before' && 'delete-before' || matrix.mode == 'scoped-delete-wal-after' && 'delete-after' || matrix.mode == 'scoped-exec-wal-before' && 'exec-before' || matrix.mode == 'scoped-exec-wal-after' && 'exec-after' || '' }}
      P1B_S2_EXEC_CRASH: ${{ matrix.mode == 'scoped-exec-crash' && '1' || '0' }}
      P1B_S2_OVERLAP: ${{ matrix.mode == 'scoped-overlap' && '1' || '0' }}
      P1B_S2_STOP_ACK: ${{ matrix.mode == 'scoped-stop-ack' && '1' || '0' }}
      P1B_S2_MALFORMED_EXEC: ${{ matrix.mode == 'scoped-malformed-exec' && '1' || '0' }}
      P1B_S2_AUTH_RACES: ${{ matrix.mode == 'scoped-auth-races' && '1' || '0' }}
      P1B_S2_PHYSICAL_QUOTA: ${{ matrix.mode == 'scoped-physical-quota' && '1' || '0' }}
      P1B_S2_NOQUOTA: ${{ matrix.mode == 'scoped-noquota' && '1' || '0' }}
      P1B_S2_ALTPOOL: ${{ matrix.mode == 'scoped-altpool' && '1' || '0' }}
      P1B_S2_UPDATE_TRANSPORT: ${{ matrix.mode == 'scoped-update-transport' && '1' || '0' }}
      P1B_S2_RETENTION: ${{ matrix.mode == 'scoped-exec-retention' && '1' || '0' }}
      P1B_S2_NATIVE: ${{ matrix.mode == 'scoped-s2-native' && '1' || '0' }}
      P1B_S2_OLD_SDK: ${{ matrix.mode == 'scoped-sdk-compat' && '1' || '0' }}
      N2_EVIDENCE_LANE: ${{ matrix.mode }}
      N2_EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Require the exact protected v1 HEAD for a controlled RC producer
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/pr191_s2_ci_gate.py --release-version
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/v1" --jq .object.sha)" = "$GITHUB_SHA"
      - name: Exact-head native bootstrap, Scoped install, recovery and retirement
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$N2_EXACT_HEAD"
          echo "H5_INSTALLED_SOURCE=$N2_EXACT_HEAD mode=${{ matrix.mode }}"
          sh -n scripts/n2_installed_lifecycle.sh
          python3 scripts/test_pr191_n2_evidence_identity.py
          python3 scripts/test_pr191_s2_witness_map.py
          python3 scripts/test_pr191_ci_apt_sources.py
          sh scripts/n2_installed_lifecycle.sh | tee "$RUNNER_TEMP/n2-installed.log"
          python3 scripts/pr191_n2_evidence_identity.py "$RUNNER_TEMP/n2-installed.log" "$N2_EXACT_HEAD"
      - name: Require original installed lane assertions
        shell: bash
        run: bash scripts/pr191_n2_installed_gate.sh
      - name: Index mapped lane only after all original lane checks
        id: crosswalk
        shell: bash
        run: |
          set -euo pipefail
          case "$N2_EVIDENCE_LANE" in
            scoped-retirement|scoped-offline-empty|scoped-offline-settled|scoped-offline-original|scoped-update-ack|scoped-update-ack-receipt|scoped-noquota)
              echo "No historical S2 mapping; original full lane checks remain required"
              if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/release/* ]]; then
                python3 scripts/pr191_s2_ci_gate.py --release-n2-identity "$RUNNER_TEMP/n2-installed.log" "$RUNNER_TEMP/pr191-n2-identity.json"
                echo "release_identity=true" >> "$GITHUB_OUTPUT"
              fi
              exit 0
              ;;
          esac
          python3 scripts/pr191_s2_witness_map.py --log "$RUNNER_TEMP/n2-installed.log" --source "$N2_EXACT_HEAD" --lane "$N2_EVIDENCE_LANE" --ci-receipt "$RUNNER_TEMP/pr191-s2-lane.json"
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Retain sanitized release-only N2 candidate identity
        if: steps.crosswalk.outputs.release_identity == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pr191-n2-identity-${{ matrix.mode }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pr191-n2-identity.json
          retention-days: 7
          if-no-files-found: error
      - name: Retain sanitized lane locator
        if: steps.crosswalk.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pr191-s2-${{ matrix.mode }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pr191-s2-lane.json
          retention-days: 7
          if-no-files-found: error
