name: v1 N2 clean installed retirement lifecycle
on:
  pull_request:
    branches: [v1]
    paths:
      - internal/install/**
      - internal/diagnostic/**
      - internal/state/diagnostic_snapshot*.go
      - cmd/boxweave/doctor*.go
      - cmd/boxweave/recover_plan*.go
      - cmd/boxweave/recover_apply*.go
      - internal/state/reviewed_*.go
      - internal/state/diagnostic_ledger.go
      - scripts/pr177_d4_installed_recovery.py
      - scripts/pr188_h1a_observe.py
      - scripts/pr188_h1b_plan.py
      - scripts/pr188_h2b_offline.py
      - scripts/pr188_h2c_purge.py
      - scripts/test_offline_retirement.py
      - internal/state/maintenance_offline*.go
      - scripts/test_maintenance_preview.py
      - internal/state/maintenance_observe*.go
      - cmd/boxweave/maintenance_doctor.go
      - internal/state/diagnostic_recovery*.go
      - internal/recovery/**
      - internal/state/network_ipv4*.go
      - internal/control/ipv4_retirement*.go
      - internal/control/peer_tools.go
      - internal/control/operation_recover.go
      - internal/state/network_peer*.go
      - internal/state/operation_recover.go
      - internal/recovery/service.go
      - install.sh
      - scripts/pr188_h3a_oauth.py
      - scripts/pr188_h3b_installed.py
      - scripts/pr188_h4a_installed.py
      - scripts/pr188_h4b_installed.py
      - scripts/test_scoped_drain.py
      - scripts/test_lxc_empty_retirement.py
      - cmd/boxweave/scoped_drain.go
      - cmd/boxweave/maintenance_readiness.go
      - scripts/test_uninstall_core.py
      - internal/control/server.go
      - internal/control/tool_failure.go
      - internal/control/operation_diagnostic.go
      - internal/state/scoped_identity_capacity.go
      - internal/state/project_capacity.go
      - internal/state/network_scoped*.go
      - internal/native/peer_static_binding*.go
      - internal/networklimits/**
      - internal/state/oauth.go
      - scripts/uninstall_core.py
      - scripts/n2_installed_lifecycle.*
      - scripts/pr178_n2_scoped_lifecycle.py
      - scripts/pr191_scoped_lifecycle_recovery.py
      - scripts/pr191_scoped_ack_loss.py
      - scripts/pr191_scoped_s2_native.sh
      - scripts/pr191_scoped_s2_native.py
      - scripts/test_pr191_scoped_s2_native.py
      - scripts/s2_queued_cancel_seed.go
      - scripts/s2_p1_simulated_wan_lab.sh
      - scripts/s2_p1_simulated_wan_server.py
      - scripts/test_pr191_scoped_update_ack.py
      - scripts/pr191_scoped_wal_cut.*
      - scripts/test_pr191_scoped_wal_cut.py
      - scripts/test_pr191_scoped_exec_wal_oracle.py
      - scripts/pr191_scoped_exec_crash.py
      - scripts/s2_crash_probe.go
      - scripts/s2_legacy_sdk_probe.go
      - scripts/s2_native_probe.go
      - scripts/pr191_scoped_sdk_compat.py
      - scripts/test_pr191_scoped_sdk_compat.py
      - scripts/pr182_scoped_retirement.py
      - scripts/pr188_scoped_roundtrip.py
      - scripts/test_scoped_roundtrip.py
      - scripts/pr178_n3_scoped_peer.py
      - scripts/pr178_n4_*.py
      - .github/workflows/v1-n2-installed-lifecycle.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  installed-lifecycle:
    if: github.repository == 'vanishs/boxweave' && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || github.ref == 'refs/heads/feat/v1-network-reliability-20261122')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mode: [legacy, scoped, scoped-retirement, legacy-offline, scoped-create-ack, scoped-delete-ack, scoped-update-ack, scoped-update-ack-receipt, scoped-create-wal-before, scoped-create-wal-after, scoped-delete-wal-before, scoped-delete-wal-after, scoped-exec-wal-before, scoped-exec-wal-after, scoped-exec-crash, scoped-sdk-compat, scoped-s2-native]
    env:
      RUNNER_ENVIRONMENT: github-hosted
      PR178_SCOPED_N2: ${{ startsWith(matrix.mode, 'scoped') && '1' || '0' }}
      PR188_OFFLINE_RETIREMENT: ${{ matrix.mode == 'legacy-offline' && '1' || '0' }}
      PR182_SCOPED_RETIREMENT: ${{ matrix.mode == 'scoped-retirement' && '1' || '0' }}
      P1B_ACK_CUT: ${{ matrix.mode == 'scoped-create-ack' && 'create' || matrix.mode == 'scoped-delete-ack' && 'delete' || matrix.mode == 'scoped-update-ack' && 'update' || matrix.mode == 'scoped-update-ack-receipt' && 'update-receipt' || '' }}
      P1B_WAL_CUT: ${{ matrix.mode == 'scoped-create-wal-before' && 'create-before' || matrix.mode == 'scoped-create-wal-after' && 'create-after' || matrix.mode == 'scoped-delete-wal-before' && 'delete-before' || matrix.mode == 'scoped-delete-wal-after' && 'delete-after' || matrix.mode == 'scoped-exec-wal-before' && 'exec-before' || matrix.mode == 'scoped-exec-wal-after' && 'exec-after' || '' }}
      P1B_S2_EXEC_CRASH: ${{ matrix.mode == 'scoped-exec-crash' && '1' || '0' }}
      P1B_S2_NATIVE: ${{ matrix.mode == 'scoped-s2-native' && '1' || '0' }}
      P1B_S2_OLD_SDK: ${{ matrix.mode == 'scoped-sdk-compat' && '1' || '0' }}
      N2_EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Exact-head native bootstrap, install, outage, compatible upgrade, rollback and uninstall
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$N2_EXACT_HEAD"
          echo "H5_INSTALLED_SOURCE=$N2_EXACT_HEAD mode=${{ matrix.mode }}"
          sh -n scripts/n2_installed_lifecycle.sh
          sh scripts/n2_installed_lifecycle.sh | tee "$RUNNER_TEMP/n2-installed.log"
          for marker in WRAPPER REAL_OAUTH_RESUME INSTALLED_NO_EFFECT; do
            grep -Fxq "PR188_H3A_${marker}=PASS" "$RUNNER_TEMP/n2-installed.log"
          done
          grep -Fq 'N2_CLEAN_BOOTSTRAP_ADDRESS_POOL=PASS ' "$RUNNER_TEMP/n2-installed.log"
          grep -Fxq PR177_D3_INSTALLED_ABSENT_ISSUE_NO_EFFECT=PASS "$RUNNER_TEMP/n2-installed.log"
          grep -Fxq PR177_D2_INSTALLED_EMPTY_DIAGNOSTIC_COVERAGE=PASS "$RUNNER_TEMP/n2-installed.log"
          grep -Fxq PR177_D1_INSTALLED_MODE_AND_AUTHORITY=PASS "$RUNNER_TEMP/n2-installed.log"
          grep -Fxq PR177_D1_INSTALLED_NO_SERVICE_RESTART=PASS "$RUNNER_TEMP/n2-installed.log"
          grep -Fxq PR188_H3B_INSTALLED_DIAGNOSTIC=PASS "$RUNNER_TEMP/n2-installed.log"
          grep -Fxq PR188_H4A_INSTALLED_PREFLIGHT=PASS "$RUNNER_TEMP/n2-installed.log"
          grep -Fxq PR188_H4B_INSTALLED_CAPACITY_PARITY=PASS "$RUNNER_TEMP/n2-installed.log"
          grep -Fxq PR188_H1A_ACTIVE_EMPTY=PASS "$RUNNER_TEMP/n2-installed.log"
          grep -Fxq PR188_H1A_OFFLINE_EMPTY=PASS "$RUNNER_TEMP/n2-installed.log"
          for marker in ACTIVE_EMPTY OFFLINE_EMPTY UNTRUSTED_OBSERVER_NONROOT UNSAFE_STATE_STALE NEGATIVE_NO_EFFECT; do
            grep -Fxq "PR188_H1B_$marker=PASS" "$RUNNER_TEMP/n2-installed.log"
          done
          if test "$P1B_S2_NATIVE" = 1; then
            grep -Fxq PR178_N2_INSTALL=PASS "$RUNNER_TEMP/n2-installed.log"
            grep -Fxq PR178_N2_FRESH_ONLY=PASS "$RUNNER_TEMP/n2-installed.log"
            for marker in P1B_SCOPED_S2_NATIVE_PROBE P1B_SCOPED_S2_FIXED_LEDGER P1B_SCOPED_S2_NATIVE_FOREIGN_UNCHANGED P1B_SCOPED_S2_REDACTION S2_NATIVE_REAL_SQLITE_HISTORY_WRITER_DURING_MCP_PAGE S2_NATIVE_SIMULATED_WAN_SERVER_INDEPENDENT_ON_OFF_ON_TWO_HITS; do
              grep -Fxq "$marker=PASS" "$RUNNER_TEMP/n2-installed.log"
            done
            grep -Eq '^P1B_SCOPED_S2_PHYSICAL_SPOOL=(PASS|UNVERIFIED)$' "$RUNNER_TEMP/n2-installed.log"
            exit 0
          fi
          if test "$P1B_S2_OLD_SDK" = 1; then
            grep -Fxq PR178_N2_INSTALL=PASS "$RUNNER_TEMP/n2-installed.log"
            grep -Fxq PR178_N2_FRESH_ONLY=PASS "$RUNNER_TEMP/n2-installed.log"
            for marker in P1B_SCOPED_OLD_SDK_PINNED_1_6_1 S2_P1_PREVIOUS_OFFICIAL_MCP_SDK_LEGACY_PROTOCOL_16_TOOLS_NO_NATIVE_EFFECT S4_B4_PREVIOUS_OFFICIAL_SDK_23_TOOLS_DISCOVERY S2_P1_PREVIOUS_OFFICIAL_MCP_SDK_NATIVE_CREATE_UPDATE_EXEC_DELETE P1B_SCOPED_OLD_SDK_FIXED_LEDGER_NATIVE_ABSENCE; do
              grep -Fxq "$marker=PASS" "$RUNNER_TEMP/n2-installed.log"
            done
            test "$(grep -c '^P1B_SCOPED_OLD_SDK_ORIGINAL ' "$RUNNER_TEMP/n2-installed.log")" = 6
            for marker in MCP_DISCOVERY_23_OF_23 MCP_TOOL_ANNOTATIONS_ACTUALLY_ADVERTISED EXEC_RECONNECT_EXIT_7_STDOUT_STDERR NOISY_EXEC_PAGINATION_70K DUAL_STREAM_16M_OUTPUT_READ_BUDGET DELAYED_EXEC_TIMEOUT_BUDGET QUIET_EXEC_RECORDED_ZERO_EXIT CANCELLED_LONG_POLL_IS_READ_ONLY EXEC_UNSUPPORTED_CANCEL_TRUTHFUL; do
              grep -Fxq "S2_NATIVE_$marker=PASS" "$RUNNER_TEMP/n2-installed.log"
            done
            grep -Fxq S2_P2_REAL_CONTINUOUS_STDOUT_GUEST_TIMEOUT_NOT_MCP_CANCELLATION=PASS "$RUNNER_TEMP/n2-installed.log"
            grep -Fq 'P1B_SCOPED_CURRENT_SDK_OUTPUT_SUBSET=PASS ' "$RUNNER_TEMP/n2-installed.log"
            grep -Fxq P1B_SCOPED_CURRENT_SDK_OUTPUT_FIXED_LEDGER=PASS "$RUNNER_TEMP/n2-installed.log"
            test "$(grep -c '^P1B_SCOPED_CURRENT_SDK_ORIGINAL ' "$RUNNER_TEMP/n2-installed.log")" = 10
            exit 0
          fi
          if test "$P1B_S2_EXEC_CRASH" = 1; then
            grep -Fxq PR178_N2_INSTALL=PASS "$RUNNER_TEMP/n2-installed.log"
            grep -Fxq PR178_N2_FRESH_ONLY=PASS "$RUNNER_TEMP/n2-installed.log"
            for marker in CRASH_DISPATCHED_ORIGINAL_RECEIPT DUPLICATE_SERVE_DURING_REAL_EXEC_NO_RECOVERY COMPLETED_OUTPUT_AFTER_SQLITE_RESTART PROCESS_KILL_UNKNOWN_REPLAY_DENIED CRASH_ORIGINAL_GUEST_EFFECT_EXACTLY_ONCE; do
              grep -Fxq "S2_NATIVE_$marker=PASS" "$RUNNER_TEMP/n2-installed.log"
            done
            grep -Fq 'S2_NATIVE_EXACT_SERVICE_PROCESS_KILLED=PASS ' "$RUNNER_TEMP/n2-installed.log"
            grep -Fq 'P1B_SCOPED_S2_EXEC_CRASH=PASS ' "$RUNNER_TEMP/n2-installed.log"
            exit 0
          fi
          if test -n "$P1B_WAL_CUT"; then
            grep -Fxq PR178_N2_INSTALL=PASS "$RUNNER_TEMP/n2-installed.log"
            grep -Fxq PR178_N2_FRESH_ONLY=PASS "$RUNNER_TEMP/n2-installed.log"
            grep -Fq "P1B_SCOPED_WAL_EXACT_CONTROLLER_CUT=PASS $P1B_WAL_CUT " "$RUNNER_TEMP/n2-installed.log"
            grep -Fq "P1B_SCOPED_WAL_SQLITE_NATIVE_CROSSCHECK=PASS $P1B_WAL_CUT " "$RUNNER_TEMP/n2-installed.log"
            grep -Fxq "P1B_SCOPED_INSTALLED_WAL_CUT=PASS $P1B_WAL_CUT" "$RUNNER_TEMP/n2-installed.log"
            if test "$P1B_WAL_CUT" = exec-before; then
              grep -Eq '^P1B_SCOPED_EXEC_WAL_ATOMIC=PASS exec-before (SUCCEEDED|UNKNOWN) [a-f0-9]{32} ' "$RUNNER_TEMP/n2-installed.log"
            elif test "$P1B_WAL_CUT" = exec-after; then
              grep -Eq '^P1B_SCOPED_EXEC_WAL_ATOMIC=PASS exec-after SUCCEEDED [a-f0-9]{32} ' "$RUNNER_TEMP/n2-installed.log"
            fi
            exit 0
          fi
          if test -n "$P1B_ACK_CUT"; then
            grep -Fxq PR178_N2_INSTALL=PASS "$RUNNER_TEMP/n2-installed.log"
            grep -Fxq PR178_N2_FRESH_ONLY=PASS "$RUNNER_TEMP/n2-installed.log"
            case "$P1B_ACK_CUT" in
              update|update-receipt)
                grep -Fxq "P1B_SCOPED_UPDATE_ACK_DURABILITY=PASS $P1B_ACK_CUT" "$RUNNER_TEMP/n2-installed.log"
                test "$(grep -c '^P1B_SCOPED_UPDATE_ACK_ORIGINAL_RETAINED ' "$RUNNER_TEMP/n2-installed.log")" = 2
                test "$(grep '^P1B_SCOPED_UPDATE_ACK_ORIGINAL_RETAINED ' "$RUNNER_TEMP/n2-installed.log" | sort -u | wc -l)" = 1
                ;;
              *) grep -Fxq "P1B_SCOPED_ACK_LOSS=PASS $P1B_ACK_CUT" "$RUNNER_TEMP/n2-installed.log" ;;
            esac
            exit 0
          fi
          if test "$PR188_OFFLINE_RETIREMENT" = 1; then
            grep -Fxq PR188_H2C_OFFLINE_POSTNATIVE_RESUMED=PASS "$RUNNER_TEMP/n2-installed.log"
            grep -Fxq PR188_H2C_OFFLINE_PURGE=PASS "$RUNNER_TEMP/n2-installed.log"
            grep -Fxq PR188_H2C_PURGE_INTERRUPTED_RESUMED=PASS "$RUNNER_TEMP/n2-installed.log"
            for marker in EXACT_UNKNOWN_REVIEW ARCHIVED_UNKNOWN_UNCHANGED NATIVE_RETIRED FOREIGN_UNCHANGED; do
              grep -Fxq "PR188_H2B_$marker=PASS" "$RUNNER_TEMP/n2-installed.log"
            done
            exit 0
          fi
          if test "$PR182_SCOPED_RETIREMENT" = 1; then
            grep -Fxq "PR188_H4A_INSTALLED_BUSY_AND_REPLAY=PASS SCOPED_V2" "$RUNNER_TEMP/n2-installed.log"
            grep -Fxq PR188_H4B_INSTALLED_CHURN_RETENTION=PASS "$RUNNER_TEMP/n2-installed.log"
            grep -Fxq "PR188_H2A_FOREIGN_ACL_PRE_DISPATCH_REFUSED=PASS" "$RUNNER_TEMP/n2-installed.log"
            grep -Fxq "PR188_H2A_DRAIN_COMPLETE=PASS" "$RUNNER_TEMP/n2-installed.log"
            grep -Fxq PR188_UNKNOWN_EFFECTIVE_DROPIN_NO_EFFECT=PASS "$RUNNER_TEMP/n2-installed.log"
            for marker in LIVE_PLAN RETIRED_HISTORY INTERRUPTED_RESUMED NATIVE_RESTORED FOREIGN_UNCHANGED COMPLETE; do
              grep -Fxq "PR182_SCOPED_$marker=PASS" "$RUNNER_TEMP/n2-installed.log"
            done
            grep -Fxq PR178_N2_CLEAN_INSTALLED_LIFECYCLE_PASS "$RUNNER_TEMP/n2-installed.log"
            grep -Fxq PR188_H2C_PURGE_INTERRUPTED_RESUMED=PASS "$RUNNER_TEMP/n2-installed.log"
            grep -Fxq RC14_SCOPED_PURGE=PASS "$RUNNER_TEMP/n2-installed.log"
            grep -Fxq 'PR188_ROUNDTRIP_NETWORK=PASS roundtrip-first' "$RUNNER_TEMP/n2-installed.log"
            grep -Fxq PR188_ROUNDTRIP_SCOPED_FRESH_LEDGER_OLD_TOKEN_DENIED=PASS "$RUNNER_TEMP/n2-installed.log"
            grep -Fxq 'PR188_ROUNDTRIP_NETWORK=PASS roundtrip-second' "$RUNNER_TEMP/n2-installed.log"
            grep -Fxq PR188_ROUNDTRIP_SCOPED_REINSTALL_WORKLOAD=PASS "$RUNNER_TEMP/n2-installed.log"
            exit 0
          fi
          if test "$PR178_SCOPED_N2" = 1; then
            grep -Fxq INSTALL_SCOPED_READONLY_PLAN=PASS "$RUNNER_TEMP/n2-installed.log"
            grep -Fxq INSTALL_SCOPED_STALE_PLAN_REFUSED=PASS "$RUNNER_TEMP/n2-installed.log"
            grep -Fxq INSTALL_SCOPED_WRAPPERS_REFUSE_LEGACY=PASS "$RUNNER_TEMP/n2-installed.log"
            grep -Fxq PR177_D2_SCOPED_ACTIVE_RETIRED_DIAGNOSTIC=PASS "$RUNNER_TEMP/n2-installed.log"
            grep -Fxq PR188_H1A_LIVE=PASS "$RUNNER_TEMP/n2-installed.log"
            grep -Fxq PR188_H1B_LIVE=PASS "$RUNNER_TEMP/n2-installed.log"
            grep -Fxq PR188_H1B_FOREIGN_CONSUMER_STALE=PASS "$RUNNER_TEMP/n2-installed.log"
            grep -Fxq PR177_D3_INSTALLED_PARTIAL_ORIGINAL_PLAN_BLOCKED=PASS "$RUNNER_TEMP/n2-installed.log"
            grep -Fq 'PR177_D3_INSTALLED_POSITIVE_PLAN=PASS SCOPED_V2' "$RUNNER_TEMP/n2-installed.log"
            grep -Fq 'PR177_D4_INSTALLED_REVIEWED_RECOVERY_NO_REPLAY=PASS SCOPED_V2 ' "$RUNNER_TEMP/n2-installed.log"
            grep -Fxq "PR188_H3B_GUIDED_DECLINE_NO_EFFECT=PASS SCOPED_V2" "$RUNNER_TEMP/n2-installed.log"
            grep -Fxq "PR188_H3B_GUIDED_APPLY=PASS SCOPED_V2" "$RUNNER_TEMP/n2-installed.log"
            grep -Fxq "PR188_H4A_INSTALLED_BUSY_AND_REPLAY=PASS SCOPED_V2" "$RUNNER_TEMP/n2-installed.log"
            grep -Fxq PR188_H4B_INSTALLED_CHURN_RETENTION=PASS "$RUNNER_TEMP/n2-installed.log"
            grep -Fxq "PR188_H4A_INSTALLED_UNKNOWN_NAVIGATION=PASS SCOPED_V2" "$RUNNER_TEMP/n2-installed.log"
            grep -Fxq 'PR177_D5_AUTHENTICATED_POSTCHECK=PASS SCOPED_V2' "$RUNNER_TEMP/n2-installed.log"
            grep -Fxq PR177_D4_INSTALLED_PARTIAL_APPLY_REFUSED=PASS "$RUNNER_TEMP/n2-installed.log"

            grep -Fxq PR177_D2_SCOPED_DEGRADED_DIAGNOSTIC=PASS "$RUNNER_TEMP/n2-installed.log"
            grep -Fxq PR178_N3_GUARD_PREREQUISITE=PASS "$RUNNER_TEMP/n2-installed.log"
            for marker in INSTALL FRESH_ONLY BOOT_ORDER MCP_SCOPED_CREATE MCP_SCOPED_DELETE MCP_LIFECYCLE; do
              grep -Fxq "PR178_N2_$marker=PASS" "$RUNNER_TEMP/n2-installed.log"
            done
            grep -Fxq PR178_N2_CLEAN_INSTALLED_LIFECYCLE_PASS "$RUNNER_TEMP/n2-installed.log"
            grep -Fxq P1B_SCOPED_FINAL_COMMIT_NATIVE_RECOVERY=PASS "$RUNNER_TEMP/n2-installed.log"
            grep -Fxq PR178_N3_INSTALLED_LIVE_FLOWS=PASS "$RUNNER_TEMP/n2-installed.log"
            grep -Fxq PR178_N3_ACTIVE_POLICY_LIFECYCLE=PASS "$RUNNER_TEMP/n2-installed.log"
            grep -Fxq PR178_N3_BOOT_POLICY=PASS "$RUNNER_TEMP/n2-installed.log"
            grep -Fxq PR178_N3_INSTALLED_PEER=PASS "$RUNNER_TEMP/n2-installed.log"
            for marker in UDP_FORWARD_CONTINUITY FORWARD_DEVICE_POSTSTATE CONCURRENT_ORIGINAL_UDP REINCARNATION NATIVE_PARTIAL_ACL_ACK_LOSS PARTIAL_PACKET_SAFETY PARTIAL_NO_RECOVERY_REPLAY PARTIAL_BOOT_REFUSAL PARTIAL_FORWARD_CONTINUITY PARTIAL_MCP_FENCED DEGRADED_MCP_STABLE; do
              grep -Fq "PR178_N4_$marker=PASS" "$RUNNER_TEMP/n2-installed.log"
            done
            grep -Fxq 'N4_PARTIAL_RESTART_PHASE UNKNOWN' "$RUNNER_TEMP/n2-installed.log"
            exit 0
          fi
          grep -Fxq I2_GUIDED_LEGACY_PREVIEW_NO_EFFECT=PASS "$RUNNER_TEMP/n2-installed.log"
          grep -Fxq I3_LEGACY_DRIFT_REFUSED_BEFORE_RETIREMENT=PASS "$RUNNER_TEMP/n2-installed.log"
          grep -Fq 'PR177_D3_INSTALLED_POSITIVE_PLAN=PASS LEGACY' "$RUNNER_TEMP/n2-installed.log"
          grep -Fq 'PR177_D4_INSTALLED_REVIEWED_RECOVERY_NO_REPLAY=PASS LEGACY ' "$RUNNER_TEMP/n2-installed.log"
          grep -Fxq "PR188_H3B_GUIDED_DECLINE_NO_EFFECT=PASS LEGACY" "$RUNNER_TEMP/n2-installed.log"
          grep -Fxq "PR188_H4A_INSTALLED_BUSY_AND_REPLAY=PASS LEGACY" "$RUNNER_TEMP/n2-installed.log"
          grep -Fxq "PR188_H4A_INSTALLED_UNKNOWN_NAVIGATION=PASS LEGACY" "$RUNNER_TEMP/n2-installed.log"
          grep -Fxq PR177_D5_LEGACY_CLEANUP=PASS "$RUNNER_TEMP/n2-installed.log"
          grep -Fxq 'PR177_D5_AUTHENTICATED_POSTCHECK=PASS LEGACY' "$RUNNER_TEMP/n2-installed.log"
          for marker in N2_INSTALLED_HELPER_ACTIVATION N2_INSTALLED_HELPER_OUTAGE_RECOVERY_NO_DELETE_REPLAY N2_SCHEMA6_UPGRADE_ROLLBACK N2_FULL_UNINSTALL_PRESERVES_ARCHIVE; do
            grep -Fxq "$marker=PASS" "$RUNNER_TEMP/n2-installed.log"
          done
          grep -Fxq N2_CLEAN_INSTALLED_LIFECYCLE_PASS "$RUNNER_TEMP/n2-installed.log"
          grep -Fxq PR188_H2C_PURGE_INTERRUPTED_RESUMED=PASS "$RUNNER_TEMP/n2-installed.log"
          grep -Fxq RC14_LEGACY_PURGE=PASS "$RUNNER_TEMP/n2-installed.log"
          grep -Fxq RC14_FRESH_LEDGER=PASS "$RUNNER_TEMP/n2-installed.log"
          grep -Fxq RC14_LEGACY_TO_SCOPED_REINSTALL=PASS "$RUNNER_TEMP/n2-installed.log"
