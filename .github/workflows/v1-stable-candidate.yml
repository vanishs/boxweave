name: v1 stable candidate build (no publication)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v1-stable-candidate
  cancel-in-progress: false

jobs:
  source:
    name: stable-candidate-source
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require current protected v1 source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          test "$GITHUB_REF" = refs/heads/v1
          test "$GITHUB_REF_PROTECTED" = true
          test "$GITHUB_REPOSITORY" = vanishs/boxweave
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/v1" --jq .object.sha)" = "$GITHUB_SHA"
          grep -Exq '1\.[0-9]+\.[0-9]+' VERSION
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: |
          make verify
          sh -n install.sh
          sh -n uninstall.sh
          python3 -m unittest -v scripts/test_v1_release_manifest.py

  build:
    needs: source
    name: stable-candidate-build-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build and smoke actual stable-version bytes on native architecture
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(go env GOARCH)" = "$ARCH"
          test "$(go env CGO_ENABLED)" = 1
          version="$(cat VERSION)"
          mkdir release-assets
          binary="release-assets/boxweave-v$version-linux-$ARCH"
          CGO_ENABLED=1 go build -trimpath -buildvcs=false \
            -ldflags "-X main.version=$version -X main.commit=$GITHUB_SHA -buildid=" \
            -o "$binary" ./cmd/boxweave
          python3 - "$version" "$GITHUB_SHA" "$binary" <<'PY'
          import json, subprocess, sys
          assert json.loads(subprocess.check_output([sys.argv[3], "build-info"])) == {
              "version": sys.argv[1], "commit": sys.argv[2]}
          PY
          d="$(mktemp -d "$RUNNER_TEMP/stable-sqlite.XXXXXXXX")"
          chmod 0700 "$d"
          trap 'rm -rf -- "$d"' EXIT
          "$binary" status -db "$d/ledger.sqlite" -project no-project \
            -incus-socket /unavailable-incus > "$d/status.json"
          python3 - "$d/status.json" <<'PY'
          import json, sys
          assert json.load(open(sys.argv[1]))["ready"] is False
          PY
          go test -count=1 ./...
          sha256sum "$binary"
      - uses: actions/upload-artifact@v4
        with:
          name: v1-stable-bin-${{ matrix.arch }}-${{ github.run_attempt }}
          path: release-assets/
          if-no-files-found: error
          retention-days: 30

  package:
    name: stable-candidate-package
    needs: [source, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: v1-stable-bin-*-${{ github.run_attempt }}
          merge-multiple: true
          path: release-assets
      - name: Package immutable candidate; no stable release or pointer change
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/v1" --jq .object.sha)" = "$GITHUB_SHA"
          python3 scripts/v1_release_manifest.py --directory release-assets \
            --tag "v$(cat VERSION)" --source "$GITHUB_SHA" --installer install.sh
          python3 - <<'PY'
          import sys, os
          from pathlib import Path
          sys.path.insert(0, "scripts")
          from v1_stable_gate import verify_assets
          print(verify_assets(Path("release-assets"), "v"+Path("VERSION").read_text().strip(),
                              os.environ["GITHUB_SHA"], Path(".")))
          PY
          (cd release-assets && sha256sum -c SHA256SUMS)
          echo STABLE_CANDIDATE_PACKAGED_NOT_PUBLISHED
      - uses: actions/upload-artifact@v4
        with:
          name: v1-stable-assets-${{ github.run_attempt }}
          path: release-assets/
          if-no-files-found: error
          retention-days: 30
