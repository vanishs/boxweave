name: v1 Linux amd64 and arm64 candidate artifacts (controlled prerelease)

on:
  push:
    branches: [v1, "feat/v1-*", "release/v1.*-rc.*"]
  pull_request:
    branches: [v1]
permissions:
  contents: read

concurrency:
  group: v1-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scope:
    name: v1-candidate-change-scope
    runs-on: ubuntu-24.04
    outputs:
      full: ${{ steps.classify.outputs.full }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Determine documentation-only vs full candidate
        id: classify
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_REF: ${{ github.ref }}
          CI_BEFORE_SHA: ${{ github.event.before }}
          CI_BASE_REF: ${{ github.base_ref }}
        run: python3 scripts/ci_change_scope.py
      - name: Document-only candidate build intentionally skipped
        if: steps.classify.outputs.full == 'false'
        run: echo "CI_DOCS_ONLY_CANDIDATE_SKIP=PASS (no candidate binary or release artifact)"

  source:
    needs: scope
    if: needs.scope.outputs.full == 'true'
    name: v1-source-quality-release-tooling
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Source validation and external distribution negative tests
        env:
          EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXACT_HEAD"
          echo "H5_DISTRIBUTION_SOURCE=$EXACT_HEAD"
          make verify
          # The S2 native verifier is build-tagged 'ignore', so go test ./...
          # does not compile it. Catch future verifier/API drift before RC.
          CGO_ENABLED=1 go build -trimpath -o "$RUNNER_TEMP/s2-unknown-create-bind-probe" ./scripts/s2_unknown_create_binding_probe.go
          CGO_ENABLED=1 go build -trimpath -o "$RUNNER_TEMP/s2-bound-create-finalization-probe" ./scripts/s2_p1_bound_create_receipt_fault_probe.go
          # A prior S2 native release was blocked by a stale shell PASS label
          # even though its isolated Go verifier completed. Check the contract.
          python3 - <<'PY_S2_MARKERS'
          import pathlib, re
          shell = pathlib.Path("scripts/s2_p1_bound_create_receipt_fault.sh").read_text()
          probe = pathlib.Path("scripts/s2_p1_bound_create_receipt_fault_probe.go").read_text()
          markers = re.findall(r"grep -Fqx (S4_A_[A-Z0-9_]+)=PASS", shell)
          assert len(markers) >= 3, markers
          assert all(f'"{marker}=PASS"' in probe for marker in markers), markers
          PY_S2_MARKERS
          sh -n scripts/s2_p1_bound_create_receipt_fault.sh
          sh -n install.sh
          python3 -m unittest -v scripts/test_v1_release_manifest.py
          python3 scripts/test_ci_candidate_build.py
      - name: Do not treat a source VERSION as a published release
        run: |
          test -f VERSION
          test -f V1_PUBLISHED_RELEASE
          test "$(cat V1_PUBLISHED_RELEASE)" = UNPUBLISHED || grep -Eq '^v1\.[0-9]+\.[0-9]+$' V1_PUBLISHED_RELEASE

  linux:
    needs: scope
    if: needs.scope.outputs.full == 'true'
    name: v1-linux-${{ matrix.goarch }}-cgobuild
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            runner: ubuntu-24.04
          - goarch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify native target, source version, CGO and build exact candidate
        shell: bash
        env:
          EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          GOARCH_EXPECTED: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXACT_HEAD"
          test "$(go env GOARCH)" = "$GOARCH_EXPECTED"
          test "$(go env CGO_ENABLED)" = 1
          base_version=$(cat VERSION)
          test "$base_version" = 1.0.0 || [[ "$base_version" =~ ^1\.[0-9]+\.[0-9]+$ ]]
          version="$base_version-rc.1"
          EVENT_TAG=""
          if [[ "$GITHUB_REF" == refs/heads/release/* ]]; then
            EVENT_TAG="${GITHUB_REF#refs/heads/release/}"
          fi
          if [[ -n "$EVENT_TAG" ]]; then
            [[ "$EVENT_TAG" =~ ^v1\.[0-9]+\.[0-9]+-rc\.[1-9][0-9]*$ ]]
            test "${EVENT_TAG#v}" = "$base_version"-rc."${EVENT_TAG##*.}"
            version="${EVENT_TAG#v}"
          fi
          mkdir -p release-assets
          name="boxweave-v$version-linux-$GOARCH_EXPECTED"
          python3 scripts/ci_candidate_build.py "$version" "$EXACT_HEAD" "$GOARCH_EXPECTED" "release-assets/$name"
          go test -count=1 ./...
          sha256sum "release-assets/$name"
      - uses: actions/upload-artifact@v4
        with:
          name: v1-linux-${{ matrix.goarch }}-candidate
          path: release-assets/
          retention-days: 7
          if-no-files-found: error

  native-s2-gate:
    name: v1-prerelease-native-S2-isolated-runner
    # N2's independent fresh installed Scoped jobs run in the dedicated
    # workflow on this exact RC push. S2.5 remains a separate real native VM.
    # The consumer needs the actual candidate manifest and nested evidence.
    needs: [native-s25-gate, candidate]
    outputs:
      native_manifest_sha256: ${{ steps.crosswalk.outputs.manifest_sha256 }}
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/v1.')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    env:
      RUNNER_ENVIRONMENT: github-hosted
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: v1-release-candidate-manifest
          path: release-assets
      - name: Require the exact protected v1 HEAD and release candidate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/pr191_s2_ci_gate.py --release-version
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/v1" --jq .object.sha)" = "$GITHUB_SHA"
          (cd release-assets && sha256sum -c SHA256SUMS)
      - name: Exact installed Scoped S2 original CI provenance and RC asset identity
        id: crosswalk
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/test_pr191_s2_witness_map.py
          python3 scripts/test_pr191_s2_ci_gate.py
          python3 scripts/pr191_s2_ci_gate.py --release release-assets | tee "$RUNNER_TEMP/native-s2-gate.log"
          grep -Fxq P2_R4_SCOPED_RELEASE_S2_EXACT_CI_CROSSWALK=PASS "$RUNNER_TEMP/native-s2-gate.log"
          echo "manifest_sha256=$(sha256sum release-assets/SHA256SUMS | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

  native-s25-gate:
    name: v1-prerelease-nested-S2.5-isolated-runner
    # Each job receives a fresh GitHub-hosted VM. S2 installs Incus,
    # so S2.5's foreign-native-state guard must never run on S2's runner.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/v1.')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      RUNNER_ENVIRONMENT: github-hosted
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Require the exact protected v1 HEAD before touching a disposable VM
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/pr191_s2_ci_gate.py --release-version
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/v1" --jq .object.sha)" = "$GITHUB_SHA"
      - name: Real nested independent Agent/Incus verifier
        shell: bash
        env:
          P1B_S25_SCOPED: '1'
          P1B_S25_EXACT_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          sh -n scripts/pr191_s25_evidence_check.sh
          python3 scripts/test_pr191_s25_evidence_check.py
          python3 scripts/test_pr191_s2_witness_map.py
          sh scripts/s25_bridgehead_lab.sh 2>&1 | tee "$RUNNER_TEMP/native-s25-gate.log"
          sh scripts/pr191_s25_evidence_check.sh "$RUNNER_TEMP/native-s25-gate.log" "$P1B_S25_EXACT_HEAD"
          python3 scripts/pr191_s2_witness_map.py --log "$RUNNER_TEMP/native-s25-gate.log" --source "$P1B_S25_EXACT_HEAD" --lane s25 --ci-receipt "$RUNNER_TEMP/pr191-s25-lane.json"
      - name: Retain sanitized lane locator
        uses: actions/upload-artifact@v4
        with:
          name: pr191-s2-s25-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pr191-s25-lane.json
          retention-days: 7
          if-no-files-found: error

  candidate:
    name: v1-exact-source-two-arch-manifest
    needs: [scope, source, linux]
    if: needs.scope.outputs.full == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: v1-linux-*-candidate
          path: release-assets
          merge-multiple: true
      - name: Make and self-verify exact candidate manifest
        shell: bash
        env:
          EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXACT_HEAD"
          tag=""
          if [[ "$GITHUB_REF" == refs/heads/release/* ]]; then
            tag="${GITHUB_REF#refs/heads/release/}"
          fi
          if [[ -z "$tag" ]]; then tag="v$(cat VERSION)-rc.1"; fi
          # A branch CI artifact is always a candidate, not a published release.
          # When publishing, exact tag must have been stamped in both binaries.
          python3 scripts/v1_release_manifest.py --directory release-assets \
            --tag "$tag" --source "$EXACT_HEAD" --installer install.sh
          (cd release-assets && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: v1-release-candidate-manifest
          path: release-assets/
          retention-days: 7
          if-no-files-found: error

  publish:
    name: v1-immutable-development-RC-release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/v1.')
    needs: [source, linux, native-s2-gate, native-s25-gate, candidate]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: v1-release-candidate-manifest
          path: release-assets
      - name: Exact v1 HEAD, release branch, tag and immutable asset-set protection; publish prerelease only
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_NATIVE_MANIFEST_SHA256: ${{ needs.native-s2-gate.outputs.native_manifest_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          INPUT_TAG="${GITHUB_REF#refs/heads/release/}"
          [[ "$GITHUB_REF" == "refs/heads/release/$INPUT_TAG" ]]
          [[ "$INPUT_TAG" =~ ^v1\.[0-9]+\.[0-9]+-rc\.[1-9][0-9]*$ ]]
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/v1" --jq .object.sha)" = "$GITHUB_SHA"
          python3 - "$INPUT_TAG" "$GITHUB_SHA" <<'PY'
          import json, pathlib, sys
          m = json.loads(pathlib.Path('release-assets/release.json').read_text())
          assert m['tag'] == sys.argv[1] and m['source'] == sys.argv[2]
          PY
          (cd release-assets && sha256sum -c SHA256SUMS)
          [[ "$EXPECTED_NATIVE_MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]]
          test "$(sha256sum release-assets/SHA256SUMS | cut -d' ' -f1)" = "$EXPECTED_NATIVE_MANIFEST_SHA256"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$INPUT_TAG" >/dev/null 2>&1; then
            test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$INPUT_TAG" --jq .object.sha)" = "$GITHUB_SHA"
            if gh release view "$INPUT_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "Refuse replacing existing immutable RC Release" >&2
              exit 1
            fi
          else
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$INPUT_TAG" -f sha="$GITHUB_SHA" >/dev/null
          fi
          gh release create "$INPUT_TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease \
            --title "BoxWeave $INPUT_TAG development prerelease" \
            --notes "Immutable v1 development candidate. Not S5 release qualified or HOST_GO. Separate explicit host approval, native preflight and exact binary digest are required; V1_PUBLISHED_RELEASE is unchanged."
          mkdir -p release-readback
          gh release download "$INPUT_TAG" --repo "$GITHUB_REPOSITORY" --dir release-readback
          cmp release-assets/SHA256SUMS release-readback/SHA256SUMS
          (cd release-readback && sha256sum -c SHA256SUMS)
          echo "RC published with exact checked artifacts; stable pointer untouched"
