name: S5A2 installed original recovery
on:
  push:
    branches: [feat/v1-s5a-closeout-20261120]
    paths:
      - 'internal/recovery/**'
      - 'internal/state/operation_recover*.go'
      - 'internal/control/operation_recover*.go'
      - 'scripts/s5a2_recovery_probe.go'
      - 'scripts/s5a2_installed_cli_review.sh'
      - '.github/workflows/v1-s5a2-installed.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-recovery:
    if: github.repository == 'vanishs/boxweave' && github.ref == 'refs/heads/feat/v1-s5a-closeout-20261120'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RUNNER_ENVIRONMENT: github-hosted
      S5A2_RECOVERY_NATIVE_ONLY: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Scoped source recovery and CLI regression
        run: go test -count=1 ./internal/state ./internal/recovery ./internal/control ./cmd/boxweave -run 'TestS5A2|Test.*Recovery|Test.*Recover'
      - name: Actual installed candidate, independent native and SQLite original witness
        shell: bash
        run: |
          set -euo pipefail
          logfile="$RUNNER_TEMP/s5a2-native.log"
          if ! sh scripts/accept_s2_native.sh >"$logfile" 2>&1; then
            grep -E '^(S5A2_|S2_NATIVE_CANDIDATE_SOURCE_SHA=|panic: S5A2_NATIVE_FAIL:)' "$logfile" | tail -n 100 || :
            echo S5A2_INSTALLED_NATIVE=BLOCKED_OR_FAILED
            exit 1
          fi
          for marker in EXEC_ORIGINAL_SQLITE_OUTPUT_AND_ONE_EFFECT POWER_UPDATE_ORIGINAL_TERMINAL_AND_POSTSTATE DELETE_TERMINAL_EXACT_ABSENCE_TOMBSTONE CREATE_BIND_IDENTITY_ONLY_LOCK_RETAINED INSTALLED_RECOVERY STAGED_ROOT_CLI_MCP_PARITY_NO_REPLAY; do
            grep -Fxq "S5A2_NATIVE_${marker}=PASS" "$logfile"
          done
          grep -E '^(S5A2_|S2_NATIVE_CANDIDATE_SOURCE_SHA=)' "$logfile"
          echo "S5A2_INSTALLED_NATIVE=PASS SHA=$GITHUB_SHA"
