name: S3 real native Incus SFTP negative matrix (one-use CI only)

on:
  push:
    branches:
      - feat/v1-s3-agent-files-20261115
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: s3-file-native-branch
  cancel-in-progress: false

jobs:
  native-file-probe:
    name: s3-incus76-sftp-real-guest-negative
    if: github.repository == 'vanishs/boxweave' && github.ref == 'refs/heads/feat/v1-s3-agent-files-20261115'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RUNNER_ENVIRONMENT: github-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Guard clean ephemeral runner and compile native test
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(id -u)" -ne 0
          sudo -n true
          grep -qx 'ID=ubuntu' /etc/os-release
          grep -Eq '^VERSION_ID="?24[.]04"?$' /etc/os-release
          test ! -e /var/lib/incus
          ! id boxweave >/dev/null 2>&1
          gofmt -d internal/native/file_native_integration_test.go
          test -z "$(gofmt -l internal/native/file_native_integration_test.go)"
          go test -c -o "$RUNNER_TEMP/s3-file-native-test" ./internal/native
          chmod 0755 "$RUNNER_TEMP/s3-file-native-test"
          printf 'S3_NATIVE_SOURCE_SHA=%s\n' "$GITHUB_SHA"
          echo S3_NATIVE_ONE_USE_RUNNER_GUARD=PASS
      - name: Install signed pinned Incus 7.6 to disposable runner only
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates curl gpg dnsmasq-base >/dev/null
          curl -fsSL --max-time 40 https://pkgs.zabbly.com/key.asc -o "$RUNNER_TEMP/s3-zabbly.asc"
          fpr="$(gpg --show-keys --with-colons "$RUNNER_TEMP/s3-zabbly.asc" | awk -F: '$1=="fpr"{print $10;exit}')"
          test "$fpr" = 4EFC590696CB15B87C73A3AD82CC8797C838DCFD
          sudo install -d -m 0755 /etc/apt/keyrings
          sudo install -m 0644 "$RUNNER_TEMP/s3-zabbly.asc" /etc/apt/keyrings/s3-file.asc
          sudo tee /etc/apt/sources.list.d/s3-file.sources >/dev/null <<'SIGNED'
          Enabled: yes
          Types: deb
          URIs: https://pkgs.zabbly.com/incus/stable
          Suites: noble
          Components: main
          Architectures: amd64
          Signed-By: /etc/apt/keyrings/s3-file.asc
          SIGNED
          sudo apt-get update -qq
          pkg="$(apt-cache madison incus | awk '/pkgs.zabbly.com/ && $3 ~ /:7[.]6[-.]/ {print $3;exit}')"
          test -n "$pkg"
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends "incus=$pkg" "incus-client=$pkg" "incus-base=$pkg" >/dev/null
          sudo systemctl start incus.service
          sudo systemctl is-active --quiet incus.service
          test -z "$(sudo incus list --all-projects --format csv -c n)"
          sudo incus admin init --auto --storage-backend=dir
          sudo incus version
          echo S3_NATIVE_SIGNED_INCUS_76=PASS
      - name: Create single disposable Ubuntu Guest and exact hostile file fixtures
        shell: bash
        run: |
          set -euo pipefail
          sudo incus launch images:ubuntu/24.04 s3-file-native-ci-1115 -c limits.cpu=1 -c limits.memory=768MiB
          sudo incus exec s3-file-native-ci-1115 -- /bin/sh -ec '
            mkdir -p /tmp/s3-file-native
            printf S3_ORIGINAL_VICTIM_BYTES_KEEP > /tmp/s3-file-native/victim
            ln -s /tmp/s3-file-native/victim /tmp/s3-file-native/symlink
            ln /tmp/s3-file-native/victim /tmp/s3-file-native/hardlink
            mkfifo /tmp/s3-file-native/fifo
            ln -s /tmp/s3-file-native /tmp/s3-file-native-link
            test ! -e /tmp/s3-file-native/race-new
          '
          echo S3_NATIVE_HOSTILE_GUEST_FIXTURES=PASS
      - name: Real official Incus SFTP link, original byte and 12-writer negative oracle
        shell: bash
        run: |
          set -euo pipefail
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT env S3_NATIVE_FILE_LAB=approved-ephemeral-vm \
            "$RUNNER_TEMP/s3-file-native-test" -test.run '^TestS3RealIncusSFTPFileNegatives$' -test.v \
            | tee "$RUNNER_TEMP/s3-file-native.log"
          grep -Fq 'S3_NATIVE_SFTP_12_WRITERS_SINGLE_WINNER_NO_FOREIGN_EFFECT=PASS' "$RUNNER_TEMP/s3-file-native.log"
          grep -Fq 'S3_NATIVE_SFTP_SYMLINK_HARDLINK_FIFO_NO_EFFECT=PASS' "$RUNNER_TEMP/s3-file-native.log"
          sudo incus exec s3-file-native-ci-1115 -- /bin/sh -ec '
            test "$(cat /tmp/s3-file-native/victim)" = S3_ORIGINAL_VICTIM_BYTES_KEEP
            test "$(wc -c < /tmp/s3-file-native/race-new)" -eq 17
          '
          echo S3_NATIVE_INDEPENDENT_GUEST_POSTSTATE=PASS
      - name: Confirm owned disposable test Guest absent at job end
        if: always()
        shell: bash
        run: |
          if [ -S /var/lib/incus/unix.socket ]; then
            sudo incus delete -f s3-file-native-ci-1115 --project default 2>/dev/null || true
            if sudo incus info s3-file-native-ci-1115 --project default >/dev/null 2>&1; then
              echo S3_NATIVE_CLEANUP_UNVERIFIED
              exit 1
            fi
          fi
          echo S3_NATIVE_DISPOSABLE_GUEST_CLEANUP=PASS
