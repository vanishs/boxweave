name: S4-B4 disposable native instance proxy TCP/UDP
on:
  push:
    branches: [feat/v1-s4-runtime-integration-20261116]
    paths:
      - .github/workflows/v1-s4-b4-forward-native.yml
      - internal/native/forward.go
      - internal/native/forward_native_test.go
      - internal/control/forward_installed_native_test.go
      - internal/native/forward_test.go
      - internal/control/forward_tools.go
      - internal/state/network_forward.go
      - internal/state/store.go
      - internal/state/worker.go
  workflow_dispatch:
permissions:
  contents: read
jobs:
  owned-proxy-native:
    if: github.repository == 'vanishs/boxweave' && github.ref == 'refs/heads/feat/v1-s4-runtime-integration-20261116'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      RUNNER_ENVIRONMENT: github-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Preflight exact source and native tests
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true && test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(id -u)" -ne 0
          sudo -n true
          test ! -e /var/lib/incus && ! id boxweave >/dev/null 2>&1
          test -z "$(gofmt -l internal/native/forward.go internal/native/forward_test.go internal/native/forward_native_test.go)"
          go test -count=1 ./internal/native -run '^TestB4ForwardSpecAndExactProxyDevice$'
          go test -c -o "$RUNNER_TEMP/s4b4-native-test" ./internal/native
          go test -c -o "$RUNNER_TEMP/s4b4-control-test" ./internal/control
          CGO_ENABLED=0 go build -tags s4b2_native_ci -o "$RUNNER_TEMP/s4b4-echo" ./scripts/s4_b2_native_flow_probe.go
          echo "S4_B4_EXACT_SOURCE=$GITHUB_SHA"
      - name: Fresh signed Incus 7.6 and dedicated restricted one-use Project
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates curl gpg dnsmasq-base >/dev/null
          curl -fsSL --max-time 30 https://pkgs.zabbly.com/key.asc -o "$RUNNER_TEMP/key.asc"
          fpr="$(gpg --show-keys --with-colons "$RUNNER_TEMP/key.asc" | awk -F: '$1=="fpr" {print $10; exit}')"
          test "$fpr" = 4EFC590696CB15B87C73A3AD82CC8797C838DCFD
          sudo install -m 0644 "$RUNNER_TEMP/key.asc" /etc/apt/keyrings/s4b4-zabbly.asc
          echo 'deb [arch=amd64 signed-by=/etc/apt/keyrings/s4b4-zabbly.asc] https://pkgs.zabbly.com/incus/stable noble main' | sudo tee /etc/apt/sources.list.d/s4b4-incus.list >/dev/null
          sudo apt-get update -qq
          pkg="$(apt-cache madison incus | awk '/pkgs.zabbly.com/ && $3 ~ /:7[.]6[-.]/ {print $3; exit}')"
          test -n "$pkg"
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends "incus=$pkg" "incus-client=$pkg" "incus-base=$pkg" >/dev/null
          sudo systemctl start incus.service
          sudo incus admin init --auto --storage-backend=dir
          test -z "$(sudo incus list --all-projects --format csv -c n)"
          sudo useradd -m -s /bin/sh boxweave
          sudo usermod -aG incus boxweave
          if id -nG boxweave | tr ' ' '\n' | grep -Eq '^(incus-admin|sudo|lxd|docker)$'; then exit 72; fi
          uid="$(id -u boxweave)"
          test "$uid" -ge 1000
          project="user-$uid"
          echo "S4_B4_PROJECT=$project" >> "$GITHUB_ENV"
          sudo incus network create bwbr0 ipv4.address=10.248.83.1/24 ipv4.nat=true ipv6.address=fd83:248::1/64 ipv6.nat=true ipv6.dhcp.stateful=true
          sudo incus network acl create bw-s4b4-native
          sudo incus project create "$project" \
            -c restricted=true -c features.images=false -c features.profiles=true -c features.networks=false \
            -c restricted.devices.nic=managed -c restricted.networks.access=bwbr0 \
            -c restricted.devices.proxy=allow
          sudo incus --project "$project" profile device add default root disk path=/ pool=default
          sudo incus --project "$project" profile device add default eth0 nic name=eth0 \
            network=bwbr0 security.acls=bw-s4b4-native \
            security.acls.default.ingress.action=reject security.acls.default.egress.action=reject \
            security.ipv4_filtering=true security.ipv6_filtering=true security.mac_filtering=true
          sudo incus --project "$project" init images:ubuntu/24.04 s4b4native -c limits.cpu=1 -c limits.memory=512MiB
          sudo incus --project "$project" config device override s4b4native eth0 \
            ipv4.address=10.248.83.21 ipv6.address=fd83:248::21
          sudo incus --project "$project" start s4b4native
          for i in $(seq 1 50); do
            if sudo incus --project "$project" exec s4b4native -- ip -4 addr show eth0 | grep -q 10.248.83.21; then break; fi
            sleep 2
          done
          sudo incus --project "$project" exec s4b4native -- ip -4 addr show eth0 | grep -q 10.248.83.21
          sudo incus --project "$project" file push "$RUNNER_TEMP/s4b4-echo" s4b4native/root/s4b4-echo
          sudo incus --project "$project" exec s4b4native -- chmod 0755 /root/s4b4-echo
          sudo incus --project "$project" exec s4b4native -- sh -c 'nohup /root/s4b4-echo server >/tmp/s4b4-echo.log 2>&1 </dev/null &'
          for i in $(seq 1 40); do
            if sudo incus --project "$project" exec s4b4native -- test -f /tmp/s4b2-flow-server-ready; then break; fi
            sleep 1
          done
          sudo incus --project "$project" exec s4b4native -- test -f /tmp/s4b2-flow-server-ready
          sudo install -m 0755 "$RUNNER_TEMP/s4b4-native-test" /usr/local/bin/s4b4-native-test
          sudo install -m 0755 "$RUNNER_TEMP/s4b4-control-test" /usr/local/bin/s4b4-control-test
          echo S4_B4_DISPOSABLE_NATIVE_FIXTURE_READY=PASS
      - name: Real nonroot SDK ETag proxy TCP UDP packets and exact deletion
        shell: bash
        run: |
          set -euo pipefail
          test "$S4_B4_PROJECT" = "user-$(id -u boxweave)"
          test -S /var/lib/incus/unix.socket.user
          sudo -u boxweave env GITHUB_ACTIONS=true BOXWEAVE_B4_NATIVE_ONE_USE=s4b4-disposable-only-20261119 \
            /usr/local/bin/s4b4-native-test -test.v -test.run '^TestB4NativeOwnedProxyTCPUDP$' | tee "$RUNNER_TEMP/s4b4-native.log"
          grep -Fq 'S4_B4_NATIVE_tcp_ORIGINAL_ETAG_PROXY_PACKET=PASS' "$RUNNER_TEMP/s4b4-native.log"
          grep -Fq 'S4_B4_NATIVE_udp_ORIGINAL_ETAG_PROXY_PACKET=PASS' "$RUNNER_TEMP/s4b4-native.log"
          grep -Fq 'S4_B4_NATIVE_tcp_REMOVAL_PACKET_REFUSED=PASS' "$RUNNER_TEMP/s4b4-native.log"
          grep -Fq 'S4_B4_NATIVE_udp_REMOVAL_PACKET_REFUSED=PASS' "$RUNNER_TEMP/s4b4-native.log"
          echo S4_B4_NATIVE_NONROOT_SDK_TCP_UDP_PACKET_PASS
      - name: Installed authenticated HTTP MCP create list delete and packet evidence
        shell: bash
        run: |
          set -euo pipefail
          test "$S4_B4_PROJECT" = "user-$(id -u boxweave)"
          sudo -u boxweave env GITHUB_ACTIONS=true BOXWEAVE_B4_MCP_ONE_USE=s4b4-disposable-only-20261119             /usr/local/bin/s4b4-control-test -test.v -test.run '^TestB4InstalledMCPNativeCreateListDelete$' | tee "$RUNNER_TEMP/s4b4-mcp.log"
          grep -Fq 'S4_B4_MCP_tcp_REAL_CREATION_REPLAY_CONFLICT_PACKET_DELETE=PASS' "$RUNNER_TEMP/s4b4-mcp.log"
          grep -Fq 'S4_B4_MCP_udp_REAL_CREATION_REPLAY_CONFLICT_PACKET_DELETE=PASS' "$RUNNER_TEMP/s4b4-mcp.log"
          grep -Fq 'S4_B4_INSTALLED_AUTHENTICATED_21_TOOL_HTTP_MCP_ORIGINAL_SQLITE_INCUS_TCP_UDP=PASS' "$RUNNER_TEMP/s4b4-mcp.log"
          sudo incus --project "$S4_B4_PROJECT" config device show s4b4native | tee "$RUNNER_TEMP/s4b4-device-readback.txt"
          if grep -q 'bwpf-' "$RUNNER_TEMP/s4b4-device-readback.txt"; then
            echo S4_B4_NATIVE_PROXY_LEAK; exit 70
          fi
          sudo incus --project "$S4_B4_PROJECT" stop s4b4native
          sudo incus --project "$S4_B4_PROJECT" delete s4b4native
          sudo incus project delete "$S4_B4_PROJECT"
          sudo incus network acl delete bw-s4b4-native
          sudo incus network delete bwbr0
          test -z "$(sudo incus list --all-projects --format csv -c n)"
          echo S4_B4_NATIVE_SCOPED_TCP_UDP_SOURCE_PACKET_CLEANUP=PASS
