name: S4-B4 disposable native instance proxy TCP/UDP
on:
  push:
    branches: [feat/v1-s4-runtime-integration-20261116, feat/v1-s5a-closeout-20261120, feat/v1-s5b-acceptance-20261120, feat/v1-forward-all-20261121, feat/v1-network-reliability-20261122]
    paths:
      - internal/state/network_recovery*.go
      - internal/recovery/**
      - internal/control/network_recovery_native_test.go
      - internal/control/peer_recovery_native_test.go
      - .github/workflows/v1-s4-b4-forward-native.yml
      - internal/native/forward_policy.go
      - cmd/boxweave/main.go
      - internal/state/lifecycle.go
      - internal/state/network_forward_test.go
      - internal/native/forward.go
      - internal/native/forward_native_test.go
      - internal/control/forward_installed_native_test.go
      - internal/control/forward_crash_native_test.go
      - internal/native/forward_test.go
      - internal/control/forward_tools.go
      - internal/state/network_forward.go
      - internal/state/store.go
      - internal/state/worker.go
      - internal/control/delete_dependencies.go
      - internal/control/delete_dependencies_native_test.go
      - internal/control/delete_ack_native_test.go
      - internal/state/delete_recovery.go
      - internal/native/delete_recovery.go
      - cmd/boxweave/recover_delete.go
      - cmd/boxweave/recover.go
      - internal/state/delete_dependencies.go
      - internal/state/delete_dependencies_test.go
      - internal/state/network_deleted_binding.go
      - internal/control/box_tools.go
  workflow_dispatch:
permissions:
  contents: read
jobs:
  owned-proxy-native:
    if: github.repository == 'vanishs/boxweave' && (github.ref == 'refs/heads/feat/v1-s4-runtime-integration-20261116' || (github.ref == 'refs/heads/feat/v1-s5a-closeout-20261120' || github.ref == 'refs/heads/feat/v1-s5b-acceptance-20261120') || github.ref == 'refs/heads/feat/v1-forward-all-20261121' || github.ref == 'refs/heads/feat/v1-network-reliability-20261122')
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      RUNNER_ENVIRONMENT: github-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.ref == 'refs/heads/feat/v1-s5b-acceptance-20261120' && 'a3e02b4750edcabb80427e3311a19614d82b0029' || github.sha }}
      - name: Require exact frozen S5B source when running the acceptance branch
        if: github.ref == 'refs/heads/feat/v1-s5b-acceptance-20261120'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = a3e02b4750edcabb80427e3311a19614d82b0029
          test "$(git rev-parse HEAD^{tree})" = 19f4548315c497f611bd83d5537bf6ec5d63e9d1
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Preflight exact source and native tests
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true && test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(id -u)" -ne 0
          sudo -n true
          test ! -e /var/lib/incus && ! id boxweave >/dev/null 2>&1
          test -z "$(gofmt -l internal/native/forward.go internal/native/forward_test.go internal/native/forward_native_test.go)"
          go test -count=1 ./internal/native -run '^TestB4ForwardSpecAndExactProxyDevice$'
          go test -c -o "$RUNNER_TEMP/s4b4-native-test" ./internal/native
          go test -c -o "$RUNNER_TEMP/s4b4-control-test" ./internal/control
          CGO_ENABLED=0 go build -tags s4b2_native_ci -o "$RUNNER_TEMP/s4b4-echo" ./scripts/s4_b2_native_flow_probe.go
          echo "S4_B4_EXACT_SOURCE=$(git rev-parse HEAD)"
      - name: Fresh signed Incus 7.6 and dedicated restricted one-use Project
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates curl gpg dnsmasq-base >/dev/null
          curl -fsSL --max-time 30 https://pkgs.zabbly.com/key.asc -o "$RUNNER_TEMP/key.asc"
          fpr="$(gpg --show-keys --with-colons "$RUNNER_TEMP/key.asc" | awk -F: '$1=="fpr" {print $10; exit}')"
          test "$fpr" = 4EFC590696CB15B87C73A3AD82CC8797C838DCFD
          sudo install -m 0644 "$RUNNER_TEMP/key.asc" /etc/apt/keyrings/s4b4-zabbly.asc
          echo 'deb [arch=amd64 signed-by=/etc/apt/keyrings/s4b4-zabbly.asc] https://pkgs.zabbly.com/incus/stable noble main' | sudo tee /etc/apt/sources.list.d/s4b4-incus.list >/dev/null
          sudo apt-get update -qq
          pkg="$(apt-cache madison incus | awk '/pkgs.zabbly.com/ && $3 ~ /:7[.]6[-.]/ {print $3; exit}')"
          test -n "$pkg"
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends "incus=$pkg" "incus-client=$pkg" "incus-base=$pkg" >/dev/null
          sudo systemctl start incus.service
          sudo incus admin init --auto --storage-backend=dir
          test -z "$(sudo incus list --all-projects --format csv -c n)"
          sudo useradd -m -s /bin/sh boxweave
          sudo usermod -aG incus boxweave
          if id -nG boxweave | tr ' ' '\n' | grep -Eq '^(incus-admin|sudo|lxd|docker)$'; then exit 72; fi
          uid="$(id -u boxweave)"
          test "$uid" -ge 1000
          project="user-$uid"
          echo "S4_B4_PROJECT=$project" >> "$GITHUB_ENV"
          sudo incus network create bwbr0 ipv4.address=10.248.83.1/24 ipv4.nat=true ipv6.address=fd83:248::1/64 ipv6.nat=true ipv6.dhcp.stateful=true
          sudo incus network acl create bw-s4b4-native
          sudo incus project create "$project" \
            -c restricted=true -c features.images=false -c features.profiles=true -c features.networks=false \
            -c restricted.devices.nic=managed -c restricted.networks.access=bwbr0 \
            -c restricted.devices.proxy=allow
          sudo incus --project "$project" profile device add default root disk path=/ pool=default
          sudo incus --project "$project" profile device add default eth0 nic name=eth0 \
            network=bwbr0 security.acls=bw-s4b4-native \
            security.acls.default.ingress.action=reject security.acls.default.egress.action=reject \
            security.ipv4_filtering=true security.ipv6_filtering=true security.mac_filtering=true
          sudo incus --project "$project" init images:ubuntu/24.04 s4b4native -c limits.cpu=1 -c limits.memory=512MiB
          sudo incus --project "$project" config device override s4b4native eth0 \
            ipv4.address=10.248.83.21 ipv6.address=fd83:248::21
          sudo incus --project "$project" start s4b4native
          for i in $(seq 1 50); do
            if sudo incus --project "$project" exec s4b4native -- ip -4 addr show eth0 | grep -q 10.248.83.21; then break; fi
            sleep 2
          done
          sudo incus --project "$project" exec s4b4native -- ip -4 addr show eth0 | grep -q 10.248.83.21
          sudo incus --project "$project" file push "$RUNNER_TEMP/s4b4-echo" s4b4native/root/s4b4-echo
          sudo incus --project "$project" exec s4b4native -- chmod 0755 /root/s4b4-echo
          sudo incus --project "$project" exec s4b4native -- sh -c 'nohup /root/s4b4-echo server >/tmp/s4b4-echo.log 2>&1 </dev/null &'
          for i in $(seq 1 40); do
            if sudo incus --project "$project" exec s4b4native -- test -f /tmp/s4b2-flow-server-ready; then break; fi
            sleep 1
          done
          sudo incus --project "$project" exec s4b4native -- test -f /tmp/s4b2-flow-server-ready
          sudo install -m 0755 "$RUNNER_TEMP/s4b4-native-test" /usr/local/bin/s4b4-native-test
          sudo install -m 0755 "$RUNNER_TEMP/s4b4-control-test" /usr/local/bin/s4b4-control-test
          echo S4_B4_DISPOSABLE_NATIVE_FIXTURE_READY=PASS
      - name: Real nonroot SDK ETag proxy TCP UDP packets and exact deletion
        shell: bash
        run: |
          set -euo pipefail
          test "$S4_B4_PROJECT" = "user-$(id -u boxweave)"
          test -S /var/lib/incus/unix.socket.user
          sudo -u boxweave env GITHUB_ACTIONS=true BOXWEAVE_B4_NATIVE_ONE_USE=s4b4-disposable-only-20261119 \
            /usr/local/bin/s4b4-native-test -test.v -test.run '^TestB4NativeOwnedProxyTCPUDP$' | tee "$RUNNER_TEMP/s4b4-native.log"
          grep -Fq 'S4_B4_NATIVE_tcp_ORIGINAL_ETAG_PROXY_PACKET=PASS' "$RUNNER_TEMP/s4b4-native.log"
          grep -Fq 'S4_B4_NATIVE_udp_ORIGINAL_ETAG_PROXY_PACKET=PASS' "$RUNNER_TEMP/s4b4-native.log"
          grep -Fq 'S4_B4_NATIVE_tcp_REMOVAL_PACKET_REFUSED=PASS' "$RUNNER_TEMP/s4b4-native.log"
          grep -Fq 'S4_B4_NATIVE_udp_REMOVAL_PACKET_REFUSED=PASS' "$RUNNER_TEMP/s4b4-native.log"
          echo S4_B4_NATIVE_NONROOT_SDK_TCP_UDP_PACKET_PASS
      - name: Installed authenticated HTTP MCP create list delete and packet evidence
        shell: bash
        run: |
          set -euo pipefail
          test "$S4_B4_PROJECT" = "user-$(id -u boxweave)"
          sudo -u boxweave env GITHUB_ACTIONS=true BOXWEAVE_B4_MCP_ONE_USE=s4b4-disposable-only-20261119             /usr/local/bin/s4b4-control-test -test.v -test.run '^TestB4InstalledMCPNativeCreateListDelete$' | tee "$RUNNER_TEMP/s4b4-mcp.log"
          grep -Fq 'S4_B4_MCP_tcp_REAL_CREATION_REPLAY_CONFLICT_PACKET_DELETE=PASS' "$RUNNER_TEMP/s4b4-mcp.log"
          grep -Fq 'S4_B4_MCP_udp_REAL_CREATION_REPLAY_CONFLICT_PACKET_DELETE=PASS' "$RUNNER_TEMP/s4b4-mcp.log"
          grep -Fq 'S4_B4_INSTALLED_AUTHENTICATED_23_TOOL_HTTP_MCP_ORIGINAL_SQLITE_INCUS_TCP_UDP=PASS' "$RUNNER_TEMP/s4b4-mcp.log"
          grep -Fq 'S4_B4_MCP_NATIVE_OCCUPIED_HOST_LISTENER_NO_FALSE_SUCCESS=PASS' "$RUNNER_TEMP/s4b4-mcp.log"
          grep -Fq 'S4_B4_MCP_EXTERNAL_DENY_MISSING_CONSENT_ADDRESS_PORT_WILDCARD=PASS' "$RUNNER_TEMP/s4b4-mcp.log"
          for binding in external-v4-tcp external-v4-udp external-v6-tcp external-v6-udp; do
            grep -Fq "S4_B4_MCP_${binding}_REAL_CREATION_REPLAY_CONFLICT_PACKET_DELETE=PASS" "$RUNNER_TEMP/s4b4-mcp.log"
          done
          if test "$GITHUB_REF" = "refs/heads/feat/v1-forward-all-20261121"; then
            sudo -u boxweave env GITHUB_ACTIONS=true BOXWEAVE_B4_MCP_ONE_USE=s4b4-disposable-only-20261119 BOXWEAVE_B4_FORWARD_POLICY=all /usr/local/bin/s4b4-control-test -test.v -test.run '^TestB4InstalledMCPNativeCreateListDelete$' | tee "$RUNNER_TEMP/forward-all.log"
            grep -Fq 'FORWARD_ALL_MCP_NO_ACK_OR_FOREIGN_ADDRESS_DENIED=PASS' "$RUNNER_TEMP/forward-all.log"
            for binding in arbitrary-port wildcard-v4-tcp wildcard-v4-udp wildcard-v6-tcp wildcard-v6-udp; do
              grep -Fq "S4_B4_MCP_${binding}_REAL_CREATION_REPLAY_CONFLICT_PACKET_DELETE=PASS" "$RUNNER_TEMP/forward-all.log"
            done
            grep -Fq 'FORWARD_ALL_NATIVE_WILDCARD_PACKET_AND_CLEANUP=PASS' "$RUNNER_TEMP/forward-all.log"
          fi
          sudo -u boxweave env GITHUB_ACTIONS=true BOXWEAVE_B4_MCP_ONE_USE=s4b4-disposable-only-20261119 /usr/local/bin/s4b4-control-test -test.v -test.run '^TestB4NativeOriginalCrashRecovery$' | tee "$RUNNER_TEMP/s4b4-crash.log"
          grep -Fq 'S4_B4_NATIVE_REAL_PROCESS_KILL_ACK_AND_POSTREAD_MATRIX=PASS' "$RUNNER_TEMP/s4b4-crash.log"
          sudo incus --project "$S4_B4_PROJECT" config device show s4b4native | tee "$RUNNER_TEMP/s4b4-device-readback.txt"
          if grep -q 'bwpf-' "$RUNNER_TEMP/s4b4-device-readback.txt"; then
            echo S4_B4_NATIVE_PROXY_LEAK; exit 70
          fi
          if test "$GITHUB_REF" = "refs/heads/feat/v1-s5a-closeout-20261120" || test "$GITHUB_REF" = "refs/heads/feat/v1-s5b-acceptance-20261120"; then
            sudo -u boxweave env GITHUB_ACTIONS=true BOXWEAVE_B4_MCP_ONE_USE=s4b4-disposable-only-20261119 /usr/local/bin/s4b4-control-test -test.v -test.run '^TestS5A4NativeMCPNetworkRecovery$' | tee "$RUNNER_TEMP/s5a4-native.log"
            grep -Fq S5_A4_FORWARD_REAL_IPV4_IPV6_TCP_UDP_RECOVERY=PASS "$RUNNER_TEMP/s5a4-native.log"
            grep -Fq S5_A4_DEPENDENT_DELETE_NATIVE_RECOVERY=PASS "$RUNNER_TEMP/s5a4-native.log"
          else
            sudo -u boxweave env GITHUB_ACTIONS=true BOXWEAVE_B4_MCP_ONE_USE=s4b4-disposable-only-20261119 /usr/local/bin/s4b4-control-test -test.v -test.run '^TestB5NativeMCPForwardDependentDelete$' | tee "$RUNNER_TEMP/s4b5-native.log"
            grep -Fq 'S4_B5_NATIVE_MCP_FORWARD_DEPENDENT_DELETE=PASS' "$RUNNER_TEMP/s4b5-native.log"
          fi
          for cut in before-ack after-ack receipt-unavailable protected-partial; do
            sudo incus --project "$S4_B4_PROJECT" init images:ubuntu/24.04 s4b5ack -c limits.cpu=1 -c limits.memory=512MiB
            sudo incus --project "$S4_B4_PROJECT" config device override s4b5ack eth0 ipv4.address=10.248.83.22 ipv6.address=fd83:248::22
            sudo incus --project "$S4_B4_PROJECT" start s4b5ack
            sudo incus --project "$S4_B4_PROJECT" file push "$RUNNER_TEMP/s4b4-echo" s4b5ack/root/s4b4-echo
            sudo incus --project "$S4_B4_PROJECT" exec s4b5ack -- chmod 0755 /root/s4b4-echo
            sudo incus --project "$S4_B4_PROJECT" exec s4b5ack -- sh -c 'nohup /root/s4b4-echo server >/tmp/s4b4-echo.log 2>&1 </dev/null &'
            for i in $(seq 1 40); do
              if sudo incus --project "$S4_B4_PROJECT" exec s4b5ack -- test -f /tmp/s4b2-flow-server-ready; then break; fi
              sleep 1
            done
            sudo incus --project "$S4_B4_PROJECT" exec s4b5ack -- test -f /tmp/s4b2-flow-server-ready
            sudo -u boxweave env GITHUB_ACTIONS=true BOXWEAVE_B4_MCP_ONE_USE=s4b4-disposable-only-20261119 BW_B5_ACK_CUT="$cut" /usr/local/bin/s4b4-control-test -test.v -test.run '^TestB5NativeDeleteAckLoss$' | tee "$RUNNER_TEMP/b5-$cut.log"
            case "$cut" in
              before-ack)
                grep -Fq 'S4_B5_MISSING_ACK_NOT_INFERRED_SUCCESS=PASS' "$RUNNER_TEMP/b5-$cut.log" ;;
              after-ack)
                grep -Fq 'S4_B5_KNOWN_TERMINAL_DELETE_REVIEWED_ATOMIC_SETTLEMENT=PASS' "$RUNNER_TEMP/b5-$cut.log" ;;
              receipt-unavailable)
                grep -Fq 'S4_B5_EXPIRED_OR_MISSING_NATIVE_RECEIPT_UNKNOWN=PASS' "$RUNNER_TEMP/b5-$cut.log" ;;
              protected-partial)
                grep -Fq 'S4_B5_ACTUAL_FINAL_NATIVE_DELETE_FAILED=PASS' "$RUNNER_TEMP/b5-$cut.log"
                grep -Fq 'S4_B5_REAL_PARTIAL_CLEANUP_FINAL_DELETE_REFUSED_UNKNOWN=PASS' "$RUNNER_TEMP/b5-$cut.log"
                test "$(sudo incus --project "$S4_B4_PROJECT" config get s4b5ack security.protection.delete)" = true
                sudo incus --project "$S4_B4_PROJECT" config set s4b5ack security.protection.delete=false
                sudo incus --project "$S4_B4_PROJECT" delete s4b5ack ;;
            esac
          done
          sudo incus project delete "$S4_B4_PROJECT"
          sudo incus network acl delete bw-s4b4-native
          sudo incus network delete bwbr0
          test -z "$(sudo incus list --all-projects --format csv -c n)"
          echo S4_B4_NATIVE_SCOPED_TCP_UDP_SOURCE_PACKET_CLEANUP=PASS
