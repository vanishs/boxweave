name: S2 disposable real native acceptance (non-release)

on:
  push:
    branches:
      - feat/v1-s2-operations-20261110
  workflow_dispatch:

permissions:
  contents: read

jobs:
  s2-native-blackbox:
    if: github.repository == 'vanishs/boxweave' && github.ref == 'refs/heads/feat/v1-s2-operations-20261110'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RUNNER_ENVIRONMENT: github-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Reject malformed disposable native acceptance shell
        shell: bash
        run: sh -n scripts/accept_s2_native.sh && sh -n scripts/s2_exec_gc_installed_review.sh && sh -n scripts/s2_p0_native_sqlite_fault.sh && sh -n scripts/s2_p0_unknown_review.sh && sh -n scripts/s2_p0_unbound_create_review.sh && sh -n scripts/s2_p1_stop_delete_fault.sh && sh -n scripts/s2_p1_token_inflight.sh && sh -n scripts/s2_p1_two_controllers.sh && sh -n scripts/s2_p1_private_read_inflight.sh && sh -n scripts/s2_p1_bound_create_receipt_fault.sh && sh -n scripts/s2_p2_malformed_exec_fault.sh && sh -n scripts/s2_p2_alternate_pool.sh && sh -n scripts/s2_p1_operation_list_boundary.sh && sh -n scripts/s2_p1_native_create_delete_overlap.sh && python3 -c "import ast,pathlib; ast.parse(pathlib.Path('scripts/s2_p3_evidence_audit.py').read_text())"
      - name: Independently reject forged or incomplete P3 native evidence
        shell: bash
        run: python3 scripts/test_s2_p3_evidence_audit.py
      - name: Reject unsafe test hosts and execute original MCP/native lifecycle
        shell: bash
        run: |
          set -o pipefail
          sh scripts/accept_s2_native.sh | tee "$RUNNER_TEMP/s2-native-acceptance.log"
          python3 scripts/s2_p3_evidence_audit.py \
            --log "$RUNNER_TEMP/s2-native-acceptance.log" \
            --source "$GITHUB_SHA" \
            --output "$RUNNER_TEMP/s2-native-acceptance-report.json"
