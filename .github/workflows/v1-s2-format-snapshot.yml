name: S2 temporary source formatter (disposable PR branch)

on:
  push:
    branches:
      - feat/v1-s2-operations-20261110

permissions:
  contents: read

jobs:
  source-format-snapshot:
    if: github.repository == 'vanishs/boxweave'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Print gofmt-only source snapshots for review
        shell: bash
        run: |
          set -euo pipefail
          for f in cmd/boxweave/main.go cmd/boxweave/recover.go cmd/boxweave/serve_lock.go cmd/boxweave/serve_lock_test.go internal/state/store.go internal/state/replay.go internal/state/replay_test.go internal/state/lifecycle.go internal/state/lifecycle_test.go internal/state/operation_query.go internal/state/operation_query_test.go internal/state/exec_gc.go internal/state/exec_gc_review.go internal/state/exec_gc_test.go internal/native/exec_gc.go internal/control/exec_gc.go internal/state/worker.go internal/native/box.go internal/native/box_test.go internal/native/storage_filesystem.go internal/native/storage_filesystem_test.go internal/control/box_tools.go internal/control/operation_output_cancel.go internal/control/strict_tool.go internal/control/strict_tool_test.go internal/control/private_read.go internal/control/private_read_test.go internal/control/server.go internal/control/server_test.go internal/control/operation_tools_test.go internal/control/continuity_test.go scripts/s2_native_probe.go scripts/s2_crash_probe.go scripts/s2_queued_cancel_seed.go scripts/s2_native_guest_quota_probe.go scripts/s2_mcp_quota_probe.go scripts/s2_exec_gc_probe.go scripts/s2_sqlite_fsync_probe.go scripts/s2_ack_loss_probe.go scripts/s2_ack_loss_proxy.go scripts/s2_p0_native_sqlite_proxy.go scripts/s2_p0_native_sqlite_probe.go scripts/s2_p1_stop_delete_proxy.go scripts/s2_p1_stop_delete_probe.go scripts/s2_p1_token_inflight_probe.go; do
            gofmt -w "$f"
            printf 'BOXWEAVE_FORMAT_BEGIN:%s\n' "$f"
            base64 -w0 "$f"
            printf '\nBOXWEAVE_FORMAT_END:%s\n' "$f"
          done
